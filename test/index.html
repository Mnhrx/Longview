<html lang="en">

<style>
:root{
  --bg:#06080a; --panel:rgba(12,16,15,.9); --line:rgba(255,255,255,.09);
  --text:#e9f2ee; --dim:#8c9a94; --mint:#7CFFB2; --gold:#FFD27A;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:"Space Grotesk",system-ui,sans-serif;overflow:hidden}
#map{position:fixed;inset:0;background:#0b0e0f}
#roads,#flood,#fx{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:500}
#flood{z-index:499}
#roads{z-index:498;opacity:0}
.maplibregl-ctrl-attrib{background:rgba(0,0,0,.5)!important;color:#7a8781!important;font-size:9px!important}
.maplibregl-ctrl-attrib a{color:#9fb0a8!important}
.maplibregl-ctrl-attrib-button{filter:invert(1);opacity:.5}
.maplibregl-ctrl-top-right{top:calc(var(--safe-t) + 4px)}
.spot{position:relative;width:24px;height:24px;cursor:pointer}
.spot i{position:absolute;inset:7px;border-radius:50%;border:1.5px solid rgba(255,210,122,.5);background:rgba(255,210,122,.25)}
.spot b{position:absolute;top:24px;left:50%;transform:translateX(-50%);font:600 10px "JetBrains Mono",monospace;letter-spacing:.08em;color:rgba(255,214,140,.55);white-space:nowrap}
.spot.sel i{inset:0;background:radial-gradient(circle,#fff3d6 0,#ffd27a 35%,rgba(255,210,122,0) 72%);border:1.5px solid rgba(255,210,122,.85);animation:pulse 2.4s ease-in-out infinite}
.spot.sel b{top:30px;color:#ffd68c}
@keyframes pulse{50%{transform:scale(1.22);box-shadow:0 0 26px 6px rgba(255,210,122,.35)}}

header{position:fixed;z-index:600;top:calc(var(--safe-t) + 12px);left:14px;pointer-events:none}
header h1{margin:0;font-size:22px;letter-spacing:.32em;font-weight:700;color:var(--mint);text-shadow:0 0 18px rgba(124,255,178,.55)}
header p{margin:2px 0 0;font:500 11px "JetBrains Mono",monospace;letter-spacing:.14em;color:var(--dim);text-transform:uppercase}

#sheet{position:fixed;z-index:700;left:0;right:0;bottom:0;max-height:52vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line);border-radius:22px 22px 0 0;padding:10px 16px calc(16px + var(--safe-b))}
#hint{font-size:14px;color:var(--dim);margin-bottom:10px;line-height:1.4}
#hint a{color:var(--mint);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
#friends{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.friend{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.025)}
.dot{width:12px;height:12px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c);flex:none}
.friend .nm{flex:1;min-width:0;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.friend .tm{font:600 13px "JetBrains Mono",monospace;color:var(--c);min-width:58px;text-align:right}
.friend .x{border:0;background:none;color:var(--dim);font-size:20px;line-height:1;padding:0 2px;cursor:pointer}
.row{display:flex;gap:8px;margin-bottom:8px}
input{flex:1;min-width:0;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:12px;color:var(--text);
  font:500 16px "Space Grotesk",sans-serif;padding:11px 12px;outline:none}
input:focus{border-color:rgba(124,255,178,.5)}
button.b{border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--text);border-radius:12px;
  font:600 14px "Space Grotesk",sans-serif;padding:11px 13px;cursor:pointer;white-space:nowrap}
button.b:active{transform:scale(.97)}
button.primary{flex:1;background:var(--mint);color:#04140b;border-color:transparent;box-shadow:0 0 22px rgba(124,255,178,.35)}
button.b:disabled{opacity:.35;box-shadow:none}
#status{font:500 12px "JetBrains Mono",monospace;color:var(--mint);letter-spacing:.06em;min-height:16px;margin:4px 0 6px}
#status.err{color:#ff8a8a}
.card{border:1px solid rgba(255,210,122,.35);border-radius:16px;padding:12px 14px;margin:6px 0 10px;
  background:linear-gradient(160deg,rgba(255,210,122,.09),rgba(255,210,122,.02))}
.card .k{font:600 10px "JetBrains Mono",monospace;letter-spacing:.2em;color:var(--gold);text-transform:uppercase}
.card .road{font-size:20px;font-weight:700;margin:3px 0 2px}
.card .sub{font-size:13px;color:var(--dim)}
.card a{display:inline-block;margin-top:8px;color:var(--gold);font-size:13px;font-weight:600;text-decoration:none}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:6px}
.chip{flex:none;border:1px solid var(--line);border-radius:999px;padding:6px 11px;font-size:12px;color:var(--dim);background:none;cursor:pointer;font-family:inherit}
.chip.on{color:#04140b;background:var(--gold);border-color:transparent}
.place{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.place:last-child{border-bottom:0}
.place .pn{flex:1;min-width:0}
.place .pn b{display:block;font-weight:500;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.place .pn span{font-size:12px;color:var(--dim)}
.place .pd{font:600 12px "JetBrains Mono",monospace;color:var(--gold)}
.tag{display:none;font-size:10px;padding:1px 6px;border-radius:6px;background:rgba(124,255,178,.14);color:var(--mint);margin-left:4px;vertical-align:1px}
.empty{color:var(--dim);font-size:13px;padding:8px 0}
.tabs{display:flex;gap:4px;padding:4px;border:1px solid var(--line);border-radius:14px;margin:4px 0 8px}
.tabs button{flex:1;border:0;border-radius:10px;padding:9px;background:none;color:var(--dim);font:600 14px "Space Grotesk",sans-serif;cursor:pointer}
.tabs button.on{background:rgba(255,210,122,.16);color:var(--gold)}
.tabs button small{display:block;font:500 11px "JetBrains Mono",monospace;opacity:.8;margin-top:1px}

.pin{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:#06100b;
  font:700 13px "JetBrains Mono",monospace;box-shadow:0 0 0 4px rgba(0,0,0,.45),0 0 18px var(--c);border:2px solid rgba(255,255,255,.75)}
.maplibregl-popup-content{background:#121816;color:var(--text);font-family:"Space Grotesk",sans-serif;border-radius:10px;padding:10px 12px}
.maplibregl-popup-tip{border-top-color:#121816!important;border-bottom-color:#121816!important}
.maplibregl-popup-content a{color:var(--gold)}
#toast{position:fixed;z-index:800;left:50%;top:calc(var(--safe-t) + 64px);transform:translateX(-50%) translateY(-10px);opacity:0;
  background:#1a2220;border:1px solid var(--line);padding:9px 14px;border-radius:12px;font-size:13px;transition:.25s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1;transform:translateX(-50%)}
.grip{position:relative;height:22px;margin:-10px -16px 4px;cursor:pointer;background:none;width:auto;border-radius:0}
.grip::before{content:"";position:absolute;left:50%;top:9px;width:38px;height:4px;margin-left:-19px;border-radius:4px;background:rgba(255,255,255,.22)}
#bar{display:none;align-items:center;gap:10px;min-height:44px}
#barTxt{flex:1;min-width:0;font:500 13px "JetBrains Mono",monospace;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#barTxt.live{color:var(--mint)} #barTxt.err{color:#ff8a8a}
#bar .b{padding:9px 14px;flex:none}
#sheet.collapsed{overflow:hidden}
#sheet.collapsed #full{display:none}
#sheet.collapsed #bar{display:flex}
.seg{display:flex;gap:4px;padding:4px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
.seg span{align-self:center;font:500 11px "JetBrains Mono",monospace;color:var(--dim);letter-spacing:.08em;padding:0 6px 0 4px;text-transform:uppercase}
.seg button{flex:1;border:0;border-radius:9px;padding:8px;background:none;color:var(--dim);font:600 14px "Space Grotesk",sans-serif;cursor:pointer}
.seg button.on{background:rgba(124,255,178,.14);color:var(--mint)}
#mute{position:fixed;z-index:650;top:calc(var(--safe-t) + 46px);right:10px;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);
  background:rgba(12,16,15,.75);color:var(--dim);display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#mute svg{width:18px;height:18px}
@media (min-width:700px){#sheet{left:16px;right:auto;width:400px;bottom:16px;border-radius:22px;border:1px solid var(--line);max-height:calc(100vh - 110px)}}
</style>
</head>
<body>
<div id="map"></div>
<canvas id="roads"></canvas>
<canvas id="flood"></canvas>
<canvas id="fx"></canvas>
<header><h1>SPORE</h1><p>meet in the middle</p></header>
<div id="toast"></div>

<button id="mute" aria-label="Sound on"></button>
<section id="sheet">
  <div class="grip" id="grip" aria-label="Show or hide panel"></div>
  <div id="bar"><span id="barTxt"></span><button class="b primary" id="go2">Find hangout</button></div>
  <div id="full">
  <div id="hint">Tap the map to drop each friend, 2 to 6 people. Drag a pin to move it. <a id="demo">Try 4 sample friends</a></div>
  <div id="friends"></div>
  <div class="row">
    <input id="q" placeholder="Postal code or place" enterkeyhint="go" autocomplete="off">
    <button class="b" id="addQ">Add</button>
    <button class="b" id="addMe">Me</button>
  </div>
  <div class="seg" id="mode"><span>Measure</span><button data-m="time" class="on">Time</button><button data-m="dist">Distance</button></div>
  <div class="row">
    <button class="b primary" id="go">Find hangout</button>
    <button class="b" id="clear">Clear</button>
  </div>
  <div id="status"></div>
  <div id="out"></div>
  </div>
</section>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
/* ===== Spore — meet in the middle =====
   Everything comes from OpenFreeMap (free, no key, served from a CDN):
   - the map you see
   - the roads the spores spread along (read straight out of the same map tiles)
   - the places nearby
   How the spot is found
   1. Read every road in the area from the map tiles and stitch them into one road network.
   2. Every friend's spore spreads along ALL roads at once, at the speed you'd ride each road
      (Dijkstra's algorithm visits roads in order of ride time, like a spreading front).
   3. The first road point every colour reaches = SOONEST meetup. Only the branches that reach it stay.
   4. The bloom drifts to the EQUAL spot: closest ride times for everyone, with the slowest ride
      no more than ~30% longer than at the soonest spot.                                          */

const STYLE_URL = 'https://tiles.openfreemap.org/styles/positron';
const ONEMAP = 'https://www.onemap.gov.sg/api/common/elastic/search';
const COLORS = ['#7CFFB2','#FFB86B','#B48CFF','#6BD8FF','#FF7AA8','#E8FF6B'];
// typical riding speeds (km/h) per road class, including a bit of junction/light time
const SPEED = {motorway:70, trunk:50, primary:40, secondary:35, tertiary:30, minor:22};
const RAMP_SPEED = 35;
const FLOOD_MS = 7500;
const EQUAL_SLACK = 1.3;

const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const frameWait = () => new Promise(r => requestAnimationFrame(()=>requestAnimationFrame(r)));
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const rand = (a,b) => a + Math.random()*(b-a);
const ease = u => u<.5 ? 2*u*u : 1-Math.pow(-2*u+2,2)/2;
function hav(a,b){ const R=6371000, t=Math.PI/180, dLa=(b[0]-a[0])*t, dLo=(b[1]-a[1])*t;
  const s=Math.sin(dLa/2)**2+Math.cos(a[0]*t)*Math.cos(b[0]*t)*Math.sin(dLo/2)**2; return 2*R*Math.asin(Math.sqrt(s)); }
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),2600); }
function status(m,err){ const s=$('status'); s.textContent=m||''; s.classList.toggle('err',!!err); updateBar(); }
const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtMin = s => s==null||!isFinite(s) ? '' : Math.max(1, Math.round(s/60)) + ' min';
let MODE='time';   // 'time' = ride minutes, 'dist' = road km
const fmtV=(v,mode=MODE)=> v==null||!isFinite(v) ? '' : mode==='dist' ? (v<950 ? Math.max(50,Math.round(v/50)*50)+' m' : (v/1000).toFixed(1)+' km') : fmtMin(v);
function rangeTxt(lo,hi,mode){ const a=fmtV(lo,mode), b=fmtV(hi,mode); if(a===b) return a;
  const [na,ua]=a.split(' '), [nb,ub]=b.split(' '); return ua===ub ? na+'–'+b : a+' – '+b; }
const fmtDist = m => m<1000 ? Math.round(m/10)*10+' m' : (m/1000).toFixed(1)+' km';
const titleCase = s => s.toLowerCase().replace(/\b\w/g, c=>c.toUpperCase());
function rgba(hex,a){ const n=parseInt(hex.slice(1),16); return `rgba(${n>>16},${n>>8&255},${n&255},${a})`; }
const sheetH = () => $('sheet').getBoundingClientRect().height + 10;
async function getJSON(url, ms=15000){
  const c=new AbortController(), h=setTimeout(()=>c.abort(),ms);
  try{ const r=await fetch(url,{signal:c.signal}); if(!r.ok) throw new Error('HTTP '+r.status); return await r.json(); } finally{ clearTimeout(h); } }

/* ---------- sound effects: synthesised with Web Audio, no files ---------- */
const Snd={ctx:null,muted:false,
  init(){ try{ if(!this.ctx){ const C=window.AudioContext||window.webkitAudioContext; this.ctx=new C();
      this.master=this.ctx.createGain(); this.master.gain.value=this.muted?0:.8; this.master.connect(this.ctx.destination);
      const n=Math.floor(this.ctx.sampleRate*.04), b=this.ctx.createBuffer(1,n,this.ctx.sampleRate), d=b.getChannelData(0);
      for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3); this.noise=b; }
    if(this.ctx.state!=='running') this.ctx.resume(); }catch(e){} },
  setMuted(m){ this.muted=m; if(this.master) this.master.gain.setTargetAtTime(m?0:.8,this.ctx.currentTime,.05); },
  ok(){ return this.ctx&&!this.muted&&this.ctx.state==='running'; },
  env(g,t,peak,att,dec){ g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(peak,t+att); g.gain.exponentialRampToValueAtTime(.0001,t+att+dec); },
  pop(delay=0){ if(!this.ok()) return; const c=this.ctx, t=c.currentTime+delay, o=c.createOscillator(), g=c.createGain();
    o.type='sine'; o.frequency.setValueAtTime(720,t); o.frequency.exponentialRampToValueAtTime(170,t+.14); this.env(g,t,.32,.006,.17);
    o.connect(g).connect(this.master); o.start(t); o.stop(t+.2); },
  crackle(k){ if(!this.ok()) return; const c=this.ctx;
    for(let i=0;i<k;i++){ const t=c.currentTime+Math.random()*.04, s=c.createBufferSource(), f=c.createBiquadFilter(), g=c.createGain();
      s.buffer=this.noise; s.playbackRate.value=.6+Math.random()*1.3; f.type='bandpass'; f.frequency.value=1600+Math.random()*3400; f.Q.value=1.4;
      g.gain.value=.05+Math.random()*.07; s.connect(f).connect(g).connect(this.master); s.start(t); } },
  chime(vol=1){ if(!this.ok()) return; const c=this.ctx, t=c.currentTime;
    [523.25,659.25,783.99,1046.5].forEach((fq,i)=>{ const o=c.createOscillator(), g=c.createGain(), st=t+i*.07;
      o.type='sine'; o.frequency.value=fq; this.env(g,st,.16*vol,.02,2.1); o.connect(g).connect(this.master); o.start(st); o.stop(st+2.3); });
    const o=c.createOscillator(), g=c.createGain(); o.type='triangle'; o.frequency.value=130.8; this.env(g,t,.12*vol,.3,2.1);
    o.connect(g).connect(this.master); o.start(t); o.stop(t+2.5); },
  glide(ms){ if(!this.ok()) return; const c=this.ctx, t=c.currentTime, d=ms/1000, o=c.createOscillator(), f=c.createBiquadFilter(), g=c.createGain();
    o.type='triangle'; o.frequency.setValueAtTime(330,t); o.frequency.exponentialRampToValueAtTime(495,t+d); f.type='lowpass'; f.frequency.value=1400;
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.08,t+.3); g.gain.setValueAtTime(.08,t+d-.3); g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(f).connect(g).connect(this.master); o.start(t); o.stop(t+d+.05); }
};
const SPK_ON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
const SPK_OFF='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="m22 9-6 6M16 9l6 6"/></svg>';
function paintMute(){ const b=$('mute'); b.innerHTML=Snd.muted?SPK_OFF:SPK_ON; b.setAttribute('aria-label',Snd.muted?'Sound off':'Sound on'); }
try{ Snd.muted=localStorage.getItem('spore-muted')==='1'; }catch(e){}
paintMute();
$('mute').onclick=()=>{ Snd.init(); Snd.setMuted(!Snd.muted); try{ localStorage.setItem('spore-muted',Snd.muted?'1':'0'); }catch(e){} paintMute(); if(!Snd.muted) Snd.pop(); };

/* ---------- dark version of OpenFreeMap's Positron style ---------- */
function darken(st){
  st.layers=st.layers.filter(l=>!(l.type==='symbol' && /poi/i.test(l.id)));
  for(const l of st.layers){
    const p=l.paint=l.paint||{}, id=l.id.toLowerCase();
    if(l.type==='background') p['background-color']='#080a0b';
    else if(l.type==='fill'){ delete p['fill-pattern'];
      p['fill-color']=/water|ocean|lake/.test(id)?'#0a1317':/park|wood|grass|landcover|green|forest/.test(id)?'#0b110e':/building/.test(id)?'#101516':'#0b0e0f';
      if('fill-outline-color' in p) p['fill-outline-color']='#141a1b'; }
    else if(l.type==='fill-extrusion') p['fill-extrusion-color']='#111718';
    else if(l.type==='line'){ delete p['line-pattern'];
      p['line-color']=/casing|outline/.test(id)?'#0b0e0f':/water|river|stream|canal/.test(id)?'#0f1c22':/boundary|admin/.test(id)?'#2a3035':
        /rail|transit/.test(id)?'#1a1f1f':/motorway|trunk|highway/.test(id)?'#2c3532':/primary|secondary|major/.test(id)?'#242c2a':'#1a201f'; }
    else if(l.type==='symbol'){
      if(l.layout&&l.layout['text-field']){ p['text-color']=/place|city|town|country|state|suburb/.test(id)?'#a2b0aa':'#68756f'; p['text-halo-color']='#080a0b'; }
      if('icon-color' in p) p['icon-color']='#68756f'; }
    else if(l.type==='circle') p['circle-color']='#2a3330';
  }
  return st;
}

/* ---------- map ---------- */
let map, TILE_URL=null, mapReady=false;
let friends=[], busy=false, res=null, spotMarkers={}, floodSt=null;
const EMPTY={type:'FeatureCollection',features:[]};
async function initMap(){
  let style;
  try{ style=darken(await getJSON(STYLE_URL)); }
  catch(e){ status('Can\'t reach the map server. Check your connection and reload.',true);
    style={version:8,sources:{},layers:[{id:'bg',type:'background',paint:{'background-color':'#080a0b'}}]}; }
  map=new maplibregl.Map({container:'map', style, center:[103.8198,1.3521], zoom:10.2, attributionControl:false,
    dragRotate:false, pitchWithRotate:false, maxPitch:0});
  map.touchZoomRotate.disableRotation();
  map.addControl(new maplibregl.AttributionControl({compact:true}),'top-right');
  map.on('load',()=>{
    for(const s of ['old','cur','places']) map.addSource(s,{type:'geojson',data:EMPTY});
    for(const s of ['old','cur']){
      map.addLayer({id:s+'-glow',type:'line',source:s,layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':['get','color'],'line-width':10,'line-blur':6,'line-opacity':.3}});
      map.addLayer({id:s+'-core',type:'line',source:s,filter:['!=',['get','tun'],1],layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':['get','color'],'line-width':2.6,'line-opacity':.95}});

const tileCache=new Map();
async function getTile(z,x,y){
  const key=z+'/'+x+'/'+y; if(tileCache.has(key)) return tileCache.get(key);
  const p=(async()=>{
    const url=TILE_URL.replace('{z}',z).replace('{x}',x).replace('{y}',y);
    let lastErr;
    for(let attempt=0;attempt<3;attempt++){
      try{
        const r=await fetch(url); if(r.status===204||r.status===404) return {roads:[],names:[],pois:[]};
        if(!r.ok) throw new Error('HTTP '+r.status);
        let buf=new Uint8Array(await r.arrayBuffer());
        if(buf[0]===0x1f&&buf[1]===0x8b) buf=new Uint8Array(await new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer());
        return parseTile(decodeMVT(buf,{transportation:1,transportation_name:1,poi:1}),z,x,y);
      }catch(e){ lastErr=e; await sleep(400*(attempt+1)); }
    }

function parseTile(L,z,tx,ty){

  const T=L.transportation;

    const c=f.props.class; if(f.type!==2||!(c in SPEED)) continue;
    for(const ln of f.lines) for(const piece of clipLine(ln,0,T.extent))

    for(const ln of f.lines) for(const p of ln) if(p[0]>=0&&p[1]>=0&&p[0]<=N.extent&&p[1]<=N.extent) names.push([...toLL(N.extent,p),nm]); }

    const p=f.lines[0][0]; if(p[0]<0||p[1]<0||p[0]>Q.extent||p[1]>Q.extent) continue;
    const cat=catOf(f.props.class,f.props.subclass); if(!cat) continue;

function catOf(c,s){
  if(c==='restaurant'||c==='fast_food'||s==='food_court') return 'Food';
  if(c==='cafe'||c==='ice_cream') return 'Coffee';
  if(c==='bar'||c==='beer') return 'Drinks';
  if(c==='park'||s==='park'||s==='garden'||s==='nature_reserve') return 'Parks';
  if(s==='mall'||s==='department_store') return 'Malls';
  if(c==='attraction'||c==='museum'||c==='art_gallery'||c==='zoo'||c==='castle'||s==='viewpoint'||s==='museum'||s==='attraction') return 'Sights';

async function loadTiles(z,bb,onProg){

   The spores spread through what's loaded; whenever a spore enters a tile, the tiles around it

    await sleep(350);

    setPaths(soon,1300);
    await sleep(1700);
    floodSt=null; fctx.clearRect(0,0,innerWidth,innerHeight); rctx.clearRect(0,0,innerWidth,innerHeight);
    renderResult();
    if(equal){
      await sleep(900);
      status('Drifting to equal rides…');
      res.sel='equal'; addSpot('equal',soon.ll);
      setPaths(equal,1500,250); Snd.glide(1800);
      tweenTimes(soon.secs,equal.secs,1800);
      await moveSpot('equal',soon.ll,equal.ll,1800);
      vis.bursts.push({ll:equal.ll,t0:performance.now(),sparks:sparks()}); Snd.chime(.6);

  }
  busy=false; lockMap(false); render();

};

function selectSpot(kind){
  if(busy||!res||res.sel===kind||(kind==='equal'&&!res.equal)) return;
  res.sel=kind; const s=curSpot(); setPaths(s,900); Snd.pop(); markSelected(); renderResult(); map.easeTo({center:[s.ll[1],s.ll[0]]});
}
function renderResult(){
  if(!res) return; markSelected();
  const s=curSpot(), lo=Math.min(...s.secs), hi=Math.max(...s.secs);
  const tab=(k,label,sp)=>`<button data-tab="${k}" class="${res.sel===k?'on':''}">${label}<small>${rangeTxt(Math.min(...sp.secs),Math.max(...sp.secs),sp.mode)}</small></button>`;
  const dm=s.mode==='dist', same=fmtV(lo,s.mode)===fmtV(hi,s.mode);
  const sub = s.kind==='soon'
    ? (dm ? (same?`Everyone rides ${fmtV(hi,'dist')}`:`Furthest rider ${fmtV(hi,'dist')} · rides ${rangeTxt(lo,hi,'dist')}`)
          : (same?`Everyone's there in ${fmtV(hi)}`:`Everyone's there in ${fmtV(hi)} · rides ${rangeTxt(lo,hi)}`))
    : `Everyone rides ${rangeTxt(lo,hi,s.mode)}`;
  $('out').innerHTML=(res.equal?`<div class="tabs">${tab('soon','Soonest',res.soon)}${tab('equal','Equal',res.equal)}</div>`:'')+
    `<div class="card"><div class="k">${s.kind==='soon'?'Soonest meetup':'Equal rides'}</div>
     <div class="road">${esc(s.road||'Unnamed road')}</div>
     <div class="sub">${sub}</div>
     <a href="https://www.google.com/maps/search/?api=1&query=${s.ll[0].toFixed(6)},${s.ll[1].toFixed(6)}" target="_blank" rel="noopener">Open in Google Maps &rarr;</a></div>
     <div id="pl"><div class="empty">Looking around…</div></div>`;
  friends.forEach((f,i)=>{ f.secs=s.secs[i]; const el=$('tm'+i); if(el) el.textContent=fmtV(f.secs,s.mode); });
  updateBar();
  if(s.places===undefined){ s.places=null;
    nearby(s.ll).then(r=>{ s.places=r; }).catch(()=>{ s.places=false; }).then(()=>{ if(curSpot()===s) renderPlaces(); }); }
  else renderPlaces();
}
$('out').addEventListener('click',e=>{
  const tb=e.target.closest('[data-tab]'); if(tb){ selectSpot(tb.dataset.tab); return; }
  const ch=e.target.closest('.chip'); if(ch){ curSpot().filter=ch.dataset.k; renderPlaces(); return; }
  const pl=e.target.closest('.place'); if(pl) openPlacePopup(pl.dataset.n,true);
});
async function nearby(ll){
  let list=[];
  for(const R of [1200,2500]){
    const dLa=R/110540, dLo=R/(111320*Math.cos(ll[0]*Math.PI/180));
    const tiles=await loadTiles(14,{s:ll[0]-dLa,n:ll[0]+dLa,w:ll[1]-dLo,e:ll[1]+dLo});
    const seen=new Set();
    list=tiles.flatMap(t=>t.pois).map(p=>({...p,d:hav(ll,[p.lat,p.lng])})).filter(p=>p.d<=R&&!seen.has(p.name)&&seen.add(p.name)).sort((a,b)=>a.d-b.d);
    if(list.length>=4) break;
  }
  return {list};
}
function renderPlaces(){
  const el=$('pl'); if(!el) return; const s=curSpot(), r=s.places;
  if(mapReady) map.getSource('places').setData(EMPTY);
  if(r===null){ el.innerHTML='<div class="empty">Looking around…</div>'; return; }
  if(r===false){ el.innerHTML='<div class="empty">Couldn\'t load nearby places. Use Google Maps above.</div>'; return; }
  if(!r.list.length){ el.innerHTML='<div class="empty">Nothing mapped within 2.5 km. Very mysterious.</div>'; return; }
  const cats=['All',...['Food','Coffee','Drinks','Parks','Malls','Sights'].filter(k=>r.list.some(p=>p.cat===k))];
  const list=r.list.filter(p=>s.filter==='All'||p.cat===s.filter).slice(0,25);
  el.innerHTML=`<div class="chips">${cats.map(k=>`<button class="chip${k===s.filter?' on':''}" data-k="${k}">${k}</button>`).join('')}</div>`+
    list.map(p=>`<div class="place" data-n="${esc(p.name)}"><div class="pn"><b>${esc(p.name)}</b>
      <span>${p.cat}${p.sub&&!['park','mall'].includes(p.sub)?' · '+esc(p.sub.replace(/_/g,' ')):''}</span></div><div class="pd">${fmtDist(p.d)}</div></div>`).join('');
  map.getSource('places').setData({type:'FeatureCollection',features:list.map(p=>({type:'Feature',properties:{name:p.name},geometry:{type:'Point',coordinates:[p.lng,p.lat]}}))});
}
let popup=null;
function openPlacePopup(name,fly){
  const s=curSpot(); const p=s&&s.places&&s.places.list.find(x=>x.name===name); if(!p) return;
  if(fly) map.flyTo({center:[p.lng,p.lat],zoom:16.5,duration:800});
  if(popup) popup.remove();
  popup=new maplibregl.Popup({closeButton:false,offset:8}).setLngLat([p.lng,p.lat])
    .setHTML(`<b>${esc(p.name)}</b><br>${p.cat} · ${fmtDist(p.d)}<br><a target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.name+' Singapore')}">Directions</a>`).addTo(map);
}

initMap(); render();
</script>
