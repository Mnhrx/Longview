<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Spore</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#06080a; --panel:rgba(12,16,15,.9); --line:rgba(255,255,255,.09);
  --text:#e9f2ee; --dim:#8c9a94; --mint:#7CFFB2; --gold:#FFD27A;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:"Space Grotesk",system-ui,sans-serif;overflow:hidden}
#map{position:fixed;inset:0;background:#0b0e0f}
#flood,#fx{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:500}
#flood{z-index:499;transition:opacity 1.6s ease}
.leaflet-control-attribution{background:rgba(0,0,0,.45)!important;color:#7a8781!important;font-size:9px!important}
.leaflet-control-attribution a{color:#9fb0a8!important}
.leaflet-top.leaflet-right{top:calc(var(--safe-t) + 4px)}

header{position:fixed;z-index:600;top:calc(var(--safe-t) + 12px);left:14px;pointer-events:none}
header h1{margin:0;font-size:22px;letter-spacing:.32em;font-weight:700;color:var(--mint);text-shadow:0 0 18px rgba(124,255,178,.55)}
header p{margin:2px 0 0;font:500 11px "JetBrains Mono",monospace;letter-spacing:.14em;color:var(--dim);text-transform:uppercase}

#sheet{position:fixed;z-index:700;left:0;right:0;bottom:0;max-height:52vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line);border-radius:22px 22px 0 0;padding:10px 16px calc(16px + var(--safe-b))}
.grip{width:38px;height:4px;border-radius:4px;background:rgba(255,255,255,.18);margin:0 auto 10px}
#hint{font-size:14px;color:var(--dim);margin-bottom:10px;line-height:1.4}
#hint a{color:var(--mint);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
#friends{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.friend{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.025)}
.dot{width:12px;height:12px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c);flex:none}
.friend .nm{flex:1;min-width:0;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.friend .tm{font:600 13px "JetBrains Mono",monospace;color:var(--c);min-width:58px;text-align:right}
.friend .x{border:0;background:none;color:var(--dim);font-size:20px;line-height:1;padding:0 2px;cursor:pointer}
.row{display:flex;gap:8px;margin-bottom:8px}
input{flex:1;min-width:0;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:12px;color:var(--text);
  font:500 16px "Space Grotesk",sans-serif;padding:11px 12px;outline:none}
input:focus{border-color:rgba(124,255,178,.5)}
button.b{border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--text);border-radius:12px;
  font:600 14px "Space Grotesk",sans-serif;padding:11px 13px;cursor:pointer;white-space:nowrap}
button.b:active{transform:scale(.97)}
button.primary{flex:1;background:var(--mint);color:#04140b;border-color:transparent;box-shadow:0 0 22px rgba(124,255,178,.35)}
button.b:disabled{opacity:.35;box-shadow:none}
#status{font:500 12px "JetBrains Mono",monospace;color:var(--mint);letter-spacing:.06em;min-height:16px;margin:4px 0 6px}
#status.err{color:#ff8a8a}
.card{border:1px solid rgba(255,210,122,.35);border-radius:16px;padding:12px 14px;margin:6px 0 10px;
  background:linear-gradient(160deg,rgba(255,210,122,.09),rgba(255,210,122,.02))}
.card .k{font:600 10px "JetBrains Mono",monospace;letter-spacing:.2em;color:var(--gold);text-transform:uppercase}
.card .road{font-size:20px;font-weight:700;margin:3px 0 2px}
.card .sub{font-size:13px;color:var(--dim)}
.card a{display:inline-block;margin-top:8px;color:var(--gold);font-size:13px;font-weight:600;text-decoration:none}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:6px}
.chip{flex:none;border:1px solid var(--line);border-radius:999px;padding:6px 11px;font-size:12px;color:var(--dim);background:none;cursor:pointer;font-family:inherit}
.chip.on{color:#04140b;background:var(--gold);border-color:transparent}
.place{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.place:last-child{border-bottom:0}
.place .pn{flex:1;min-width:0}
.place .pn b{display:block;font-weight:500;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.place .pn span{font-size:12px;color:var(--dim)}
.place .pd{font:600 12px "JetBrains Mono",monospace;color:var(--gold)}
.tag{display:inline-block;font-size:10px;padding:1px 6px;border-radius:6px;background:rgba(124,255,178,.14);color:var(--mint);margin-left:4px;vertical-align:1px}
.empty{color:var(--dim);font-size:13px;padding:8px 0}
.tabs{display:flex;gap:4px;padding:4px;border:1px solid var(--line);border-radius:14px;margin:4px 0 8px}
.tabs button{flex:1;border:0;border-radius:10px;padding:9px;background:none;color:var(--dim);font:600 14px "Space Grotesk",sans-serif;cursor:pointer}
.tabs button.on{background:rgba(255,210,122,.16);color:var(--gold)}
.tabs button small{display:block;font:500 11px "JetBrains Mono",monospace;opacity:.8;margin-top:1px}

.pin{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:#06100b;
  font:700 13px "JetBrains Mono",monospace;box-shadow:0 0 0 4px rgba(0,0,0,.45),0 0 18px var(--c);border:2px solid rgba(255,255,255,.75)}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#121816;color:var(--text)}
.leaflet-popup-content{font-family:"Space Grotesk",sans-serif;margin:10px 12px}
.leaflet-popup-content a{color:var(--gold)}
#toast{position:fixed;z-index:800;left:50%;top:calc(var(--safe-t) + 64px);transform:translateX(-50%) translateY(-10px);opacity:0;
  background:#1a2220;border:1px solid var(--line);padding:9px 14px;border-radius:12px;font-size:13px;transition:.25s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1;transform:translateX(-50%)}
@media (min-width:700px){#sheet{left:16px;right:auto;width:400px;bottom:16px;border-radius:22px;border:1px solid var(--line);max-height:calc(100vh - 110px)}}
</style>
</head>
<body>
<div id="map"></div>
<canvas id="flood"></canvas>
<canvas id="fx"></canvas>
<header><h1>SPORE</h1><p>meet in the middle</p></header>
<div id="toast"></div>

<section id="sheet">
  <div class="grip"></div>
  <div id="hint">Tap the map to drop each friend, 2 to 6 people. Drag a pin to move it. <a id="demo">Try 4 sample friends</a></div>
  <div id="friends"></div>
  <div class="row">
    <input id="q" placeholder="Postal code or place" enterkeyhint="go" autocomplete="off">
    <button class="b" id="addQ">Add</button>
    <button class="b" id="addMe">Me</button>
  </div>
  <div class="row">
    <button class="b primary" id="go">Find hangout</button>
    <button class="b" id="clear">Clear</button>
  </div>
  <div id="status"></div>
  <div id="out"></div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
/* ===== Spore — meet in the middle =====
   How it works
   1. Download the road network between everyone (OpenStreetMap via Overpass):
      main roads across the whole area + small local roads around each friend.
   2. Every friend's spore spreads outward along ALL roads at once, at the speed you'd ride each road
      (Dijkstra's algorithm — it visits roads in order of ride time, exactly like a spreading front).
   3. The first road point that every colour has reached = SOONEST meetup.
      Only the branches that reach it stay; the rest of the spread fades away.
   4. The bloom then drifts to the EQUAL spot: where everyone's ride is about the same,
      as long as the slowest ride isn't more than ~30% longer than at the soonest spot.      */

const OVERPASS = ['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter'];
const ONEMAP = 'https://www.onemap.gov.sg/api/common/elastic/search';
const COLORS = ['#7CFFB2','#FFB86B','#B48CFF','#6BD8FF','#FF7AA8','#E8FF6B'];
// typical riding speeds (km/h) per road type — includes a bit of junction/light time
const SPEED = {motorway:70,motorway_link:40,trunk:50,trunk_link:35,primary:40,primary_link:30,secondary:35,secondary_link:28,
               tertiary:30,tertiary_link:25,unclassified:25,residential:22,living_street:12};
const FLOOD_MS = 7500;        // how long the spreading takes on screen
const EQUAL_SLACK = 1.3;      // equal spot: slowest ride may be at most 30% longer than at soonest

const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const rand = (a,b) => a + Math.random()*(b-a);
const ease = u => u<.5 ? 2*u*u : 1-Math.pow(-2*u+2,2)/2;

/* ---------- map (Esri dark grey: free, no key) ---------- */
const map = L.map('map', {zoomControl:false}).setView([1.3521,103.8198], 11);
const ESRI='https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/';
L.tileLayer(ESRI+'World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {maxNativeZoom:16, maxZoom:19,
  attribution:'Tiles &copy; Esri · Roads &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'}).addTo(map);
L.tileLayer(ESRI+'World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}', {maxNativeZoom:16, maxZoom:19, opacity:.7}).addTo(map);
const placeLayer = L.layerGroup().addTo(map);

let friends = [];
let busy = false;
let res = null;   // result: {G, runs, spots:{soon,equal}, sel}

/* ---------- small helpers ---------- */
function hav(a,b){ const R=6371000, t=Math.PI/180, dLa=(b[0]-a[0])*t, dLo=(b[1]-a[1])*t;
  const s=Math.sin(dLa/2)**2+Math.cos(a[0]*t)*Math.cos(b[0]*t)*Math.sin(dLo/2)**2; return 2*R*Math.asin(Math.sqrt(s)); }
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),2600); }
function status(m,err){ const s=$('status'); s.textContent=m||''; s.classList.toggle('err',!!err); }
const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtMin = s => s==null||!isFinite(s) ? '' : Math.max(1, Math.round(s/60)) + ' min';
const fmtDist = m => m<1000 ? Math.round(m/10)*10+' m' : (m/1000).toFixed(1)+' km';
const titleCase = s => s.toLowerCase().replace(/\b\w/g, c=>c.toUpperCase());
const pinIcon = (c,n) => L.divIcon({className:'', html:`<div class="pin" style="--c:${c}">${n}</div>`, iconSize:[30,30], iconAnchor:[15,15]});
function rgba(hex,a){ const n=parseInt(hex.slice(1),16); return `rgba(${n>>16},${n>>8&255},${n&255},${a})`; }
const sheetH = () => $('sheet').getBoundingClientRect().height + 10;

async function getJSON(url, ms=15000){
  const c=new AbortController(), h=setTimeout(()=>c.abort(),ms);
  try{ const r=await fetch(url,{signal:c.signal}); if(!r.ok) throw new Error('HTTP '+r.status); return await r.json(); } finally{ clearTimeout(h); } }
// Overpass with a fallback server and a download counter
async function overpass(q, onBytes, ms=120000){
  let last;
  for(const url of OVERPASS){
    const c=new AbortController(), h=setTimeout(()=>c.abort(),ms);
    try{
      const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'data='+encodeURIComponent(q),signal:c.signal});
      if(!r.ok) throw new Error('HTTP '+r.status);
      if(!onBytes || !r.body) return await r.json();
      const rd=r.body.getReader(), parts=[]; let n=0;
      for(;;){ const {done,value}=await rd.read(); if(done) break; parts.push(value); n+=value.length; onBytes(n); }
      const buf=new Uint8Array(n); let o=0; for(const p of parts){ buf.set(p,o); o+=p.length; }
      return JSON.parse(new TextDecoder().decode(buf));
    }catch(e){ last=e; } finally{ clearTimeout(h); }
  }
  throw last;
}

/* ---------- friends ---------- */
function addFriend(lat,lng,label){
  if(busy) return;
  if(friends.length>=6){ toast('Max 6 friends'); return; }
  const used=new Set(friends.map(f=>f.color));
  const f={lat,lng,label,color:COLORS.find(c=>!used.has(c)),secs:null};
  f.marker=L.marker([lat,lng],{icon:pinIcon(f.color,friends.length+1),draggable:true,keyboard:false}).addTo(map);
  f.marker.on('dragend',e=>{ const p=e.target.getLatLng(); f.lat=p.lat; f.lng=p.lng; reset(); render(); });
  friends.push(f); reset(); render();
}
function removeFriend(i){ if(busy) return; map.removeLayer(friends[i].marker); friends.splice(i,1); reset(); render(); }
function reset(){ res=null; vis.paths=[]; vis.spots=[]; vis.tips=null; placeLayer.clearLayers(); friends.forEach(f=>f.secs=null);
  $('out').innerHTML=''; status(''); fctx.clearRect(0,0,innerWidth,innerHeight); }
function render(){
  $('friends').innerHTML=friends.map((f,i)=>`<div class="friend" style="--c:${f.color}"><span class="dot"></span>
    <span class="nm">${esc(f.label||'Friend '+(i+1))}</span><span class="tm" id="tm${i}">${fmtMin(f.secs)}</span>
    <button class="x" data-i="${i}" aria-label="Remove">&times;</button></div>`).join('');
  friends.forEach((f,i)=>f.marker.setIcon(pinIcon(f.color,i+1)));
  ['go','clear','addQ','addMe'].forEach(id=>$(id).disabled=busy);
  if(friends.length<2) $('go').disabled=true;
  $('hint').style.display=friends.length?'none':'';
}
$('friends').addEventListener('click',e=>{ const b=e.target.closest('.x'); if(b) removeFriend(+b.dataset.i); });
map.on('click',e=>addFriend(e.latlng.lat,e.latlng.lng));
$('clear').onclick=()=>{ friends.forEach(f=>map.removeLayer(f.marker)); friends=[]; reset(); render(); };
$('demo').onclick=()=>{
  [[1.3540,103.9440,'Tampines'],[1.4360,103.7865,'Woodlands'],[1.3330,103.7422,'Jurong East'],[1.3008,103.8455,'Orchard']]
    .forEach(p=>addFriend(p[0],p[1],p[2]));
  map.fitBounds(friends.map(f=>[f.lat,f.lng]),{padding:[60,60],paddingBottomRight:[0,sheetH()]});
};
$('addMe').onclick=()=>{
  if(!navigator.geolocation){ toast('Location not available'); return; }
  status('Finding you…');
  navigator.geolocation.getCurrentPosition(p=>{ status(''); addFriend(p.coords.latitude,p.coords.longitude,'Me'); map.panTo([p.coords.latitude,p.coords.longitude]); },
    ()=>status('Location blocked. Allow it for Safari in Settings.',true),{enableHighAccuracy:true,timeout:10000});
};
async function addQuery(){
  const q=$('q').value.trim(); if(!q) return;
  status('Looking up '+q+'…');
  try{
    const r=await getJSON(`${ONEMAP}?searchVal=${encodeURIComponent(q)}&returnGeom=Y&getAddrDetails=Y&pageNum=1`);
    const x=r.results&&r.results[0]; if(!x){ status('Nothing found for '+q,true); return; }
    const name=x.BUILDING&&x.BUILDING!=='NIL'?x.BUILDING:(x.ROAD_NAME||q);
    addFriend(+x.LATITUDE,+x.LONGITUDE,titleCase(name)); map.panTo([+x.LATITUDE,+x.LONGITUDE]); $('q').value=''; status('');
  }catch(e){ status('Lookup failed. Check your connection.',true); }
}
$('addQ').onclick=addQuery;
$('q').addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); addQuery(); $('q').blur(); } });

/* ---------- 1. road network ---------- */
function roadQuery(){
  const la=friends.map(f=>f.lat), lo=friends.map(f=>f.lng);
  const pLa=Math.max((Math.max(...la)-Math.min(...la))*.25,.02), pLo=Math.max((Math.max(...lo)-Math.min(...lo))*.25,.02);
  const bb=[Math.min(...la)-pLa,Math.min(...lo)-pLo,Math.max(...la)+pLa,Math.max(...lo)+pLo].map(v=>v.toFixed(5)).join(',');
  const local=friends.map(f=>`way["highway"~"^(unclassified|residential|living_street)$"](around:2500,${f.lat.toFixed(5)},${f.lng.toFixed(5)});`).join('');
  return `[out:json][timeout:90];(way["highway"~"^(motorway|trunk|primary|secondary|tertiary)(_link)?$"](${bb});${local});out body geom qt;`;
}
function buildGraph(json){
  const idx=new Map(), lat=[], lng=[], ok=[], name=[], E=[];
  const node=(id,g)=>{ let i=idx.get(id); if(i===undefined){ i=lat.length; idx.set(id,i); lat.push(g.lat); lng.push(g.lon); ok.push(0); name.push(''); } return i; };
  for(const w of json.elements){
    if(w.type!=='way'||!w.geometry||!w.nodes) continue;
    const t=w.tags||{}, hw=t.highway, sp=(SPEED[hw]||22)/3.6;
    const ow=(t.oneway==='yes'||t.oneway==='1'||t.junction==='roundabout'||hw==='motorway'||hw==='motorway_link')?1:(t.oneway==='-1'?-1:0);
    const hangable=!(hw==='motorway'||hw==='motorway_link'); // can't hang out on an expressway
    let prev=-1;
    for(let k=0;k<w.nodes.length;k++){
      const g=w.geometry[k]; if(!g){ prev=-1; continue; }
      const i=node(w.nodes[k],g);
      if(hangable){ ok[i]=1; if(!name[i]&&t.name) name[i]=t.name; }
      if(prev>=0){ const tt=hav([lat[prev],lng[prev]],[lat[i],lng[i]])/sp; if(ow!==-1) E.push(prev,i,tt); if(ow!==1) E.push(i,prev,tt); }
      prev=i;
    }
  }
  const n=lat.length, m=E.length/3, off=new Int32Array(n+1);
  for(let e=0;e<m;e++) off[E[3*e]+1]++;
  for(let i=0;i<n;i++) off[i+1]+=off[i];
  const to=new Int32Array(m), wt=new Float32Array(m), fill=off.slice(0,n);
  for(let e=0;e<m;e++){ const p=fill[E[3*e]]++; to[p]=E[3*e+1]; wt[p]=E[3*e+2]; }
  // keep only the biggest connected road network (drops car parks / isolated bits)
  const par=new Int32Array(n); for(let i=0;i<n;i++) par[i]=i;
  const find=x=>{ while(par[x]!==x){ par[x]=par[par[x]]; x=par[x]; } return x; };
  for(let a=0;a<n;a++) for(let e=off[a];e<off[a+1];e++){ const ra=find(a), rb=find(to[e]); if(ra!==rb) par[ra]=rb; }
  const cnt=new Map(); let big=-1, bc=0;
  for(let i=0;i<n;i++){ const r=find(i), c=(cnt.get(r)||0)+1; cnt.set(r,c); if(c>bc){ bc=c; big=r; } }
  const main=new Uint8Array(n); for(let i=0;i<n;i++) if(find(i)===big) main[i]=1;
  return {n, lat:Float64Array.from(lat), lng:Float64Array.from(lng), ok:Uint8Array.from(ok), name, off, to, wt, main};
}
function nearestNode(G,lat,lng){
  const k=Math.cos(lat*Math.PI/180); let best=-1, bd=Infinity;
  for(let i=0;i<G.n;i++){ if(!G.main[i]) continue; const a=G.lat[i]-lat, b=(G.lng[i]-lng)*k, d=a*a+b*b; if(d<bd){ bd=d; best=i; } }
  return best;
}

/* ---------- 2. the spreading (Dijkstra: visits roads in order of ride time) ---------- */
function spread(G,src){
  const n=G.n, dist=new Float64Array(n).fill(Infinity), pred=new Int32Array(n).fill(-1), done=new Uint8Array(n), order=[];
  const hv=[], hd=[];
  const push=(v,d)=>{ hv.push(v); hd.push(d); let i=hv.length-1;
    while(i>0){ const p=(i-1)>>1; if(hd[p]<=hd[i]) break; [hv[p],hv[i]]=[hv[i],hv[p]]; [hd[p],hd[i]]=[hd[i],hd[p]]; i=p; } };
  const pop=()=>{ const v=hv[0], lv=hv.pop(), ld=hd.pop();
    if(hv.length){ hv[0]=lv; hd[0]=ld; let i=0;
      for(;;){ const l=2*i+1, r=l+1; let s=i; if(l<hv.length&&hd[l]<hd[s]) s=l; if(r<hv.length&&hd[r]<hd[s]) s=r; if(s===i) break;
        [hv[s],hv[i]]=[hv[i],hv[s]]; [hd[s],hd[i]]=[hd[i],hd[s]]; i=s; } }
    return v; };
  dist[src]=0; push(src,0);
  while(hv.length){
    const u=pop(); if(done[u]) continue; done[u]=1; order.push(u);
    for(let e=G.off[u];e<G.off[u+1];e++){ const v=G.to[e], d=dist[u]+G.wt[e]; if(d<dist[v]){ dist[v]=d; pred[v]=u; push(v,d); } }
  }
  return {dist, pred, order:Int32Array.from(order)};
}

/* ---------- 3. soonest + equal spots ---------- */
function pickSpots(G,runs){
  let soon=-1, sMax=Infinity, sSum=Infinity;
  for(let v=0;v<G.n;v++){
    if(!G.ok[v]) continue; let mx=0, sm=0;
    for(const R of runs){ const d=R.dist[v]; if(d>mx) mx=d; sm+=d; }
    if(mx<sMax || (mx===sMax && sm<sSum)){ sMax=mx; sSum=sm; soon=v; }
  }
  if(soon<0||!isFinite(sMax)) return null;
  const spreadAt=v=>{ let mx=0, mn=Infinity; for(const R of runs){ const d=R.dist[v]; if(d>mx) mx=d; if(d<mn) mn=d; } return [mx,mn]; };
  const [s0,s1]=spreadAt(soon), limit=sMax*EQUAL_SLACK+60;
  let eq=-1, eGap=Infinity, eMax=Infinity;
  for(let v=0;v<G.n;v++){
    if(!G.ok[v]) continue; const [mx,mn]=spreadAt(v); if(mx>limit) continue;
    const gap=mx-mn; if(gap<eGap-1 || (Math.abs(gap-eGap)<=1 && mx<eMax)){ eGap=gap; eMax=mx; eq=v; }
  }
  const same = eq<0 || (s0-s1)-eGap<90 || hav([G.lat[eq],G.lng[eq]],[G.lat[soon],G.lng[soon]])<300;
  return {soon, equal: same?null:eq};
}
function spotInfo(G,runs,v,kind){
  const secs=runs.map(R=>R.dist[v]);
  const paths=runs.map(R=>{ const pts=[]; let u=v; while(u>=0){ pts.push([G.lat[u],G.lng[u]]); u=R.pred[u]; } pts.reverse();
    const cum=[0]; for(let i=1;i<pts.length;i++) cum.push(cum[i-1]+hav(pts[i-1],pts[i])); return {pts,cum}; });
  return {kind, v, ll:[G.lat[v],G.lng[v]], road:G.name[v]||nearbyName(G,v), secs, paths, places:undefined, filter:'All'};
}
function nearbyName(G,v){ let best='', bd=Infinity;
  for(let i=0;i<G.n;i++){ if(!G.name[i]) continue; const d=hav([G.lat[i],G.lng[i]],[G.lat[v],G.lng[v]]); if(d<bd){ bd=d; best=G.name[i]; } }
  return best; }

/* ---------- drawing ---------- */
const fx=$('fx'), ctx=fx.getContext('2d'), fl=$('flood'), fctx=fl.getContext('2d');
function sizeCanvas(){ const d=Math.min(devicePixelRatio||1,2);
  for(const [c,x] of [[fx,ctx],[fl,fctx]]){ c.width=innerWidth*d; c.height=innerHeight*d; x.setTransform(d,0,0,d,0,0); } }
addEventListener('resize',sizeCanvas); sizeCanvas();
const P = ll => map.latLngToContainerPoint(ll);
const vis = {paths:[], spots:[], tips:null, seeds:null};

function lockMap(on){ for(const k of ['dragging','touchZoom','doubleClickZoom','scrollWheelZoom','boxZoom','keyboard']) if(map[k]) on?map[k].disable():map[k].enable(); }

function runFlood(G,runs,T){
  return new Promise(done=>{
    const ptr=runs.map(()=>0), t0=performance.now(), tEnd=T*1.04;
    fl.style.transition='none'; fl.style.opacity=1; fctx.clearRect(0,0,innerWidth,innerHeight);
    vis.seeds={t0, pts:friends.map(f=>[[f.lat,f.lng],f.color])};
    const nodeP=v=>map.latLngToContainerPoint([G.lat[v],G.lng[v]]);
    let bloomed=false;
    const step=now=>{
      const tau=Math.min(tEnd,(now-t0)/FLOOD_MS*T);
      fctx.globalCompositeOperation='lighter'; fctx.lineCap='round';
      const tips=[];
      runs.forEach((R,i)=>{
        const o=R.order; let k=ptr[i], c=0;
        fctx.beginPath();
        while(k<o.length && R.dist[o[k]]<=tau){
          const v=o[k], u=R.pred[v];
          if(u>=0){ const a=nodeP(u), b=nodeP(v); fctx.moveTo(a.x,a.y); fctx.lineTo(b.x,b.y); if((c++%3)===0 && tips.length<500) tips.push([b.x,b.y,R.color]); }
          k++;
        }
        ptr[i]=k; fctx.strokeStyle=rgba(R.color,.55); fctx.lineWidth=1.15; fctx.stroke();
      });
      vis.tips=tips;
      if(!bloomed){ friends.forEach((f,i)=>{ const el=$('tm'+i); if(el) el.textContent=fmtMin(tau); });
        status(`Spreading · ${Math.max(1,Math.round(tau/60))} min`); }
      if(!bloomed && tau>=T){ bloomed=true; done(); }
      if(tau<tEnd) requestAnimationFrame(step); else vis.tips=null;
    };
    requestAnimationFrame(step);
  });
}

function showPaths(spot,growMs=1400,delay=0){
  const t=performance.now()+delay;
  vis.paths.forEach(p=>{ if(!p.fadeAt) p.fadeAt=performance.now(); });
  spot.paths.forEach((p,i)=>vis.paths.push({...p,color:friends[i].color,t0:t,dur:growMs}));
}
function frame(now){
  requestAnimationFrame(frame);
  ctx.clearRect(0,0,innerWidth,innerHeight);
  ctx.globalCompositeOperation='lighter'; ctx.lineCap='round'; ctx.lineJoin='round';
  // germination rings at each start
  if(vis.seeds){ const u=(now-vis.seeds.t0)/1100;
    if(u<1) vis.seeds.pts.forEach(([ll,c])=>{ const p=P(ll); for(let r=0;r<2;r++){ const uu=clamp(u*1.2-r*.2,0,1);
      ctx.strokeStyle=rgba(c,.7*(1-uu)); ctx.lineWidth=2; ctx.beginPath(); ctx.arc(p.x,p.y,6+46*uu,0,7); ctx.stroke(); } });
    else vis.seeds=null; }
  // spreading front sparkle
  if(vis.tips) for(const [x,y,c] of vis.tips){ ctx.fillStyle=rgba(c,.85); ctx.beginPath(); ctx.arc(x,y,1.7,0,7); ctx.fill(); }
  // surviving branches
  vis.paths=vis.paths.filter(p=>!p.fadeAt || now-p.fadeAt<700);
  for(const p of vis.paths){
    const u=clamp((now-p.t0)/p.dur,0,1); if(u<=0) continue;
    const a=p.fadeAt?1-(now-p.fadeAt)/700:1, L=p.cum[p.cum.length-1]*ease(u);
    const pts=[]; for(let i=0;i<p.pts.length;i++){
      if(p.cum[i]<=L){ pts.push(P(p.pts[i])); continue; }
      const A=P(p.pts[i-1]), B=P(p.pts[i]), r=(L-p.cum[i-1])/((p.cum[i]-p.cum[i-1])||1); pts.push({x:A.x+(B.x-A.x)*r,y:A.y+(B.y-A.y)*r}); break; }
    if(pts.length<2) continue;
    for(const [w,al] of [[9,.16],[2.6,.95]]){ ctx.strokeStyle=rgba(p.color,al*a); ctx.lineWidth=w; ctx.beginPath(); ctx.moveTo(pts[0].x,pts[0].y); for(const q of pts) ctx.lineTo(q.x,q.y); ctx.stroke(); }
    if(u<1){ const q=pts[pts.length-1], g=ctx.createRadialGradient(q.x,q.y,0,q.x,q.y,12); g.addColorStop(0,rgba(p.color,.9)); g.addColorStop(1,rgba(p.color,0)); ctx.fillStyle=g; ctx.beginPath(); ctx.arc(q.x,q.y,12,0,7); ctx.fill(); }
  }
  // spots
  for(const s of vis.spots){
    let ll=s.ll;
    if(s.move){ const u=clamp((now-s.move.t0)/s.move.dur,0,1), e=ease(u); ll=[s.move.from[0]+(s.ll[0]-s.move.from[0])*e, s.move.from[1]+(s.ll[1]-s.move.from[1])*e]; if(u>=1) s.move=null; }
    const c=P(ll), bt=now-s.born;
    if(bt<1500){ const u=bt/1500;
      for(let r=0;r<3;r++){ const uu=clamp(u*1.3-r*.15,0,1); if(uu<=0) continue; ctx.strokeStyle=`rgba(255,226,160,${.7*(1-uu)})`; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(c.x,c.y,10+85*uu,0,7); ctx.stroke(); }
      s.sparks.forEach(k=>{ const d=k.v*Math.sqrt(u)*1.4; ctx.fillStyle=rgba(k.c,.9*(1-u)); ctx.beginPath(); ctx.arc(c.x+Math.cos(k.a)*d,c.y+Math.sin(k.a)*d,2,0,7); ctx.fill(); }); }
    const sel=res&&res.sel===s.kind, grow=clamp(bt/500,0,1);
    if(sel){ const R=22*(1+.18*Math.sin(now/380))*grow, g=ctx.createRadialGradient(c.x,c.y,0,c.x,c.y,R);
      g.addColorStop(0,'rgba(255,240,200,.95)'); g.addColorStop(.35,'rgba(255,210,122,.55)'); g.addColorStop(1,'rgba(255,210,122,0)');
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(c.x,c.y,R,0,7); ctx.fill();
      ctx.strokeStyle='rgba(255,210,122,.85)'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.arc(c.x,c.y,9+3*Math.sin(now/380),0,7); ctx.stroke(); }
    else { ctx.strokeStyle='rgba(255,210,122,.45)'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.arc(c.x,c.y,7,0,7); ctx.stroke();
      ctx.fillStyle='rgba(255,210,122,.4)'; ctx.beginPath(); ctx.arc(c.x,c.y,2.5,0,7); ctx.fill(); }
    if(!s.move && grow>=1){ ctx.globalCompositeOperation='source-over'; ctx.font='600 10px "JetBrains Mono",monospace'; ctx.textAlign='center';
      ctx.fillStyle=sel?'rgba(255,214,140,.95)':'rgba(255,214,140,.5)'; ctx.fillText(s.kind==='soon'?'SOONEST':'EQUAL',c.x,c.y+(sel?30:20)); ctx.globalCompositeOperation='lighter'; }
  }
  ctx.globalCompositeOperation='source-over';
}
requestAnimationFrame(frame);
const sparks = () => Array.from({length:44},()=>({a:rand(0,7),v:rand(25,95),c:friends[Math.floor(Math.random()*friends.length)].color}));
function tweenTimes(from,to,ms){
  const t0=performance.now();
  const step=now=>{ const u=clamp((now-t0)/ms,0,1), e=ease(u);
    friends.forEach((f,i)=>{ f.secs=from[i]+(to[i]-from[i])*e; const el=$('tm'+i); if(el) el.textContent=fmtMin(f.secs); });
    if(u<1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}

/* ---------- the run ---------- */
$('go').onclick = async ()=>{
  if(friends.length<2||busy) return;
  reset(); busy=true; render(); lockMap(true);
  try{
    map.fitBounds(friends.map(f=>[f.lat,f.lng]),{padding:[50,50],paddingBottomRight:[0,sheetH()],animate:false});
    status('Downloading roads…');
    const json=await overpass(roadQuery(), n=>status(`Downloading roads · ${(n/1048576).toFixed(1)} MB`));
    status('Mapping the roads…'); await sleep(30);
    const G=buildGraph(json);
    if(G.n<10) throw new Error('No roads found here');
    const runs=friends.map((f,i)=>{ const s=nearestNode(G,f.lat,f.lng); const R=spread(G,s); R.color=f.color; return R; });
    const spots=pickSpots(G,runs);
    if(!spots) throw new Error('Spores never met. Is someone off the road network?');
    const soon=spotInfo(G,runs,spots.soon,'soon');
    const equal=spots.equal!=null?spotInfo(G,runs,spots.equal,'equal'):null;
    res={G,runs,soon,equal,sel:'soon'};
    // spread until every colour touches the soonest spot
    await runFlood(G,runs,Math.max(...soon.secs));
    vis.spots=[{kind:'soon',ll:soon.ll,born:performance.now(),sparks:sparks()}];
    friends.forEach((f,i)=>f.secs=soon.secs[i]); render();
    status('');
    // keep only the branches that reached it; everything else withers
    await sleep(350);
    fl.style.transition='opacity 1.6s ease'; fl.style.opacity=0;
    showPaths(soon,1300);
    await sleep(1700);
    fctx.clearRect(0,0,innerWidth,innerHeight);
    renderResult();
    if(equal){
      await sleep(900);
      status('Drifting to equal rides…');
      res.sel='equal';
      vis.spots.push({kind:'equal',ll:equal.ll,born:performance.now()+1e9,sparks:[],move:{from:soon.ll,t0:performance.now(),dur:1800}});
      const eqSpot=vis.spots[1];
      showPaths(equal,1500,250);
      tweenTimes(soon.secs,equal.secs,1800);
      await sleep(1850);
      eqSpot.born=performance.now(); eqSpot.sparks=sparks();
      friends.forEach((f,i)=>f.secs=equal.secs[i]);
      status(''); renderResult();
    } else {
      toast('The soonest spot is already the fairest');
    }
  }catch(e){
    console.error(e);
    status(/Spores|No roads/.test(e.message)?e.message:'Road server busy. Try again in a moment.',true);
  }
  busy=false; lockMap(false); render();
};

/* ---------- result panel + nearby places ---------- */
function renderResult(){
  if(!res) return;
  const s=res.sel==='equal'&&res.equal?res.equal:res.soon;
  const lo=Math.min(...s.secs), hi=Math.max(...s.secs);
  const tab=(k,label,sp)=>sp?`<button data-tab="${k}" class="${res.sel===k?'on':''}">${label}<small>${fmtMin(Math.min(...sp.secs)).replace(' min','')}–${fmtMin(Math.max(...sp.secs))}</small></button>`:'';
  $('out').innerHTML=(res.equal?`<div class="tabs">${tab('soon','Soonest',res.soon)}${tab('equal','Equal',res.equal)}</div>`:'')+
    `<div class="card"><div class="k">${s.kind==='soon'?'Soonest meetup':'Equal rides'}</div>
     <div class="road">${esc(s.road||'Unnamed road')}</div>
     <div class="sub">${s.kind==='soon'?`Everyone's there in ${fmtMin(hi)} · rides ${fmtMin(lo)} to ${fmtMin(hi)}`:`Everyone rides ${fmtMin(lo)} to ${fmtMin(hi)}`}</div>
     <a href="https://www.google.com/maps/search/?api=1&query=${s.ll[0].toFixed(6)},${s.ll[1].toFixed(6)}" target="_blank" rel="noopener">Open in Google Maps &rarr;</a></div>
     <div id="pl"><div class="empty">Looking around…</div></div>`;
  friends.forEach((f,i)=>{ f.secs=s.secs[i]; const el=$('tm'+i); if(el) el.textContent=fmtMin(f.secs); });
  if(s.places===undefined){ s.places=null; s.loading=nearby(s.ll).then(r=>{ s.places=r; }).catch(()=>{ s.places=false; }).then(()=>{ if(cur()===s) renderPlaces(); }); }
  else renderPlaces();
}
const cur = () => res && (res.sel==='equal'&&res.equal?res.equal:res.soon);
$('out').addEventListener('click',e=>{
  const tb=e.target.closest('[data-tab]');
  if(tb&&!busy&&res.sel!==tb.dataset.tab){ res.sel=tb.dataset.tab; const s=cur(); showPaths(s,900); renderResult(); map.panTo(s.ll); return; }
  const ch=e.target.closest('.chip'); if(ch){ cur().filter=ch.dataset.k; renderPlaces(); return; }
  const pl=e.target.closest('.place'); if(!pl) return;
  const p=cur().places.list.find(x=>x.name===pl.dataset.n); if(!p) return;
  map.flyTo([p.lat,p.lng],17,{duration:.8});
  placeLayer.eachLayer(l=>{ const q=l.getLatLng(); if(q.lat===p.lat&&q.lng===p.lng) setTimeout(()=>l.openPopup(),850); });
});
function catOf(t){
  if(t.amenity==='cafe'||t.amenity==='ice_cream') return 'Coffee';
  if(t.amenity==='bar') return 'Drinks';
  if(t.amenity) return 'Food';
  if(t.leisure) return 'Parks';
  if(t.shop) return 'Malls';
  return 'Sights';
}
async function nearby(ll){
  let list=[], R0=0;
  for(const R of [800,1600,3000]){
    const a=`(around:${R},${ll[0]},${ll[1]})`;
    const q=`[out:json][timeout:25];(nwr${a}[amenity~"^(restaurant|cafe|fast_food|food_court|ice_cream|bar)$"][name];nwr${a}[leisure~"^(park|garden|nature_reserve)$"][name];nwr${a}[shop=mall][name];nwr${a}[tourism~"^(viewpoint|attraction|museum)$"][name];);out center 120;`;
    const r=await overpass(q,null,30000), seen=new Set();
    list=r.elements.map(e=>{ const lat=e.lat??e.center?.lat, lng=e.lon??e.center?.lon, t=e.tags||{};
      return {name:t.name,lat,lng,cat:catOf(t),halal:/^(yes|only)$/.test(t['diet:halal']||''),cuisine:t.cuisine||'',d:lat?hav(ll,[lat,lng]):1e9}; })
      .filter(p=>p.lat&&!seen.has(p.name)&&seen.add(p.name)).sort((a,b)=>a.d-b.d);
    R0=R; if(list.length>=4) break; await sleep(400);
  }
  return {R:R0,list};
}
function renderPlaces(){
  const el=$('pl'); if(!el) return; const s=cur(), r=s.places;
  placeLayer.clearLayers();
  if(r===null){ el.innerHTML='<div class="empty">Looking around…</div>'; return; }
  if(r===false){ el.innerHTML='<div class="empty">Couldn\'t load nearby places. Use Google Maps above.</div>'; return; }
  if(!r.list.length){ el.innerHTML='<div class="empty">Nothing mapped within 3 km. Very mysterious.</div>'; return; }
  const cats=['All',...['Food','Coffee','Drinks','Parks','Malls','Sights'].filter(k=>r.list.some(p=>p.cat===k))];
  const list=r.list.filter(p=>s.filter==='All'||p.cat===s.filter).slice(0,25);
  el.innerHTML=`<div class="chips">${cats.map(k=>`<button class="chip${k===s.filter?' on':''}" data-k="${k}">${k}</button>`).join('')}</div>`+
    list.map(p=>`<div class="place" data-n="${esc(p.name)}"><div class="pn"><b>${esc(p.name)}</b>
      <span>${p.cat}${p.cuisine?' · '+esc(p.cuisine.split(';')[0].replace(/_/g,' ')):''}</span>${p.halal?'<span class="tag">halal</span>':''}</div>
      <div class="pd">${fmtDist(p.d)}</div></div>`).join('');
  list.forEach(p=>L.circleMarker([p.lat,p.lng],{radius:5,color:'#FFD27A',weight:1.5,fillColor:'#FFD27A',fillOpacity:.55})
    .bindPopup(`<b>${esc(p.name)}</b><br>${p.cat} · ${fmtDist(p.d)}<br><a target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.name+' Singapore')}">Directions</a>`).addTo(placeLayer));
}
render();
</script>
</body>
