<style>
:root{
  --bg:#06080a; --panel:rgba(12,16,15,.9); --line:rgba(255,255,255,.09);
  --text:#e9f2ee; --dim:#8c9a94; --mint:#7CFFB2; --gold:#FFD27A;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:"Space Grotesk",system-ui,sans-serif;overflow:hidden}
#map{position:fixed;inset:0;background:#0b0e0f}
#roads,#flood,#fx{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:500}
#flood{z-index:499}
#roads{z-index:498;opacity:0}
.maplibregl-ctrl-attrib{background:rgba(0,0,0,.5)!important;color:#7a8781!important;font-size:9px!important}
.maplibregl-ctrl-attrib a{color:#9fb0a8!important}
.maplibregl-ctrl-attrib-button{filter:invert(1);opacity:.5}
.maplibregl-ctrl-top-right{top:calc(var(--safe-t) + 4px)}
.spot{position:relative;width:24px;height:24px;cursor:pointer}
.spot i{position:absolute;inset:7px;border-radius:50%;border:1.5px solid rgba(255,210,122,.5);background:rgba(255,210,122,.25)}
.spot b{position:absolute;top:24px;left:50%;transform:translateX(-50%);font:600 10px "JetBrains Mono",monospace;letter-spacing:.08em;color:rgba(255,214,140,.55);white-space:nowrap}
.spot.sel i{inset:0;background:radial-gradient(circle,#fff3d6 0,#ffd27a 35%,rgba(255,210,122,0) 72%);border:1.5px solid rgba(255,210,122,.85);animation:pulse 2.4s ease-in-out infinite}
.spot.sel b{top:30px;color:#ffd68c}
@keyframes pulse{50%{transform:scale(1.22);box-shadow:0 0 26px 6px rgba(255,210,122,.35)}}

header{position:fixed;z-index:600;top:calc(var(--safe-t) + 12px);left:14px;pointer-events:none}
header h1{margin:0;font-size:22px;letter-spacing:.32em;font-weight:700;color:var(--mint);text-shadow:0 0 18px rgba(124,255,178,.55)}
header p{margin:2px 0 0;font:500 11px "JetBrains Mono",monospace;letter-spacing:.14em;color:var(--dim);text-transform:uppercase}

#sheet{position:fixed;z-index:700;left:0;right:0;bottom:0;max-height:52vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line);border-radius:22px 22px 0 0;padding:10px 16px calc(16px + var(--safe-b))}
#hint{font-size:14px;color:var(--dim);margin-bottom:10px;line-height:1.4}
#hint a{color:var(--mint);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
#friends{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.friend{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.025)}
.dot{width:12px;height:12px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c);flex:none}
.friend .nm{flex:1;min-width:0;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.friend .tm{font:600 13px "JetBrains Mono",monospace;color:var(--c);min-width:58px;text-align:right;white-space:nowrap}
.friend .x{border:0;background:none;color:var(--dim);font-size:20px;line-height:1;padding:0 2px;cursor:pointer}
.row{display:flex;gap:8px;margin-bottom:8px}
input{flex:1;min-width:0;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:12px;color:var(--text);
  font:500 16px "Space Grotesk",sans-serif;padding:11px 12px;outline:none}
input:focus{border-color:rgba(124,255,178,.5)}
button.b{border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--text);border-radius:12px;
  font:600 14px "Space Grotesk",sans-serif;padding:11px 13px;cursor:pointer;white-space:nowrap}
button.b:active{transform:scale(.97)}
button.primary{flex:1;background:var(--mint);color:#04140b;border-color:transparent;box-shadow:0 0 22px rgba(124,255,178,.35)}
button.b:disabled{opacity:.35;box-shadow:none}
#status{font:500 12px "JetBrains Mono",monospace;color:var(--mint);letter-spacing:.06em;min-height:16px;margin:4px 0 6px}
#status.err{color:#ff8a8a}
.card{border:1px solid rgba(255,210,122,.35);border-radius:16px;padding:12px 14px;margin:6px 0 10px;
  background:linear-gradient(160deg,rgba(255,210,122,.09),rgba(255,210,122,.02))}
.card .k{font:600 10px "JetBrains Mono",monospace;letter-spacing:.2em;color:var(--gold);text-transform:uppercase}
.card .road{font-size:20px;font-weight:700;margin:3px 0 2px}
.card .sub{font-size:13px;color:var(--dim)}
.card a{display:inline-block;margin-top:8px;color:var(--gold);font-size:13px;font-weight:600;text-decoration:none}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:6px}
.chip{flex:none;border:1px solid var(--line);border-radius:999px;padding:6px 11px;font-size:12px;color:var(--dim);background:none;cursor:pointer;font-family:inherit}
.chip.on{color:#04140b;background:var(--gold);border-color:transparent}
.place{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.place:last-child{border-bottom:0}
.place .pn{flex:1;min-width:0}
.place .pn b{display:block;font-weight:500;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.place .pn span{font-size:12px;color:var(--dim)}
.place .pd{font:600 12px "JetBrains Mono",monospace;color:var(--gold)}
.tag{display:none;font-size:10px;padding:1px 6px;border-radius:6px;background:rgba(124,255,178,.14);color:var(--mint);margin-left:4px;vertical-align:1px}
.empty{color:var(--dim);font-size:13px;padding:8px 0}
.tabs{display:flex;gap:4px;padding:4px;border:1px solid var(--line);border-radius:14px;margin:4px 0 8px}
.tabs button{flex:1;border:0;border-radius:10px;padding:9px;background:none;color:var(--dim);font:600 14px "Space Grotesk",sans-serif;cursor:pointer}
.tabs button.on{background:rgba(255,210,122,.16);color:var(--gold)}
.tabs button small{display:block;font:500 11px "JetBrains Mono",monospace;opacity:.8;margin-top:1px}

.pin{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:#06100b;
  font:700 13px "JetBrains Mono",monospace;box-shadow:0 0 0 4px rgba(0,0,0,.45),0 0 18px var(--c);border:2px solid rgba(255,255,255,.75)}
.stats{font:500 11px "JetBrains Mono",monospace;color:var(--dim);line-height:1.5;margin:-2px 2px 10px}
.cmp{display:flex;gap:6px;margin:4px 0 8px}
.cmp button{flex:1;min-width:0;text-align:left;border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:none;color:var(--text);cursor:pointer;font-family:inherit}
.cmp button.on{border-color:rgba(124,255,178,.5);background:rgba(124,255,178,.07)}
.cmp i{display:block;font:600 10px "JetBrains Mono",monospace;font-style:normal;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.cmp button.on i{color:var(--mint)}
.cmp b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:2px 0 1px}
.cmp small{font:500 11px "JetBrains Mono",monospace;color:var(--dim)}
.dir{margin-top:10px;display:flex;flex-direction:column;gap:7px}
.dir a{margin-top:0!important}
.dir a.go{display:block;text-align:center;background:var(--gold);color:#1a1205!important;font-weight:700;font-size:14px;border-radius:10px;padding:9px 12px;text-decoration:none}
.dir span{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.dir span a{font-size:12px;color:var(--dim)!important;text-decoration:underline;text-underline-offset:3px}
.dir span.all a{font-size:13px;font-weight:600;color:var(--gold)!important;border:1px solid rgba(255,210,122,.4);border-radius:9px;padding:6px 10px;text-decoration:none}
.dir small{font-size:11px;color:var(--dim)}
.maplibregl-popup-content{min-width:210px}
.pc{font-size:12px;color:var(--dim);margin-top:2px}
.poi{display:flex;align-items:center;gap:5px;cursor:pointer}

</head>
<body>
<div id="map"></div>
<canvas id="roads"></canvas>
<canvas id="flood"></canvas>
<canvas id="fx"></canvas>
<header><h1>SPORE</h1><p>meet in the middle · v10</p></header>
<div id="toast"></div>

<button id="mute" aria-label="Sound on"></button>
<section id="sheet">
  <div class="grip" id="grip" aria-label="Show or hide panel"></div>
  <div id="bar"><span id="barTxt"></span><button class="b primary" id="go2">Find hangout</button></div>
  <div id="full">
  <div id="hint">Tap the map to drop each friend, 2 to 6 people. Drag a pin to move it. <a id="demo">Try 4 sample friends</a></div>
  <div id="friends"></div>
  <div class="row">
    <input id="q" placeholder="Postal code or place" enterkeyhint="go" autocomplete="off">
    <button class="b" id="addQ">Add</button>
    <button class="b" id="addMe">Me</button>
    <button class="b" id="savedBtn" aria-label="Saved places">&#9733;</button>
  </div>
  <div id="saved" hidden></div>
  <div class="seg" id="viewSeg"><span>View</span><button data-v="0">Spores</button><button data-v="1">Workings</button></div>
  <div class="seg" id="mode"><span>Measure</span><button data-m="time" class="on">Time</button><button data-m="dist">Distance</button></div>
  <div class="row">
    <button class="b primary" id="go">Find hangout</button>
    <button class="b" id="clear">Clear</button>
  </div>
  <div id="status"></div>
  <div id="out"></div>
  </div>
</section>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
/* ===== Spore — meet in the middle =====
   Everything comes from OpenFreeMap (free, no key, served from a CDN):
   - the map you see
   - the roads the spores spread along (read straight out of the same map tiles)
   - the places nearby
   How the spot is found
   1. Read every road in the area from the map tiles and stitch them into one road network.
   2. Every friend's spore spreads along ALL roads at once, at the speed you'd ride each road
      (Dijkstra's algorithm visits roads in order of ride time, like a spreading front).
   3. The first road point every colour reaches = SOONEST meetup. Only the branches that reach it stay.
   4. The bloom drifts to the EQUAL spot: closest ride times for everyone, with the slowest ride
      no more than ~30% longer than at the soonest spot.                                          */

const STYLE_URL = 'https://tiles.openfreemap.org/styles/positron';
const ONEMAP = 'https://www.onemap.gov.sg/api/common/elastic/search';
const COLORS = ['#7CFFB2','#FFB86B','#B48CFF','#6BD8FF','#FF7AA8','#E8FF6B'];
// typical riding speeds (km/h) per road class, including a bit of junction/light time
const SPEED = {motorway:70, trunk:50, primary:40, secondary:35, tertiary:30, minor:22};
const RAMP_SPEED = 35;
const FLOOD_MS = 7500;
const EQUAL_SLACK = 1.3;

const $ = id => document.getElementById(id);
/* ---------- run log: a plain-text record of what happened, for "Copy log" ---------- */
const VERSION='v10';
let LOG=[], logT0=performance.now();
function logMark(title){ logT0=performance.now(); LOG.push('', '==== '+title+' ===='); if(LOG.length>700) LOG=LOG.slice(-500); }
function log(...a){ const t=((performance.now()-logT0)/1000).toFixed(2).padStart(6);
  LOG.push(`${t}s ${a.map(x=>typeof x==='string'?x:JSON.stringify(x)).join(' ')}`); }
addEventListener('error',e=>log('JS ERROR',e.message,((e.error&&e.error.stack)||'').split('\n').slice(0,3).join(' | ')));
addEventListener('unhandledrejection',e=>log('PROMISE ERROR',String((e.reason&&(e.reason.stack||e.reason.message))||e.reason).split('\n').slice(0,3).join(' | ')));
function logText(){ const dev=(navigator.userAgent.match(/(iPhone|iPad|Android|Macintosh|Windows)[^;)]*/)||[''])[0];
  return [`Spore ${VERSION} · ${new Date().toLocaleString('en-SG')} · ${dev}`, ...LOG].join('\n'); }
async function copyLog(){
  const t=logText();
  try{ await navigator.clipboard.writeText(t); toast('Log copied'); return; }catch(e){}
  const ta=document.createElement('textarea'); ta.value=t; ta.style.cssText='position:fixed;top:0;left:0;opacity:0'; document.body.appendChild(ta);
  ta.focus(); ta.select(); let ok=false; try{ ok=document.execCommand('copy'); }catch(e){} ta.remove();
  toast(ok?'Log copied':'Couldn\'t copy the log');
}
document.addEventListener('click',e=>{ if(e.target.closest('[data-copylog]')){ e.preventDefault(); copyLog(); } });
const sleep = ms => new Promise(r => setTimeout(r, ms));
const frameWait = () => new Promise(r => requestAnimationFrame(()=>requestAnimationFrame(r)));
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const rand = (a,b) => a + Math.random()*(b-a);
const ease = u => u<.5 ? 2*u*u : 1-Math.pow(-2*u+2,2)/2;
function hav(a,b){ const R=6371000, t=Math.PI/180, dLa=(b[0]-a[0])*t, dLo=(b[1]-a[1])*t;
  const s=Math.sin(dLa/2)**2+Math.cos(a[0]*t)*Math.cos(b[0]*t)*Math.sin(dLo/2)**2; return 2*R*Math.asin(Math.sqrt(s)); }
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),2600); }
function status(m,err){ const s=$('status'); if(m&&m!==s.textContent&&!/^Spreading/.test(m)) log(err?'STATUS (error):':'status:',m); s.textContent=m||''; s.classList.toggle('err',!!err); updateBar(); }
const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtMin = s => s==null||!isFinite(s) ? '' : Math.max(1, Math.round(s/60)) + ' min';
let MODE='time';   // 'time' = ride minutes, 'dist' = road km
const fmtV=(v,mode=MODE)=> v==null||!isFinite(v) ? '' : mode==='dist' ? (v<950 ? Math.max(50,Math.round(v/50)*50)+' m' : (v/1000).toFixed(1)+' km') : fmtMin(v);
function rangeTxt(lo,hi,mode){ const a=fmtV(lo,mode), b=fmtV(hi,mode); if(a===b) return a;
  const [na,ua]=a.split(' '), [nb,ub]=b.split(' '); return ua===ub ? na+'–'+b : a+' – '+b; }
const fmtDist = m => m<1000 ? Math.round(m/10)*10+' m' : (m/1000).toFixed(1)+' km';
const titleCase = s => s.toLowerCase().replace(/\b\w/g, c=>c.toUpperCase());
function rgba(hex,a){ const n=parseInt(hex.slice(1),16); return `rgba(${n>>16},${n>>8&255},${n&255},${a})`; }
const sheetH = () => $('sheet').getBoundingClientRect().height + 10;
async function getJSON(url, ms=15000){
  const c=new AbortController(), h=setTimeout(()=>c.abort(),ms);
  try{ const r=await fetch(url,{signal:c.signal}); if(!r.ok) throw new Error('HTTP '+r.status); return await r.json(); } finally{ clearTimeout(h); } }

/* ---------- sound effects: synthesised with Web Audio, no files ---------- */
const Snd={ctx:null,muted:false,
  init(){ try{ if(!this.ctx){ const C=window.AudioContext||window.webkitAudioContext; this.ctx=new C();
      this.master=this.ctx.createGain(); this.master.gain.value=this.muted?0:.8; this.master.connect(this.ctx.destination);
      const n=Math.floor(this.ctx.sampleRate*.04), b=this.ctx.createBuffer(1,n,this.ctx.sampleRate), d=b.getChannelData(0);
      for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3); this.noise=b; }
    if(this.ctx.state!=='running') this.ctx.resume(); }catch(e){} },
  setMuted(m){ this.muted=m; if(this.master) this.master.gain.setTargetAtTime(m?0:.8,this.ctx.currentTime,.05); },
  ok(){ return this.ctx&&!this.muted&&this.ctx.state==='running'; },
  env(g,t,peak,att,dec){ g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(peak,t+att); g.gain.exponentialRampToValueAtTime(.0001,t+att+dec); },
  pop(delay=0){ if(!this.ok()) return; const c=this.ctx, t=c.currentTime+delay, o=c.createOscillator(), g=c.createGain();
    o.type='sine'; o.frequency.setValueAtTime(720,t); o.frequency.exponentialRampToValueAtTime(170,t+.14); this.env(g,t,.32,.006,.17);
    o.connect(g).connect(this.master); o.start(t); o.stop(t+.2); },
  crackle(k){ if(!this.ok()) return; const c=this.ctx;
    for(let i=0;i<k;i++){ const t=c.currentTime+Math.random()*.04, s=c.createBufferSource(), f=c.createBiquadFilter(), g=c.createGain();
      s.buffer=this.noise; s.playbackRate.value=.6+Math.random()*1.3; f.type='bandpass'; f.frequency.value=1600+Math.random()*3400; f.Q.value=1.4;
      g.gain.value=.05+Math.random()*.07; s.connect(f).connect(g).connect(this.master); s.start(t); } },
  chime(vol=1){ if(!this.ok()) return; const c=this.ctx, t=c.currentTime;
    [523.25,659.25,783.99,1046.5].forEach((fq,i)=>{ const o=c.createOscillator(), g=c.createGain(), st=t+i*.07;
      o.type='sine'; o.frequency.value=fq; this.env(g,st,.16*vol,.02,2.1); o.connect(g).connect(this.master); o.start(st); o.stop(st+2.3); });
    const o=c.createOscillator(), g=c.createGain(); o.type='triangle'; o.frequency.value=130.8; this.env(g,t,.12*vol,.3,2.1);
    o.connect(g).connect(this.master); o.start(t); o.stop(t+2.5); },
  fail(){ if(!this.ok()) return; const c=this.ctx, t=c.currentTime, o=c.createOscillator(), g=c.createGain();
    o.type='sine'; o.frequency.setValueAtTime(170,t); o.frequency.exponentialRampToValueAtTime(52,t+.45); this.env(g,t,.38,.01,.5);
    o.connect(g).connect(this.master); o.start(t); o.stop(t+.55); this.crackle(3); },
  glide(ms){ if(!this.ok()) return; const c=this.ctx, t=c.currentTime, d=ms/1000, o=c.createOscillator(), f=c.createBiquadFilter(), g=c.createGain();
    o.type='triangle'; o.frequency.setValueAtTime(330,t); o.frequency.exponentialRampToValueAtTime(495,t+d); f.type='lowpass'; f.frequency.value=1400;
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.08,t+.3); g.gain.setValueAtTime(.08,t+d-.3); g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(f).connect(g).connect(this.master); o.start(t); o.stop(t+d+.05); }
};
const SPK_ON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
const SPK_OFF='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="m22 9-6 6M16 9l6 6"/></svg>';
function paintMute(){ const b=$('mute'); b.innerHTML=Snd.muted?SPK_OFF:SPK_ON; b.setAttribute('aria-label',Snd.muted?'Sound off':'Sound on'); }
try{ Snd.muted=localStorage.getItem('spore-muted')==='1'; }catch(e){}
paintMute();
$('mute').onclick=()=>{ Snd.init(); Snd.setMuted(!Snd.muted); try{ localStorage.setItem('spore-muted',Snd.muted?'1':'0'); }catch(e){} paintMute(); if(!Snd.muted) Snd.pop(); };

/* ---------- dark version of OpenFreeMap's Positron style ---------- */
function darken(st){
  st.layers=st.layers.filter(l=>!(l.type==='symbol' && /poi/i.test(l.id)));
  for(const l of st.layers){
    const p=l.paint=l.paint||{}, id=l.id.toLowerCase();
    if(l.type==='background') p['background-color']='#080a0b';
    else if(l.type==='fill'){ delete p['fill-pattern'];
      p['fill-color']=/water|ocean|lake/.test(id)?'#0a1317':/park|wood|grass|landcover|green|forest/.test(id)?'#0b110e':/building/.test(id)?'#101516':'#0b0e0f';
      if('fill-outline-color' in p) p['fill-outline-color']='#141a1b'; }
    else if(l.type==='fill-extrusion') p['fill-extrusion-color']='#111718';
    else if(l.type==='line'){ delete p['line-pattern'];
      p['line-color']=/casing|outline/.test(id)?'#0b0e0f':/water|river|stream|canal/.test(id)?'#0f1c22':/boundary|admin/.test(id)?'#2a3035':
        /rail|transit/.test(id)?'#1a1f1f':/motorway|trunk|highway/.test(id)?'#2c3532':/primary|secondary|major/.test(id)?'#242c2a':'#1a201f'; }
    else if(l.type==='symbol'){
      if(l.layout&&l.layout['text-field']){ p['text-color']=/place|city|town|country|state|suburb/.test(id)?'#a2b0aa':'#68756f'; p['text-halo-color']='#080a0b'; }
      if('icon-color' in p) p['icon-color']='#68756f'; }
    else if(l.type==='circle') p['circle-color']='#2a3330';
  }
  return st;
}

/* ---------- map ---------- */
let map, TILE_URL=null, mapReady=false;
let friends=[], busy=false, res=null, spotMarkers={}, floodSt=null, placeMarkers=[];
const results={time:null,dist:null};   // one result per measure, kept until the friends change
const EMPTY={type:'FeatureCollection',features:[]};
async function initMap(){
  let style;
  try{ style=darken(await getJSON(STYLE_URL)); }
  catch(e){ status('Can\'t reach the map server. Check your connection and reload.',true);
    style={version:8,sources:{},layers:[{id:'bg',type:'background',paint:{'background-color':'#080a0b'}}]}; }
  map=new maplibregl.Map({container:'map', style, center:[103.8198,1.3521], zoom:10.2, attributionControl:false,
    dragRotate:false, pitchWithRotate:false, maxPitch:0});
  map.touchZoomRotate.disableRotation();
  map.addControl(new maplibregl.AttributionControl({compact:true}),'top-right');
  map.on('load',()=>{
    for(const s of ['old','cur','places']) map.addSource(s,{type:'geojson',data:EMPTY});
    for(const s of ['old','cur']){
      map.addLayer({id:s+'-glow',type:'line',source:s,layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':['get','color'],'line-width':10,'line-blur':6,'line-opacity':.3}});
      map.addLayer({id:s+'-core',type:'line',source:s,filter:['!=',['get','tun'],1],layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':['get','color'],'line-width':2.6,'line-opacity':.95}});
      map.addLayer({id:s+'-tun',type:'line',source:s,filter:['==',['get','tun'],1],paint:{'line-color':['get','color'],'line-width':2.2,'line-opacity':.85,'line-dasharray':[1,1.6]}});
    }
    map.addLayer({id:'places',type:'circle',source:'places',paint:{'circle-radius':5,'circle-color':'#FFD27A','circle-opacity':.55,'circle-stroke-color':'#FFD27A','circle-stroke-width':1.5}});
    map.on('click','places',e=>{ const f=e.features[0]; openPlacePopup(f.properties.name); });
    mapReady=true;
  });
  map.on('resize',()=>{ if(floodSt) floodSt.dirty=true; });
  map.on('zoom',()=>poiLabels());
  map.on('click',e=>{
    if(e.originalEvent.target.closest && e.originalEvent.target.closest('.pin,.spot,.poi,.maplibregl-popup')) return;
    if(map.queryRenderedFeatures(e.point,{layers:map.getLayer('places')?['places']:[]}).length) return;
    if(popup&&popup.isOpen()){ popup.remove(); popup=null; return; }   // first tap just closes a place card
    addFriend(e.lngLat.lat,e.lngLat.lng);
  });
  // where the vector tiles live (also the source of roads + places)
  try{ const src=Object.values(style.sources).find(s=>s.type==='vector');
    if(src){ TILE_URL = src.tiles ? src.tiles[0] : (await getJSON(src.url)).tiles[0]; pruneStore(); } }catch(e){}
}
function lockMap(on){
  for(const h of ['dragPan','scrollZoom','boxZoom','keyboard','doubleClickZoom','touchZoomRotate']) on?map[h].disable():map[h].enable();
  if(!on) map.touchZoomRotate.disableRotation();
}
const P = ll => map.project([ll[1],ll[0]]);
function fitTo(pts,duration=0){
  const la=pts.map(p=>p[0]), lo=pts.map(p=>p[1]);
  map.fitBounds([[Math.min(...lo),Math.min(...la)],[Math.max(...lo),Math.max(...la)]],
    {padding:{top:80,left:40,right:40,bottom:Math.min(sheetH()+20,innerHeight*.6)},duration,maxZoom:15});
}

/* ---------- friends ---------- */
function pinEl(color,n){ const d=document.createElement('div'); d.className='pin'; d.style.setProperty('--c',color); d.textContent=n; return d; }
function addFriend(lat,lng,label){
  if(busy) return;
  if(friends.length>=6){ toast('Max 6 friends'); return; }
  const used=new Set(friends.map(f=>f.color));
  const f={lat,lng,label,color:COLORS.find(c=>!used.has(c)),secs:null};
  f.el=pinEl(f.color,friends.length+1);
  f.marker=new maplibregl.Marker({element:f.el,draggable:true}).setLngLat([lng,lat]).addTo(map);
  f.marker.on('dragend',()=>{ const p=f.marker.getLngLat(); f.lat=p.lat; f.lng=p.lng; reset(); render(); });
  friends.push(f); reset(); render();
}
function removeFriend(i){ if(busy) return; friends[i].marker.remove(); friends.splice(i,1); reset(); render(); }
function reset(){ results.time=results.dist=null; clearVisuals(); }
function clearVisuals(){
  res=null; vis.tips=null; vis.bursts=[]; vis.seeds=null; pathAnim.cur=pathAnim.old=null;
  for(const k in spotMarkers) spotMarkers[k].remove(); spotMarkers={};
  if(mapReady){ for(const s of ['old','cur','places']) map.getSource(s).setData(EMPTY); }
  if(popup){ popup.remove(); popup=null; }
  placeMarkers.forEach(m=>m.remove()); placeMarkers=[];
  friends.forEach(f=>f.secs=null); $('out').innerHTML=''; status('');
  fctx.clearRect(0,0,innerWidth,innerHeight); rctx.clearRect(0,0,innerWidth,innerHeight); rl.style.opacity=0; floodSt=null; fence.show=false; vis.alarms=[];
  updateBar();
}
function render(){
  $('friends').innerHTML=friends.map((f,i)=>`<div class="friend" style="--c:${f.color}"><span class="dot"></span>

function switchMode(m){

  const had=!!results[MODE]; log('switch to', m==='time'?'Time':'Distance', results[m]?'(saved result)':had?'(auto-calculating)':''); MODE=m; clearVisuals(); render();

/* ---------- reading vector tiles (Mapbox Vector Tile = protobuf) ---------- */
const lon2x=(lon,z)=>(lon+180)/360*2**z;
const lat2y=(lat,z)=>{ const r=lat*Math.PI/180; return (1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*2**z; };
const x2lon=(x,z)=>x/2**z*360-180;
const y2lat=(y,z)=>{ const n=Math.PI-2*Math.PI*y/2**z; return 180/Math.PI*Math.atan(Math.sinh(n)); };

function decodeMVT(buf, want){
  let pos=0; const dv=new DataView(buf.buffer,buf.byteOffset,buf.byteLength), td=new TextDecoder();
  const varint=()=>{ let r=0,m=1,b; do{ b=buf[pos++]; r+=(b&0x7f)*m; m*=128; }while(b&0x80); return r; };
  const skip=wt=>{ if(wt===0) varint(); else if(wt===1) pos+=8; else if(wt===2){ const l=varint(); pos+=l; } else if(wt===5) pos+=4; };
  const packed=()=>{ const l=varint(), end=pos+l, a=[]; while(pos<end) a.push(varint()); return a; };
  const layers={};
  while(pos<buf.length){
    const tag=varint(), f=tag>>3, wt=tag&7;
    if(f!==3||wt!==2){ skip(wt); continue; }
    const lend=varint()+pos; let name='', extent=4096; const keys=[], vals=[], feats=[];
    while(pos<lend){
      const t=varint(), ff=t>>3, w=t&7;
      if(ff===1){ const l=varint(); name=td.decode(buf.subarray(pos,pos+l)); pos+=l; }
      else if(ff===2){ const l=varint(); feats.push([pos,pos+l]); pos+=l; }
      else if(ff===3){ const l=varint(); keys.push(td.decode(buf.subarray(pos,pos+l))); pos+=l; }
      else if(ff===4){ const vend=varint()+pos; let v=null;
        while(pos<vend){ const vt=varint(), vf=vt>>3;
          if(vf===1){ const l=varint(); v=td.decode(buf.subarray(pos,pos+l)); pos+=l; }
          else if(vf===2){ v=dv.getFloat32(pos,true); pos+=4; }
          else if(vf===3){ v=dv.getFloat64(pos,true); pos+=8; }
          else if(vf===4||vf===5){ v=varint(); }
          else if(vf===6){ const n=varint(); v=(n%2)?-(n+1)/2:n/2; }
          else if(vf===7){ v=!!varint(); }
          else skip(vt&7); }
        vals.push(v); }
      else if(ff===5){ extent=varint(); }
      else skip(w);
    }
    pos=lend;
    if(!want[name]) continue;
    const out=[];
    for(const [s,e] of feats){
      pos=s; let tags=[], type=0, geom=[];
      while(pos<e){ const t=varint(), ff=t>>3, w=t&7;
        if(ff===2) tags=packed(); else if(ff===3) type=varint(); else if(ff===4) geom=packed(); else skip(w); }
      const props={}; for(let i=0;i<tags.length;i+=2) props[keys[tags[i]]]=vals[tags[i+1]];
      const lines=[]; let x=0,y=0,cur=null;
      for(let i=0;i<geom.length;){ const c=geom[i++], id=c&7, n=c>>3;
        if(id===1||id===2){ for(let k=0;k<n;k++){ const dx=geom[i++], dy=geom[i++]; x+=(dx>>>1)^-(dx&1); y+=(dy>>>1)^-(dy&1);
          if(id===1){ cur=[]; lines.push(cur); } cur.push([x,y]); } } }
      out.push({type,props,lines});
    }
    pos=lend; layers[name]={extent,features:out};
  }
  return layers;
}
// cut a line to the tile's own square, so neighbouring tiles join exactly at the edge
function clipLine(pts,a,b){
  const out=[]; let cur=null;
  for(let i=0;i<pts.length-1;i++){
    const [x0,y0]=pts[i],[x1,y1]=pts[i+1], dx=x1-x0, dy=y1-y0; let t0=0,t1=1,ok=true;
    const p=[-dx,dx,-dy,dy], q=[x0-a,b-x0,y0-a,b-y0];
    for(let k=0;k<4&&ok;k++){ if(p[k]===0){ if(q[k]<0) ok=false; } else { const r=q[k]/p[k];
      if(p[k]<0){ if(r>t1) ok=false; else if(r>t0) t0=r; } else { if(r<t0) ok=false; else if(r<t1) t1=r; } } }
    if(!ok){ cur=null; continue; }
    const A=[x0+t0*dx,y0+t0*dy], B=[x0+t1*dx,y0+t1*dy];
    if(!cur||t0>0){ cur=[A]; out.push(cur); }
    cur.push(B); if(t1<1) cur=null;
  }
  return out.filter(l=>l.length>1);
}
const tileCache=new Map();
const TSTATS={net:0,disk:0};
// download slots: 12 for tiles the spores need now, 4 for tiles fetched ahead of time.
// If a tile waiting in the "ahead" queue is suddenly needed, it jumps to the front.
const pool={high:12,low:4}, queue={high:[],low:[]};
function takeSlot(prio,key){ if(pool[prio]>0){ pool[prio]--; return Promise.resolve(prio); }
  return new Promise(r=>queue[prio].push({key,go:r})); }
function freeSlot(kind){ const q=queue[kind].shift(); if(q) q.go(kind); else pool[kind]++; }
function promote(key){ const i=queue.low.findIndex(q=>q.key===key); if(i<0) return; const [q]=queue.low.splice(i,1);
  if(pool.high>0){ pool.high--; q.go('high'); } else queue.high.unshift(q); }
let tileStore=null;
function openStore(){ if(!tileStore) tileStore=(window.caches?caches.open('spore-tiles-v1'):Promise.reject()).catch(()=>null); return tileStore; }
async function pruneStore(){ try{ const c=await openStore(); if(!c||!TILE_URL) return; const keep=TILE_URL.split('{z}')[0];
  for(const r of await c.keys()) if(!r.url.startsWith(keep)) c.delete(r); }catch(e){} }
async function tileBytes(url,key,prio){
  const c=await openStore();
  if(c){ try{ const hit=await c.match(url); if(hit){ TSTATS.disk++; return new Uint8Array(await hit.arrayBuffer()); } }catch(e){} }
  const kind=await takeSlot(prio,key);
  try{ const r=await fetch(url); if(r.status===204||r.status===404) return null; if(!r.ok) throw new Error('HTTP '+r.status);
    const ab=await r.arrayBuffer(); TSTATS.net++;
    if(c) c.put(url,new Response(ab.slice(0),{headers:{'Content-Type':'application/x-protobuf'}})).catch(()=>{});
    return new Uint8Array(ab);
  } finally{ freeSlot(kind); }
}
async function getTile(z,x,y,prio='high'){
  const key=z+'/'+x+'/'+y; if(tileCache.has(key)){ if(prio==='high') promote(key); return tileCache.get(key); }
  const p=(async()=>{
    const url=TILE_URL.replace('{z}',z).replace('{x}',x).replace('{y}',y);
    let lastErr;
    for(let attempt=0;attempt<3;attempt++){
      try{
        let buf=await tileBytes(url,key,prio); if(!buf) return {roads:[],names:[],pois:[]};
        if(buf[0]===0x1f&&buf[1]===0x8b) buf=new Uint8Array(await new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer());
        return parseTile(decodeMVT(buf,{transportation:1,transportation_name:1,poi:1}),z,x,y);
      }catch(e){ lastErr=e; await sleep(400*(attempt+1)); }
    }
    throw lastErr;
  })();
  tileCache.set(key,p); p.catch(()=>tileCache.delete(key));
  return p;
}
/* ---------- fix junctions inside a tile ----------
   Simplified map tiles drop the shared point where two straight roads cross, so the roads only
   *look* joined. Here we put a junction back wherever two roads cross (except bridges/tunnels),
   and join a road that stops within 12 m of the side of another road.                            */
function segX(p,p2,q,q2){ const r0=p2[0]-p[0], r1=p2[1]-p[1], s0=q2[0]-q[0], s1=q2[1]-q[1], d=r0*s1-r1*s0; if(Math.abs(d)<1e-9) return null;
  const a=q[0]-p[0], b=q[1]-p[1], t=(a*s1-b*s0)/d, u=(a*r1-b*r0)/d, e=1e-6;
  if(t<=e||t>=1-e||u<=e||u>=1-e) return null; return [t,u,[p[0]+t*r0,p[1]+t*r1]]; }
function joinCrossings(rs,ext,z,ty){
  const mpu=40075016*Math.cos(y2lat(ty+.5,z)*Math.PI/180)/2**z/ext, C=64, grid=new Map(), segs=[];
  rs.forEach((r,ri)=>{ for(let i=0;i<r.pts.length-1;i++){ const a=r.pts[i], b=r.pts[i+1], id=segs.push({ri,i,a,b})-1;
    const x0=Math.floor(Math.min(a[0],b[0])/C), x1=Math.floor(Math.max(a[0],b[0])/C), y0=Math.floor(Math.min(a[1],b[1])/C), y1=Math.floor(Math.max(a[1],b[1])/C);
    if((x1-x0+1)*(y1-y0+1)>900) continue;
    for(let x=x0;x<=x1;x++) for(let y=y0;y<=y1;y++){ const k=x*100003+y; let L=grid.get(k); if(!L) grid.set(k,L=[]); L.push(id); } } });
  const splits=rs.map(r=>r.pts.map(()=>[])), flat=r=>r.br||r.tun, mw=r=>r.cls==='motorway'&&!r.ramp, seen=new Set();
  let crossings=0;
  for(const L of grid.values()) for(let p=0;p<L.length;p++) for(let q=p+1;q<L.length;q++){
    const A=segs[L[p]], B=segs[L[q]], key=L[p]<L[q]?L[p]+':'+L[q]:L[q]+':'+L[p]; if(seen.has(key)) continue; seen.add(key);
    if(A.ri===B.ri&&Math.abs(A.i-B.i)<=1) continue;
    const ra=rs[A.ri], rb=rs[B.ri]; if(flat(ra)||flat(rb)||mw(ra)!==mw(rb)) continue;
    const X=segX(A.a,A.b,B.a,B.b); if(!X) continue;
    splits[A.ri][A.i].push([X[0],X[2]]); splits[B.ri][B.i].push([X[1],X[2]]); crossings++;
  }
  // dangling road ends near the side of another road
  const vcount=new Map(); for(const r of rs) for(const v of r.pts){ const k=v[0]+','+v[1]; vcount.set(k,(vcount.get(k)||0)+1); }
  const D=12/mpu, extra=[];
  rs.forEach((r,ri)=>{ if(flat(r)) return;
    for(const E of [r.pts[0],r.pts[r.pts.length-1]]){
      if(E[0]<=1||E[1]<=1||E[0]>=ext-1||E[1]>=ext-1) continue;          // tile edge: joined across tiles later
      if((vcount.get(E[0]+','+E[1])||0)>1) continue;                      // already a junction
      const cx=Math.floor(E[0]/C), cy=Math.floor(E[1]/C); let best=null, bd=D;
      for(let x=cx-1;x<=cx+1;x++) for(let y=cy-1;y<=cy+1;y++){ const L=grid.get(x*100003+y); if(!L) continue;
        for(const id of L){ const S=segs[id]; if(S.ri===ri||flat(rs[S.ri])) continue;
          const dx=S.b[0]-S.a[0], dy=S.b[1]-S.a[1], l2=dx*dx+dy*dy; if(!l2) continue;
          const t=clamp(((E[0]-S.a[0])*dx+(E[1]-S.a[1])*dy)/l2,0,1), P=[S.a[0]+t*dx,S.a[1]+t*dy], d=Math.hypot(E[0]-P[0],E[1]-P[1]);
          if(d<bd&&d>1e-6){ bd=d; best={S,t,P}; } } }
      if(!best) continue;
      if(best.t>1e-6&&best.t<1-1e-6) splits[best.S.ri][best.S.i].push([best.t,best.P]);
      const P=best.t<=1e-6?best.S.a:best.t>=1-1e-6?best.S.b:best.P;
      extra.push({cls:r.cls, ramp:r.ramp, oneway:0, tun:0, br:0, pts:[E,P]});
    } });
  const out=rs.map((r,ri)=>{ const pts=[];
    for(let i=0;i<r.pts.length;i++){ pts.push(r.pts[i]); if(i<r.pts.length-1&&splits[ri][i].length){ splits[ri][i].sort((a,b)=>a[0]-b[0]); for(const [,P] of splits[ri][i]) pts.push(P); } }
    return {...r,pts}; });

}
function parseTile(L,z,tx,ty){
  const toLL=(ext,[px,py])=>[y2lat(ty+py/ext,z), x2lon(tx+px/ext,z)];
  const roads=[], names=[], pois=[];
  const T=L.transportation;
  if(T){
    const rs=[];
    for(const f of T.features){
      const c=f.props.class; if(f.type!==2||!(c in SPEED)) continue;
      for(const ln of f.lines) for(const piece of clipLine(ln,0,T.extent))
        rs.push({cls:c, ramp:f.props.ramp==1, oneway:+f.props.oneway||0, tun:f.props.brunnel==='tunnel'?1:0, br:f.props.brunnel==='bridge'?1:0, pts:piece});
    }
    for(const r of joinCrossings(rs,T.extent,z,ty)) roads.push({cls:r.cls, ramp:r.ramp, oneway:r.oneway, tun:r.tun, pts:r.pts.map(p=>toLL(T.extent,p))});
  }
  const N=L.transportation_name;
  if(N) for(const f of N.features){ const nm=f.props['name:latin']||f.props.name_en||f.props.name; if(!nm) continue;
    for(const ln of f.lines) for(const p of ln) if(p[0]>=0&&p[1]>=0&&p[0]<=N.extent&&p[1]<=N.extent) names.push([...toLL(N.extent,p),nm]); }
  const Q=L.poi;
  if(Q) for(const f of Q.features){ const nm=f.props['name:latin']||f.props.name_en||f.props.name; if(!nm||!f.lines[0]) continue;
    const p=f.lines[0][0]; if(p[0]<0||p[1]<0||p[0]>Q.extent||p[1]>Q.extent) continue;
    const cat=catOf(f.props.class,f.props.subclass); if(!cat) continue;
    const ll=toLL(Q.extent,p); pois.push({name:nm,lat:ll[0],lng:ll[1],cat,sub:f.props.subclass||''}); }
  return {roads,names,pois};
}
function catOf(c,s){
  if(c==='restaurant'||c==='fast_food'||s==='food_court') return 'Food';
  if(c==='cafe'||c==='ice_cream') return 'Coffee';
  if(c==='bar'||c==='beer') return 'Drinks';
  if(c==='park'||s==='park'||s==='garden'||s==='nature_reserve') return 'Parks';
  if(s==='mall'||s==='department_store') return 'Malls';
  if(c==='attraction'||c==='museum'||c==='art_gallery'||c==='zoo'||c==='castle'||s==='viewpoint'||s==='museum'||s==='attraction') return 'Sights';
  return null;
}
async function loadTiles(z,bb,onProg){
  const x0=Math.floor(lon2x(bb.w,z)), x1=Math.floor(lon2x(bb.e,z)), y0=Math.floor(lat2y(bb.n,z)), y1=Math.floor(lat2y(bb.s,z));
  const jobs=[]; for(let x=x0;x<=x1;x++) for(let y=y0;y<=y1;y++) jobs.push([x,y]);
  const out=[]; let done=0, i=0;
  const worker=async()=>{ while(i<jobs.length){ const [x,y]=jobs[i++]; out.push(await getTile(z,x,y)); done++; onProg&&onProg(done,jobs.length); } };
  await Promise.all(Array.from({length:12},worker));
  return out;
}
const tileCount=(z,bb)=>(Math.floor(lon2x(bb.e,z))-Math.floor(lon2x(bb.w,z))+1)*(Math.floor(lat2y(bb.s,z))-Math.floor(lat2y(bb.n,z))+1);

/* ---------- road network that grows with the spores ----------
   Instead of downloading a whole rectangle, we start with the tiles around each friend.
   The spores spread through what's loaded; whenever a spore enters a tile, the tiles around it
   are fetched, so the download always stays one tile ahead of the spreading front.
   Downloading stops once the spores have met (plus ~30% more, needed for the equal spot).   */
const CELL=2e-4; // ~22 m grid used to join road ends
// the useful zone: the shape around all friends, padded. Spores never spread away from the group.
// rough centreline of the Johor Strait, west to east: north of it = Malaysia side

    : `Everyone rides ${rangeTxt(lo,hi,s.mode)}`;
  const cmp=results.time&&results.dist?`<div class="cmp">${['time','dist'].map(m=>{ const R=results[m], sp=R.sel==='equal'&&R.equal?R.equal:R.soon;
      return `<button data-mode="${m}" class="${m===MODE?'on':''}"><i>By ${m==='time'?'time':'distance'}</i><b>${esc(sp.road||'Unnamed road')}</b><small>${rangeTxt(Math.min(...sp.secs),Math.max(...sp.secs),m)}</small></button>`; }).join('')}</div>`:'';
  $('out').innerHTML=cmp+(res.equal?`<div class="tabs">${tab('soon','Soonest',res.soon)}${tab('equal','Equal',res.equal)}</div>`:'')+
    `<div class="card"><div class="k">${s.kind==='soon'?'Soonest meetup':'Equal rides'}</div>
     <div class="road">${esc(s.road||'Unnamed road')}</div>
     <div class="sub">${sub}</div>
     ${dirHTML(s.ll[0],s.ll[1])}</div>
     ${res.stats?`<div class="stats">${statsTxt(res.stats)} · <a href="#" data-copylog style="color:var(--dim)">Copy log</a></div>`:''}
     <div id="pl"><div class="empty">Looking around…</div></div>`;
  friends.forEach((f,i)=>{ f.secs=s.secs[i]; const el=$('tm'+i); if(el) el.textContent=fmtV(f.secs,s.mode); });
  updateBar();
  if(s.places===undefined){ s.places=null;
    nearby(s.ll).then(r=>{ s.places=r; }).catch(()=>{ s.places=false; }).then(()=>{ if(curSpot()===s) renderPlaces(); }); }
  else renderPlaces();
}
$('out').addEventListener('click',e=>{
  const mb=e.target.closest('[data-mode]'); if(mb){ switchMode(mb.dataset.mode); return; }
  const tb=e.target.closest('[data-tab]'); if(tb){ selectSpot(tb.dataset.tab); return; }
  const ch=e.target.closest('.chip'); if(ch){ curSpot().filter=ch.dataset.k; renderPlaces(); return; }
  const pl=e.target.closest('.place'); if(pl){ const p=curSpot().places.list.find(x=>x.name===pl.dataset.n); if(p) openPlace(p,true); }
});
async function nearby(ll){
  let list=[];
  for(const R of [1200,2500]){
    const dLa=R/110540, dLo=R/(111320*Math.cos(ll[0]*Math.PI/180));
    const tiles=await loadTiles(14,{s:ll[0]-dLa,n:ll[0]+dLa,w:ll[1]-dLo,e:ll[1]+dLo});
    const seen=new Set();
    list=tiles.flatMap(t=>t.pois).map(p=>({...p,d:hav(ll,[p.lat,p.lng])})).filter(p=>p.d<=R&&!seen.has(p.name)&&seen.add(p.name)).sort((a,b)=>a.d-b.d);
    if(list.length>=4) break;
  }
  return {list};
}
function renderPlaces(){
  const el=$('pl'); if(!el) return; const s=curSpot(), r=s.places;
  placeMarkers.forEach(m=>m.remove()); placeMarkers=[];
  if(r===null){ el.innerHTML='<div class="empty">Looking around…</div>'; return; }
  if(r===false){ el.innerHTML='<div class="empty">Couldn\'t load nearby places. Use Google Maps above.</div>'; return; }
  if(!r.list.length){ el.innerHTML='<div class="empty">Nothing mapped within 2.5 km. Very mysterious.</div>'; return; }
  const cats=['All',...['Food','Coffee','Drinks','Parks','Malls','Sights'].filter(k=>r.list.some(p=>p.cat===k))];
  const list=r.list.filter(p=>s.filter==='All'||p.cat===s.filter).slice(0,25);
  el.innerHTML=`<div class="chips">${cats.map(k=>`<button class="chip${k===s.filter?' on':''}" data-k="${k}">${k}</button>`).join('')}</div>`+
    list.map(p=>`<div class="place" data-n="${esc(p.name)}"><div class="pn"><b>${esc(p.name)}</b>
      <span>${p.cat}${p.sub&&!['park','mall'].includes(p.sub)?' · '+esc(p.sub.replace(/_/g,' ')):''}</span></div><div class="pd">${fmtDist(p.d)}</div></div>`).join('');
  list.forEach(p=>{ const el=document.createElement('div'); el.className='poi'; el.innerHTML=`<i></i><b>${esc(p.name)}</b>`;
    el.addEventListener('click',ev=>{ ev.stopPropagation(); openPlace(p,false); });
    placeMarkers.push(new maplibregl.Marker({element:el,anchor:'left',offset:[-6,0]}).setLngLat([p.lng,p.lat]).addTo(map)); });
  poiLabels();
}
function poiLabels(){ document.body.classList.toggle('poi-labels',!!map&&map.getZoom()>=14.5); }
let popup=null;
function openPlace(p,fromList){
  if(fromList){ setCollapsed(true); map.flyTo({center:[p.lng,p.lat],zoom:16.5,duration:800}); }
  if(popup) popup.remove();
  popup=new maplibregl.Popup({closeButton:false,closeOnClick:false,offset:10,maxWidth:'260px'}).setLngLat([p.lng,p.lat])
    .setHTML(`<b>${esc(p.name)}</b><div class="pc">${p.cat}${p.sub&&!['park','mall'].includes(p.sub)?' · '+esc(p.sub.replace(/_/g,' ')):''} · ${fmtDist(p.d)} from the hangout</div>${dirHTML(p.lat,p.lng)}`).addTo(map);
}
/* ---------- directions: Google Maps, Apple Maps or Waze, using exact coordinates ---------- */
const APPS={google:{n:'Google Maps',u:(a,b)=>`https://www.google.com/maps/dir/?api=1&destination=${a},${b}&travelmode=driving`},
            apple:{n:'Apple Maps',u:(a,b)=>`https://maps.apple.com/?daddr=${a},${b}&dirflg=d`},
            waze:{n:'Waze',u:(a,b)=>`https://waze.com/ul?ll=${a},${b}&navigate=yes`}};
let navApp=null; try{ navApp=localStorage.getItem('spore-nav'); }catch(e){}
function dirHTML(la,lo){
  la=(+la).toFixed(6); lo=(+lo).toFixed(6);
  const link=(k,cls)=>`<a ${cls?`class="${cls}" `:''}data-app="${k}" target="_blank" rel="noopener" href="${APPS[k].u(la,lo)}">${cls?'Directions · ':''}${APPS[k].n}</a>`;
  if(navApp&&APPS[navApp]) return `<div class="dir">${link(navApp,'go')}<span><small>or</small>${Object.keys(APPS).filter(k=>k!==navApp).map(k=>link(k)).join('')}</span></div>`;
  return `<div class="dir"><small>Directions with</small><span class="all">${Object.keys(APPS).map(k=>link(k)).join('')}</span></div>`;
}
document.addEventListener('click',e=>{ const a=e.target.closest('a[data-app]'); if(!a) return; navApp=a.dataset.app; try{ localStorage.setItem('spore-nav',navApp); }catch(err){} });

/* ---------- 2. saved places and groups (kept on this phone) ---------- */
let saved={places:[],groups:[]};
try{ const v=JSON.parse(localStorage.getItem('spore-saved')); if(v&&v.places&&v.groups) saved=v; }catch(e){}
function persist(){ try{ localStorage.setItem('spore-saved',JSON.stringify(saved)); }catch(e){ toast('Couldn\'t save on this device'); } }
const samePlace=(a,b)=>hav([a.lat,a.lng],[b.lat,b.lng])<40;
const isSaved=f=>saved.places.some(p=>samePlace(p,f));
function toggleSave(i){
  const f=friends[i]; if(!f) return;
  const k=saved.places.findIndex(p=>samePlace(p,f));
  if(k>=0){ saved.places.splice(k,1); persist(); toast('Removed from saved'); render(); renderSaved(); return; }
  const nm=prompt('Name this place',f.label||''); if(nm===null) return;
  const name=nm.trim()||f.label||'Saved place';
  saved.places.push({name,lat:f.lat,lng:f.lng}); persist(); f.label=name; toast('Saved '+name); render(); renderSaved();
}
function renderSaved(){
  const el=$('saved'); if(el.hidden) return;
  const pl=saved.places.length?`<div class="svl">${saved.places.map((p,i)=>`<div class="sv"><button data-p="${i}">${esc(p.name)}</button><button class="x" data-dp="${i}" aria-label="Delete">&times;</button></div>`).join('')}</div>`
    :'<div class="empty">Tap &#9734; next to a friend to save their spot.</div>';
  const gr=saved.groups.length?`<div class="svl">${saved.groups.map((g,i)=>`<div class="sv"><button data-g="${i}">${esc(g.name)}<small>${g.members.length}</small></button><button class="x" data-dg="${i}" aria-label="Delete">&times;</button></div>`).join('')}</div>`
    :'<div class="empty">No groups yet.</div>';
  el.innerHTML=`<h4>Saved places</h4>${pl}<h4>Groups</h4>${gr}<button class="b" id="saveGroup" ${friends.length<2?'disabled':''}>Save these ${friends.length||''} friends as a group</button>`;
}
$('savedBtn').onclick=()=>{ const el=$('saved'); el.hidden=!el.hidden; renderSaved(); };
$('saved').addEventListener('click',e=>{
  const t=e.target.closest('button'); if(!t||busy) return; const d=t.dataset;
  if(d.p!=null){ const p=saved.places[+d.p]; if(friends.some(f=>samePlace(f,p))){ toast(p.name+' is already added'); return; }
    addFriend(p.lat,p.lng,p.name); map.easeTo({center:[p.lng,p.lat]}); renderSaved(); }
  else if(d.dp!=null){ const p=saved.places[+d.dp]; if(confirm(`Delete ${p.name}?`)){ saved.places.splice(+d.dp,1); persist(); render(); renderSaved(); } }
  else if(d.g!=null){ const g=saved.groups[+d.g]; friends.forEach(f=>f.marker.remove()); friends=[]; reset();
    g.members.forEach(m=>addFriend(m.lat,m.lng,m.name||undefined)); fitTo(friends.map(f=>[f.lat,f.lng]),800); $('saved').hidden=true; toast('Loaded '+g.name); }
  else if(d.dg!=null){ const g=saved.groups[+d.dg]; if(confirm(`Delete group ${g.name}?`)){ saved.groups.splice(+d.dg,1); persist(); renderSaved(); } }
  else if(t.id==='saveGroup'){ const nm=prompt('Name this group',''); if(nm===null) return;
    saved.groups.push({name:nm.trim()||`Group of ${friends.length}`,members:friends.map(f=>({name:f.label||'',lat:f.lat,lng:f.lng}))}); persist(); toast('Group saved'); renderSaved(); }
});

initMap(); render();
</script>
