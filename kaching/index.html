<style>
:root{
  --bg:#FFF6EC; --card:#FFFFFF; --ink:#1A1530; --ink-2:#5E5775; --ink-3:#9A93AE;
  --line:#1A1530; --soft:#F3EADF; --field:#FFFBF6;
  --pink:#FF3D7F; --orange:#FF8A1F; --violet:#7B5CFF; --yellow:#FFD23F; --lime:#B8F03C; --teal:#16C79A; --sky:#3DA5FF;
  --hero-a:#7B5CFF; --hero-b:#FF3D7F;
  --shadow:4px 4px 0 var(--line); --shadow-sm:2px 2px 0 var(--line);
  --r:20px; --r-sm:14px;
  --display:'Bricolage Grotesque','Plus Jakarta Sans',system-ui,-apple-system,sans-serif;
  --spring:cubic-bezier(.2,.9,.3,1.25); --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15121F; --card:#221D33; --ink:#F6F1FF; --ink-2:#B9B1D1; --ink-3:#7E7699;
    --line:#0A0812; --soft:#2C2642; --field:#1B1729; color-scheme:dark;
  }
}
:root[data-theme="dark"]{--bg:#15121F; --card:#221D33; --ink:#F6F1FF; --ink-2:#B9B1D1; --ink-3:#7E7699; --line:#0A0812; --soft:#2C2642; --field:#1B1729; color-scheme:dark;}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink);font-size:15px;line-height:1.4;min-height:100vh;
  padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 110px);overflow-x:hidden}
.wrap{max-width:520px;margin:0 auto}
h1,h2,.display{font-family:var(--display);letter-spacing:-.02em}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink)}
.num{font-variant-numeric:tabular-nums}

/* ---------- header ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{width:38px;height:38px;border-radius:12px;background:var(--yellow);border:2px solid var(--line);box-shadow:var(--shadow-sm);display:grid;place-items:center;font-family:var(--display);font-weight:800;color:#1A1530;font-size:20px;transform:rotate(-6deg)}
.brand h1{font-size:24px;font-weight:800}
.icon-btn{width:42px;height:42px;border-radius:14px;background:var(--card);border:2px solid var(--line);box-shadow:var(--shadow-sm);display:grid;place-items:center;transition:transform .15s var(--ease),box-shadow .15s}
.icon-btn:active,.press:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--line)}
.icon-btn svg{width:20px;height:20px}

.month{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:2px solid var(--line);border-radius:999px;box-shadow:var(--shadow-sm);padding:4px;margin-bottom:16px}
.month button{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;transition:background .2s}
.month button:active{background:var(--soft)}
.month button:disabled{opacity:.25}
.month-label{font-weight:800;font-size:15px}
.month-label small{display:block;text-align:center;font-weight:600;font-size:11px;color:var(--ink-3);margin-top:-2px}

/* ---------- cards ---------- */
.card{background:var(--card);border:2px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin-bottom:16px}
.card-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.card-head h2{font-size:18px;font-weight:800}
.card-head .meta{font-size:12px;font-weight:700;color:var(--ink-3)}
.link{font-size:13px;font-weight:800;color:var(--violet)}

.reveal{opacity:0;transform:translateY(14px);animation:rise .55s var(--ease) forwards;animation-delay:calc(var(--i,0) * 70ms)}
@keyframes rise{to{opacity:1;transform:none}}

/* hero */
.hero{background:linear-gradient(135deg,var(--hero-a),var(--hero-b));color:#fff;position:relative;overflow:hidden}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.12)}
.hero::before{width:180px;height:180px;right:-60px;top:-70px}
.hero::after{width:90px;height:90px;left:-30px;bottom:-40px;background:rgba(255,210,63,.35)}
.hero-row{display:flex;align-items:center;justify-content:space-between;gap:12px;position:relative;z-index:1}
.hero-label{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;opacity:.85}
.hero-total{font-family:var(--display);font-weight:800;font-size:44px;line-height:1.05;margin:4px 0 12px}
.hero-total .cents{font-size:24px;opacity:.8}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.18);border:1.5px solid rgba(255,255,255,.4);border-radius:999px;padding:5px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;display:inline-block}
.ring{position:relative;width:92px;height:92px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .trk{stroke:rgba(255,255,255,.22)}
.ring .bar{stroke:var(--yellow);stroke-linecap:round;transition:stroke-dashoffset 1.2s var(--ease) .2s,stroke .3s}
.ring-mid{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring-mid b{font-family:var(--display);font-size:20px;font-weight:800;display:block;line-height:1}
.ring-mid span{font-size:10px;font-weight:700;opacity:.85}
.hero-foot{position:relative;z-index:1;margin-top:14px;padding-top:12px;border-top:1.5px dashed rgba(255,255,255,.4);font-size:13px;font-weight:600;display:flex;justify-content:space-between;gap:8px}
.hero-foot b{font-weight:800}

/* stat tiles */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.tile{background:var(--card);border:2px solid var(--line);border-radius:var(--r-sm);box-shadow:var(--shadow-sm);padding:10px 12px;min-width:0}
.tile .t-emoji{font-size:18px}
.tile b{display:block;font-family:var(--display);font-size:20px;font-weight:800;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile span{font-size:11px;font-weight:700;color:var(--ink-3)}

/* banner */
.banner{display:flex;align-items:center;gap:12px;background:var(--lime);color:#1A1530;border:2px solid var(--line);border-radius:var(--r-sm);box-shadow:var(--shadow-sm);padding:12px 14px;margin-bottom:16px;width:100%;text-align:left;font-weight:700;transition:transform .15s,box-shadow .15s}
.banner .b-emoji{font-size:22px;animation:wiggle 1.6s ease-in-out infinite}
.banner .b-text{flex:1}
@keyframes wiggle{0%,100%{transform:rotate(0)}20%{transform:rotate(-14deg)}40%{transform:rotate(12deg)}60%{transform:rotate(-6deg)}}

/* category rows */
.cat-row{display:grid;grid-template-columns:40px 1fr auto;align-items:center;gap:12px;padding:8px 0;width:100%;text-align:left}
.cat-row+.cat-row{border-top:1.5px solid var(--soft)}
.chip-ico{width:40px;height:40px;border-radius:12px;border:2px solid var(--line);display:grid;place-items:center;font-size:19px}
.cat-name{font-weight:700;font-size:14px;display:flex;justify-content:space-between;gap:8px}
.cat-name small{color:var(--ink-3);font-weight:700;font-size:12px}
.track{height:10px;border-radius:99px;background:var(--soft);margin-top:6px;overflow:hidden;border:1.5px solid var(--line)}
.fill{height:100%;width:0;border-radius:99px;transition:width 1s var(--ease)}
.amt{font-weight:800;font-size:15px;text-align:right;min-width:72px}

/* tx rows */
.tx{display:grid;grid-template-columns:40px 1fr auto;align-items:center;gap:12px;padding:10px 0;width:100%;text-align:left}
.tx+.tx{border-top:1.5px solid var(--soft)}
.tx-title{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-sub{font-size:12px;color:var(--ink-3);font-weight:600;display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:1px}
.tag{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;padding:2px 6px;border-radius:6px;border:1.5px solid var(--line);color:#1A1530}
.tag.once{background:var(--yellow)}
.tag.new{background:var(--lime)}
.tag.split{background:var(--sky)}
.tag.ok{background:transparent;color:var(--teal);border-color:var(--teal)}
.tx-amt{text-align:right;font-weight:800}
.tx-amt small{display:block;font-size:11px;color:var(--ink-3);font-weight:700}
.empty{text-align:center;padding:28px 12px;color:var(--ink-3);font-weight:600}
.empty .e-emoji{font-size:40px;display:block;margin-bottom:8px}

/* activity */
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:2px solid var(--line);border-radius:var(--r-sm);box-shadow:var(--shadow-sm);padding:0 12px;margin-bottom:12px}
.search input{flex:1;border:0;background:transparent;padding:12px 0;outline:none;font-weight:600}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;margin:0 -16px 8px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 12px;border-radius:999px;border:2px solid var(--line);background:var(--card);font-weight:700;font-size:13px;transition:transform .2s var(--spring),background .2s}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);transform:translateY(-2px)}
.day-head{display:flex;justify-content:space-between;font-size:12px;font-weight:800;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;margin:4px 2px 6px}

/* bottom nav */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 14px);display:flex;align-items:center;gap:6px;background:var(--card);border:2px solid var(--line);border-radius:999px;box-shadow:var(--shadow);padding:6px;z-index:20}
.nav-btn{display:flex;align-items:center;gap:6px;padding:10px 16px;border-radius:999px;font-weight:800;font-size:13px;color:var(--ink-2);transition:background .25s,color .25s}
.nav-btn svg{width:18px;height:18px}
.nav-btn[aria-current="page"]{background:var(--ink);color:var(--bg)}
.fab{width:56px;height:56px;border-radius:50%;background:var(--pink);color:#fff;border:2px solid var(--line);box-shadow:var(--shadow-sm);display:grid;place-items:center;margin:-18px 4px 0;transition:transform .25s var(--spring),box-shadow .15s}
.fab svg{width:26px;height:26px}
.fab:active{transform:scale(.9) rotate(90deg);box-shadow:0 0 0 var(--line)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,8,18,.45);opacity:0;pointer-events:none;transition:opacity .3s;z-index:30}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--bg);border:2px solid var(--line);border-bottom:0;border-radius:28px 28px 0 0;padding:10px 16px calc(env(safe-area-inset-bottom) + 20px);transform:translateY(105%);visibility:hidden;transition:transform .45s var(--spring),visibility 0s .45s;z-index:40;max-height:92vh;overflow-y:auto}
.sheet.on{transform:none;visibility:visible;transition:transform .45s var(--spring)}
.grab{width:44px;height:5px;border-radius:9px;background:var(--ink-3);margin:0 auto 12px;opacity:.5}
.sheet h2{font-size:22px;font-weight:800;margin-bottom:14px}
.amount-box{display:flex;align-items:center;justify-content:center;gap:4px;background:var(--yellow);color:#1A1530;border:2px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;margin-bottom:16px}
.amount-box span{font-family:var(--display);font-size:30px;font-weight:800}
.amount-box input{font-family:var(--display);font-size:44px;font-weight:800;width:100%;max-width:220px;text-align:center;border:0;background:transparent;outline:none;color:#1A1530}
.amount-box input::placeholder{color:rgba(26,21,48,.35)}
.field{margin-bottom:14px}
.field label,.lbl{display:block;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);margin-bottom:6px}
.input{width:100%;background:var(--field);border:2px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;font-weight:600;outline:none;transition:box-shadow .2s}
.input:focus{box-shadow:var(--shadow-sm)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cat-opt{border:2px solid var(--line);border-radius:var(--r-sm);padding:8px 2px;background:var(--card);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;transition:transform .2s var(--spring),box-shadow .2s}
.cat-opt span{font-size:20px}
.cat-opt[aria-pressed="true"]{transform:translate(-2px,-2px);box-shadow:var(--shadow-sm);color:#1A1530}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border:2px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;margin-bottom:10px;width:100%;text-align:left}
.toggle b{font-weight:700;font-size:14px;display:block}
.toggle small{font-size:12px;color:var(--ink-3);font-weight:600}
.sw{width:48px;height:28px;border-radius:99px;background:var(--soft);border:2px solid var(--line);position:relative;flex:none;transition:background .25s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--card);border:2px solid var(--line);transition:transform .3s var(--spring)}
.sw.on{background:var(--teal)}
.sw.on::after{transform:translateX(20px)}
.collapse{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s var(--ease)}
.collapse.open{grid-template-rows:1fr}
.collapse>div{overflow:hidden}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px;border-radius:var(--r-sm);border:2px solid var(--line);box-shadow:var(--shadow-sm);font-weight:800;font-size:16px;transition:transform .15s,box-shadow .15s}
.btn.primary{background:var(--pink);color:#fff}
.btn.ghost{background:var(--card)}
.btn.danger{background:transparent;color:var(--pink);box-shadow:none;border-color:var(--pink)}
.btn+.btn{margin-top:10px}
.hint{font-size:12px;color:var(--ink-3);font-weight:600;margin-top:6px}
.sec{margin:20px 0 10px;font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2)}
.result{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.result div{background:var(--card);border:2px solid var(--line);border-radius:var(--r-sm);padding:10px;text-align:center}
.result b{display:block;font-family:var(--display);font-size:24px;font-weight:800}
.result span{font-size:11px;font-weight:700;color:var(--ink-3)}

/* toast + confetti */
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 14px);transform:translate(-50%,-140%);background:var(--ink);color:var(--bg);font-weight:800;padding:12px 18px;border-radius:999px;border:2px solid var(--line);z-index:60;transition:transform .45s var(--spring);white-space:nowrap;font-size:14px}
.toast.on{transform:translate(-50%,0)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:55}
.hidden{display:none!important}
.view{animation:fade .35s var(--ease)}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0ms!important;transition-duration:.01ms!important}.reveal{opacity:1;transform:none}}
@media (max-width:360px){.hero-total{font-size:36px}.ring{width:78px;height:78px}.nav-btn span{display:none}}
</style>
</head>

<script>
/* =========================================================
   Kaching — personal spending tracker (phase 1)
   Data lives in this phone's storage. Split-ready model.
   ========================================================= */
const CATS = {
  food:{n:'Food',e:'🍜',c:'#FF6A3D'}, petrol:{n:'Petrol',e:'⛽',c:'#FFC21F'},
  groceries:{n:'Groceries',e:'🛒',c:'#2BD18E'}, transport:{n:'Transport',e:'🚇',c:'#3DA5FF'},
  shopping:{n:'Shopping',e:'🛍️',c:'#B66DFF'}, fun:{n:'Fun',e:'🎳',c:'#FF7AD9'},
  bills:{n:'Bills',e:'💡',c:'#9BE03C'}, health:{n:'Health',e:'🩺',c:'#FF4F8B'},
  insurance:{n:'Insurance',e:'🛡️',c:'#6F7BFF'}, instalment:{n:'Instalment',e:'📆',c:'#22C9D8'},
  other:{n:'Other',e:'✨',c:'#C2B8DA'}
};
const ONE_TIME_DEFAULT = new Set(['insurance','instalment']);
const RULES = [
  [/ESSO|SHELL|CALTEX|\bSPC\b|SINOPEC/, 'petrol'],
  [/GRAB ?FOOD|FOODPANDA|DELIVEROO|MCDONALD|KFC|BURGER|SUSHI|CHICKEN|KAFFE|TOAST|DRINK|COFFEE|KOPI|YOCHI|CHINESE R|SRISUN|SHIOK|VENDING|VENDORA|COCA-COLA|STARBUCKS|BAKERY|NASI|PRATA|RESTAURANT|CAFE|FOOD/, 'food'],
  [/NTUC|FAIRPRICE|SHENG SIONG|GIANT|COLD STORAGE|DON DON|PRIME SUPER/, 'groceries'],
  [/BUS\/MRT|SIMPLYGO|\bLTA\b|\bGRAB\b|GOJEK|TADA|COMFORT|EZ-?LINK|CDG/, 'transport'],
  [/UNIQLO|SHOPEE|SPAYLATER|LAZADA|AMAZON|TAOBAO|DECATHLON|MUJI|DAISO|IKEA/, 'shopping'],
  [/INSURANCE|\bAIA\b|PRUDENTIAL|GREAT EASTERN|\bINCOME\b/, 'insurance'],
  [/CLINIC|UNIHEALTH|HOSPITAL|PHARM|GUARDIAN|WATSONS|LENSKART|OWNDAYS|DENTAL|POLYCLINIC/, 'health'],
  [/EZPY|INSTAL/, 'instalment'],
  [/NETFLIX|SPOTIFY|SINGTEL|STARHUB|\bM1\b|CIRCLES|SP SERVICES|GOMO|DISNEY|YOUTUBE|APPLE\.COM|ICLOUD/, 'bills'],
  [/GOLDEN VILLAGE|\bGV\b|CATHAY|SHAW|BOWL|ARCADE|TIMEZONE|STEAM|PLAYSTATION|KARAOKE|TEO HENG/, 'fun'],
];
const STORE_KEY = 'kaching.v1';

/* --- seed: Standard Chartered statement 16 Oct 2026 --- */
const SEED = [
['2026-09-13','BUS/MRT',2.56,'transport'],['2026-09-17','ESSO',19.80,'petrol'],['2026-09-18','NTUC FairPrice Toh Guan',9.45,'groceries'],
['2026-09-18','Kaffe & Toast',10.00,'food'],['2026-09-18','McDonald\'s',23.25,'food'],['2026-09-19','Shiok Burger',13.90,'food'],
['2026-09-20','Sheng Siong',3.66,'groceries'],['2026-09-20','Uniqlo Bugis+',69.80,'shopping'],['2026-09-20','Sushi Plus Bugis',82.13,'food'],
['2026-09-21','FJ WG Mon Chinese',25.00,'food'],['2026-09-23','ESSO',16.20,'petrol'],['2026-09-24','Jinjja Chicken',15.30,'food'],
['2026-09-26','ESSO',3.85,'petrol'],['2026-09-27','JJ Drink',1.40,'food'],['2026-09-27','Srisun Express',5.90,'food'],
['2026-09-27','ESSO',21.76,'petrol'],['2026-09-27','Income Insurance',328.55,'insurance',1],['2026-09-30','YoChi',14.60,'food'],
['2026-10-02','Vendora Box',1.10,'food'],['2026-10-02','BUS/MRT',2.56,'transport'],['2026-10-05','LTA',32.00,'transport'],
['2026-10-07','Net Direct Vending',1.80,'food'],['2026-10-07','ESSO',9.00,'petrol'],['2026-10-09','Coca-Cola',2.50,'food'],
['2026-10-09','ESSO',6.30,'petrol'],['2026-10-09','ESSO',9.00,'petrol'],['2026-10-09','SPayLater',38.66,'shopping'],
['2026-10-09','Lenskart Bedok Mall',270.00,'health',1],['2026-10-10','McDonald\'s',9.50,'food'],['2026-10-11','YoChi',18.17,'food'],
['2026-10-11','Unihealth Jurong',153.65,'health',1],['2026-10-12','ESSO',13.50,'petrol'],['2026-10-13','Encik Tan FairPrice',5.80,'groceries'],
['2026-10-14','McDonald\'s',12.85,'food'],['2026-10-14','ESSO',13.50,'petrol'],['2026-10-16','EZPY instalment 12/12',136.95,'instalment',1],
['2026-10-16','EZPY instalment 12/12',200.00,'instalment',1]
];

/* ---------------- state ---------------- */
let S;
function freshState(){
  return {
    txs: SEED.map((r,i)=>({id:'seed'+i,date:r[0],merchant:r[1],amount:r[2],category:r[3],oneTime:!!r[4],
      source:'statement',card:'SC Simply Cash',verified:true,stmtKey:'seed'+i,inbox:false,split:null,note:'',created:Date.now()})),
    learned:{}, budget:500, sync:{url:'',secret:'',last:null}, v:1
  };
}
function load(){
  try{ const raw=localStorage.getItem(STORE_KEY); if(raw) return JSON.parse(raw); }catch(e){}
  return freshState();
}
function save(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(S)); }catch(e){ toast('⚠️ Couldn\'t save on this device'); } }
S = load();

const today = new Date();
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const TODAY = iso(today);
let ym = TODAY.slice(0,7);
let view = 'Home';
let filter = {cat:'all', q:'', mode:'all'};

/* ---------------- helpers ---------------- */
const $ = s => document.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = (n,dp=2) => '$'+Number(n).toLocaleString('en-SG',{minimumFractionDigits:dp,maximumFractionDigits:dp});
const counted = t => (t.split && t.split.share!=null) ? t.split.share : t.amount;
const uid = () => Math.random().toString(36).slice(2,10)+Date.now().toString(36);
const mKey = s => String(s||'').toUpperCase().replace(/SINGAPORE|\bSG\b|PTE|LTD|\(.*?\)/g,' ').replace(/[^A-Z ]/g,'').replace(/\s+/g,' ').trim().split(' ').slice(0,2).join(' ');
const monthName = k => new Date(k+'-01T00:00').toLocaleDateString('en-SG',{month:'long',year:'numeric'});
const dayLabel = d => { if(d===TODAY) return 'Today'; const y=new Date(today); y.setDate(y.getDate()-1); if(d===iso(y)) return 'Yesterday';
  return new Date(d+'T00:00').toLocaleDateString('en-SG',{weekday:'short',day:'numeric',month:'short'}); };
const daysBetween = (a,b) => Math.round((new Date(a+'T00:00')-new Date(b+'T00:00'))/864e5);
function guessCat(merchant){
  const k=mKey(merchant); if(S.learned[k]) return S.learned[k];
  const u=String(merchant).toUpperCase();
  for(const [re,c] of RULES) if(re.test(u)) return c;
  return 'other';
}
function shiftMonth(k,n){ const [y,m]=k.split('-').map(Number); const d=new Date(y,m-1+n,1); return iso(d).slice(0,7); }
function monthTxs(k){ return S.txs.filter(t=>t.date.startsWith(k)); }

/* ---------------- render: month bar ---------------- */
function renderMonth(){
  const isNow = ym===TODAY.slice(0,7);
  $('#mLabel').innerHTML = `${monthName(ym)}<small>${isNow?'This month':''}</small>`;
  $('#mNext').disabled = ym>=TODAY.slice(0,7);
}

/* ---------------- render: home ---------------- */
function renderHome(){
  const txs = monthTxs(ym);
  const reg = txs.filter(t=>!t.oneTime), once = txs.filter(t=>t.oneTime);
  const regSum = reg.reduce((a,t)=>a+counted(t),0), onceSum = once.reduce((a,t)=>a+counted(t),0);
  const total = regSum+onceSum;
  const owed = txs.reduce((a,t)=>a+(t.split&&t.split.share!=null?t.amount-t.split.share:0),0);
  const isNow = ym===TODAY.slice(0,7);
  const [Y,M] = ym.split('-').map(Number);
  const dim = new Date(Y,M,0).getDate();
  const daysSoFar = isNow ? today.getDate() : (ym<TODAY.slice(0,7)? dim : 0);
  const daysLeft = isNow ? dim-today.getDate()+1 : 0;
  const pct = S.budget>0 ? regSum/S.budget : 0;
  const left = S.budget - regSum;
  const ringColor = pct>1 ? '#FF3D7F' : pct>.8 ? '#FF8A1F' : '#FFD23F';

  // no-spend days (regular spend only)
  const spendDays = new Set(reg.map(t=>t.date));
  const noSpend = Math.max(0, daysSoFar - [...spendDays].filter(d=>d.slice(8)<=String(daysSoFar).padStart(2,'0')).length);
  const avg = daysSoFar? regSum/daysSoFar : 0;

  // categories (regular)
  const byCat = {};
  reg.forEach(t=>byCat[t.category]=(byCat[t.category]||0)+counted(t));
  const cats = Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  const maxCat = cats.length? cats[0][1] : 1;
  const topCat = cats[0] ? CATS[cats[0][0]] : null;

  const inbox = S.txs.filter(t=>t.inbox).length;
  const recent = [...txs].sort((a,b)=>b.date.localeCompare(a.date)||b.created-a.created).slice(0,5);
  const [whole,cents] = total.toFixed(2).split('.');

function countUp(el,to){
  const start=performance.now(), dur=900;
  const step=now=>{const p=Math.min((now-start)/dur,1); const e=1-Math.pow(1-p,3);
    el.textContent=Math.round(to*e).toLocaleString('en-SG'); if(p<1) requestAnimationFrame(step);};
  requestAnimationFrame(step);
}

/* ---------------- sync with Worker ---------------- */
function parseAmount(v){ if(typeof v==='number') return v; const s=String(v||'').replace(/[^0-9.,-]/g,''); return parseFloat(s.replace(/,(?=\d{3}\b)/g,'').replace(',','.')); }
function parseDate(v,ts){ const d=new Date(v); if(v && !isNaN(d)) return iso(d); return iso(new Date(ts||Date.now())); }
async function sync(manual){
  if(!S.sync.url||!S.sync.secret){ if(manual) toast('Add your Worker URL & secret first'); return; }
  try{
    const h={Authorization:'Bearer '+S.sync.secret};
    const r=await fetch(S.sync.url+'/tx',{headers:h}); if(!r.ok) throw new Error(r.status);
    const items=await r.json(); const ids=[]; let added=0;
    for(const it of items){
      ids.push(it.id);
      if(S.txs.some(t=>t.remoteId===it.id)) continue;
      const amt=parseAmount(it.amount); if(!(amt>0)) continue;
      const mer=String(it.merchant||'Apple Pay').trim(); const cat=guessCat(mer);
      S.txs.push({id:uid(),remoteId:it.id,date:parseDate(it.date,it.ts),merchant:mer,amount:Math.round(amt*100)/100,category:cat,
        oneTime:ONE_TIME_DEFAULT.has(cat),source:'applepay',card:it.card||'',verified:false,inbox:true,split:null,note:'',created:Date.now()});
      added++;
    }
    if(ids.length) await fetch(S.sync.url+'/ack',{method:'POST',headers:{...h,'Content-Type':'application/json'},body:JSON.stringify({ids})});
    S.sync.last=Date.now(); save();
    if(added){ toast(`⚡ ${added} new tap${added>1?'s':''} synced`); render(); } else if(manual) toast('✨ Already up to date');
  }catch(e){ if(manual) toast('⚠️ Sync failed — check URL/secret'); }
}

/* ---------------- statement upload + reconcile ---------------- */
const MON={Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
async function pdfToLines(pdf){
  const out=[];
  for(let p=1;p<=pdf.numPages;p++){
    const page=await pdf.getPage(p); const tc=await page.getTextContent(); const rows=[];
    for(const it of tc.items){ if(!it.str||!it.str.trim()) continue; const y=it.transform[5], x=it.transform[4];
      let r=rows.find(r=>Math.abs(r.y-y)<3); if(!r){r={y,items:[]};rows.push(r);} r.items.push({x,s:it.str}); }
    rows.sort((a,b)=>b.y-a.y);
    for(const r of rows){ r.items.sort((a,b)=>a.x-b.x); out.push(r.items.map(i=>i.s).join(' ').replace(/\s+/g,' ').trim()); }
  }
  return out;
}
function parseStatement(lines){
  let stmt=null;
  for(const l of lines){ const m=l.match(/Statement Date\s*:?\s*(\d{1,2}) (\w{3}) (\d{4})/); if(m){stmt={m:MON[m[2]],y:+m[3]};break;} }
  if(!stmt) stmt={m:today.getMonth(),y:today.getFullYear()};
  const re=/^(\d{1,2}) (Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec) (\d{1,2}) (?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec) (.+?) (-?[\d,]+\.\d{2}) ?(CR)?$/;
  const txs=[];
  for(const l of lines){ const m=l.match(re); if(!m) continue;
    const desc=m[4].replace(/Transaction Ref \d+/,'').replace(/\s+/g,' ').trim();
    const mon=MON[m[2]]; const y= mon>stmt.m ? stmt.y-1 : stmt.y;
    txs.push({date:`${y}-${String(mon+1).padStart(2,'0')}-${String(+m[1]).padStart(2,'0')}`,desc,amount:parseFloat(m[5].replace(/,/g,'')),credit:!!m[6]}); }
  return txs;
}
function tidyName(desc){
  let s=desc.replace(/\b(SINGAPORE|SG)\b/gi,'').replace(/\s\d{4,}\b/g,'').replace(/COGOLINKS\*/i,'').replace(/~+/g,'').replace(/\s+/g,' ').trim();
  return s.split(' ').map(w=>w.length<=3&&/^[A-Z]+$/.test(w)?w:w.charAt(0)+w.slice(1).toLowerCase()).join(' ');
}
$('#pdfInput').onchange=async e=>{
  const f=e.target.files[0]; e.target.value=''; if(!f) return;
  toast('📄 Reading statement…');
  try{
    const pdfjs=await import('https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.min.mjs');
    pdfjs.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs';
    const pdf=await pdfjs.getDocument({data:new Uint8Array(await f.arrayBuffer())}).promise;
    const rows=parseStatement(await pdfToLines(pdf)).filter(r=>!r.credit);
    if(!rows.length){ toast('🤔 Couldn\'t find transactions in that PDF'); return; }
    reconcile(rows);
  }catch(err){ toast('⚠️ Couldn\'t read that PDF'); console.error(err); }
};
function reconcile(rows){
  let matched=0, fixed=0, added=0, already=0; const fixes=[]; const claimed=new Set();
  rows.forEach(r=>{
    const key=`${r.date}|${r.amount}|${r.desc}`;
    // already confirmed by an earlier upload (or the preloaded statement)?
    const done=S.txs.find(t=>t.verified && !claimed.has(t.id) && t.date===r.date && Math.abs(t.amount-r.amount)<0.005);
    if(done){ claimed.add(done.id); already++; return; }
    const pool=S.txs.filter(t=>!t.verified && Math.abs(daysBetween(t.date,r.date))<=3);
    let hit=pool.find(t=>Math.abs(t.amount-r.amount)<0.005);
    if(hit){ Object.assign(hit,{verified:true,stmtKey:key}); matched++; return; }
    const k=mKey(r.desc);
    hit=pool.find(t=>k && mKey(t.merchant)===k);
    if(hit){ fixes.push(`${hit.merchant}: ${money(hit.amount)} → ${money(r.amount)}`); Object.assign(hit,{amount:r.amount,verified:true,stmtKey:key}); fixed++; return; }
    const name=tidyName(r.desc); const cat=guessCat(name+' '+r.desc);
    S.txs.push({id:uid(),date:r.date,merchant:name,amount:r.amount,category:cat,oneTime:ONE_TIME_DEFAULT.has(cat),source:'statement',
      card:'',verified:true,stmtKey:key,inbox:false,split:null,note:'',created:Date.now()});
    added++;
  });
  save(); render();
  openSheet(`
    <h2>Statement checked ✅</h2>
    <div class="result"><div><b>${matched}</b><span>matched</span></div><div><b>${fixed}</b><span>amount fixed</span></div><div><b>${added}</b><span>added</span></div></div>
    ${already?`<p class="hint">${already} were already confirmed from an earlier upload.</p>`:''}
    ${fixes.length?`<div class="sec">Fixed amounts</div><div class="card" style="padding:12px 14px;box-shadow:none">${fixes.map(x=>`<div style="padding:4px 0;font-weight:600;font-size:14px">${esc(x)}</div>`).join('')}</div>`:''}
    ${added?`<p class="hint" style="margin-bottom:14px">Added items were things you didn't log or tap with Apple Pay. Check their categories in Activity.</p>`:''}
    <button class="btn primary press" id="rDone">Nice</button>`);
  if(matched+fixed+added) confetti();
  $('#rDone').onclick=closeSheet;
}

/* ---------------- backup ---------------- */
function exportData(){
  const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`kaching-backup-${TODAY}.json`; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
$('#jsonInput').onchange=async e=>{
  const f=e.target.files[0]; e.target.value=''; if(!f) return;
  try{ const d=JSON.parse(await f.text()); if(!Array.isArray(d.txs)) throw 0; S=d; save(); closeSheet(); render(); toast('✅ Restored'); }
  catch{ toast('⚠️ Not a Kaching backup'); }
};

/* ---------------- toast + confetti ---------------- */
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('on'),2200); }
function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c=$('#confetti'), x=c.getContext('2d'), dpr=devicePixelRatio||1;
  c.width=innerWidth*dpr; c.height=innerHeight*dpr; x.scale(dpr,dpr);
  const cols=['#FF3D7F','#FFD23F','#7B5CFF','#16C79A','#3DA5FF','#FF8A1F','#B8F03C'];
  const ps=Array.from({length:90},()=>({x:innerWidth/2,y:innerHeight-90,vx:(Math.random()-.5)*14,vy:-(Math.random()*15+8),
    s:Math.random()*7+5,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[Math.random()*cols.length|0],sh:Math.random()<.5}));
  const t0=performance.now();
  (function f(now){ const el=now-t0; x.clearRect(0,0,innerWidth,innerHeight);
    ps.forEach(p=>{ p.vy+=.45; p.vx*=.99; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr;
      x.save(); x.translate(p.x,p.y); x.rotate(p.r); x.globalAlpha=Math.max(0,1-el/1600); x.fillStyle=p.c;
      if(p.sh){x.beginPath();x.arc(0,0,p.s/2,0,7);x.fill();} else x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); x.restore(); });
    if(el<1600) requestAnimationFrame(f); else x.clearRect(0,0,innerWidth,innerHeight);
  })(t0);
}

/* ---------------- boot ---------------- */
render();
sync(false);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) sync(false); });
</script>
