<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Redline">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#161219">
<title>Redline</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Saira+Condensed:wght@600;700;800&display=swap">
<style>
/* Redline. Layout: one scrolling screen per tab, a real bike gauge at the top, chunky colour cards below, a floating nav.
   Colour = category (orange fuel, yellow service, mint renewals, sky rides). Red only ever means overdue or low fuel. */
:root{
  --bg:#161219; --panel:#1F1A24; --panel2:#2A2330; --ink:#FFF8F0; --cream:#F6EBDD; --muted:#B5ABBA; --tick:#5A5060;
  --orange:#FF6A2B; --lemon:#FFD84D; --mint:#45E0A2; --sky:#5AB8FF; --red:#FF3B3B; --amber:#FFB020;
  --disp:"Bricolage Grotesque","Avenir Next",system-ui,-apple-system,sans-serif; --inst:"Saira Condensed","Arial Narrow",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);overflow:hidden}
body{font-family:var(--disp);font-size:17px;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--cream);outline-offset:2px}
.grow{flex:1;min-width:0}
/* screen */
.view{position:fixed;inset:0;z-index:2;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;scrollbar-width:none}
.view::-webkit-scrollbar{display:none}
.pad{max-width:520px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(118px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.pad.enter>*{animation:popIn .6s cubic-bezier(.2,1.25,.4,1) both}
.pad.enter>*:nth-child(2){animation-delay:.05s}.pad.enter>*:nth-child(3){animation-delay:.1s}.pad.enter>*:nth-child(4){animation-delay:.15s}.pad.enter>*:nth-child(5){animation-delay:.2s}.pad.enter>*:nth-child(6){animation-delay:.25s}.pad.enter>*:nth-child(n+7){animation-delay:.3s}
@keyframes popIn{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
.gear{position:fixed;right:max(16px,calc(50% - 244px));top:calc(12px + env(safe-area-inset-top,0px));z-index:5;width:46px;height:46px;border-radius:16px;border:0;background:var(--panel);color:var(--cream);display:grid;place-items:center}
.gear svg{width:23px;height:23px}
.hi{display:flex;align-items:center;gap:12px;min-height:50px;padding-right:58px}
.hi h1{margin:0;font:800 32px/1.02 var(--disp);letter-spacing:-.02em;text-wrap:balance}
.hi small{display:block;font:600 15px var(--disp);color:var(--muted);margin-top:4px}
.hi>div{flex:1;min-width:0}
.plate{flex:none;font:800 14px var(--disp);background:var(--cream);color:var(--bg);padding:8px 12px;border-radius:12px;letter-spacing:.05em}
.plate.o{background:var(--orange);color:#1A0E07}
.plate.sm{font-size:12px;padding:4px 8px;border-radius:8px;margin-left:6px;vertical-align:1px}
.mfocus[hidden]{display:none}
.sec{margin:10px 2px 0;font:800 22px var(--disp);letter-spacing:-.01em}
.lab{font:700 14px var(--inst);letter-spacing:.2em;color:var(--muted)}

/* the gauge */
.dash{position:relative;width:100%;max-width:360px;margin:0 auto;aspect-ratio:328/236}
.gsvg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.gsvg .track{fill:none;stroke:var(--panel2);stroke-width:18;stroke-linecap:round}
.gsvg .ezone{fill:none;stroke:var(--red);stroke-width:18;stroke-linecap:round;opacity:.9}
.gsvg .fill{fill:none;stroke:var(--orange);stroke-width:18;stroke-linecap:round;stroke-dasharray:0 100}
.gsvg .tk{stroke:var(--tick);stroke-width:1.8;stroke-linecap:round} .gsvg .tk.m{stroke:var(--cream);stroke-width:3.2} .gsvg .tk.e{stroke:var(--red);stroke-width:2.4}
.gsvg .gl{font:800 18px var(--inst);fill:var(--muted);text-anchor:middle} .gsvg .gl.e{fill:var(--red)}
.gsvg .ndl line{stroke:var(--cream);stroke-width:5;stroke-linecap:round}
.gsvg .ndl{transform-origin:180px 150px;transform:rotate(-125deg)}
.read{position:absolute;left:0;right:0;top:38%;text-align:center;pointer-events:none}
.read b{display:block;font:800 clamp(64px,21vw,84px)/.9 var(--disp);letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.read span{display:block;font:700 14px var(--inst);letter-spacing:.24em;color:var(--orange);margin-top:6px}
.lamp{position:absolute;left:50%;bottom:2%;transform:translateX(-50%);width:34px;height:34px;color:#3A3240}
.lamp svg{width:100%;height:100%} .lamp.dim{color:#7A6A50} .lamp.on{color:var(--amber);filter:drop-shadow(0 0 8px rgba(255,176,32,.8));animation:blink 1.6s ease-in-out infinite}
.dash.low .fill{stroke:var(--red)} .dash.low .read b{color:var(--red)} .dash.low .read span{color:var(--red)}
@keyframes blink{50%{opacity:.35}}
.lightbtn{align-self:center;display:flex;align-items:center;gap:8px;border:0;background:var(--panel);color:var(--muted);border-radius:999px;padding:9px 16px;font:700 15px var(--disp);margin-top:-6px}
.lightbtn svg{width:18px;height:18px} .lightbtn.on{color:var(--amber);box-shadow:inset 0 0 0 2px var(--amber)}
/* roller odometer */
.odo{display:flex;align-items:center;justify-content:center;gap:10px}
.drums{display:flex;gap:3px;padding:4px;background:#0B090D;border-radius:13px;box-shadow:inset 0 0 0 1px #2C2630}
.drum{width:30px;height:44px;overflow:hidden;border-radius:7px;background:linear-gradient(180deg,#221C27,#2E2734 50%,#221C27);position:relative}
.drum::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.5),transparent 30%,transparent 70%,rgba(0,0,0,.5));pointer-events:none}
.strip{display:flex;flex-direction:column;transition:transform 1.2s cubic-bezier(.5,0,.2,1)}
.strip i{height:44px;flex:none;display:grid;place-items:center;font:800 30px var(--inst);font-style:normal;color:var(--cream)}
.drum.last{background:linear-gradient(180deg,#3A1D10,#4A2614 50%,#3A1D10)} .drum.last .strip i{color:var(--orange)}

/* colour cards */
.card{display:block;border:0;border-radius:26px;padding:16px 18px;text-align:left;text-decoration:none;color:inherit;font:inherit;width:100%}
.c-lemon{background:var(--lemon);color:#1F1700} .c-mint{background:var(--mint);color:#06281A} .c-sky{background:var(--sky);color:#061B2E}
.c-orange{background:var(--orange);color:#1A0E07} .c-red{background:var(--red);color:#fff} .c-cream{background:var(--cream);color:var(--bg)} .plain{background:var(--panel)}
.card .t{flex:1;min-width:0}
.card .t span{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font:700 16px var(--disp)}
.card .t b{display:block;font:800 32px/1.05 var(--disp);letter-spacing:-.02em;margin-top:4px}
.card .t b small,.sq b small,.tile b small,.km small,.mo b small{font-size:.5em;margin-left:4px;letter-spacing:0;font-weight:700}
.card .t>small{display:block;font:600 15px var(--disp);margin-top:4px;opacity:.75}
.due{display:flex;align-items:center;gap:14px}
.due em{font-style:normal;font:800 12px var(--disp);letter-spacing:.08em;background:#1F1700;color:var(--lemon);padding:4px 8px;border-radius:999px}
.due.over{box-shadow:0 0 0 3px var(--bg),0 0 0 6px var(--red)} .due.over em{background:var(--red);color:#fff}
.sqbtn{flex:none;width:66px;height:66px;border-radius:22px;border:0;background:#1F1700;color:var(--lemon);font:800 17px var(--disp)}
.sqbtn:active,.card:active,.tile:active,.qbtn:active,.bigbtn:active,.pg:active{transform:scale(.97)}
.sqbtn.ok{background:#fff;color:#1F1700}
.lowfuel{display:flex;align-items:center;gap:14px;animation:popIn .5s both}
.cbtn{flex:none;display:flex;align-items:center;gap:8px;background:#fff;color:var(--red);text-decoration:none;font:800 16px var(--disp);padding:14px 16px;border-radius:18px}
.cbtn svg{width:20px;height:20px}
.wx{display:flex;align-items:center;gap:14px}
.wi{width:56px;height:56px;flex:none;border-radius:18px;background:var(--bg);color:var(--lemon);display:grid;place-items:center} .wi svg{width:30px;height:30px}
.wx.wet .wi{color:var(--sky)} .wx .t b{font-size:24px}
.incident{display:flex;align-items:center;gap:14px} .incident>svg{width:30px;height:30px;flex:none}
.incident span{display:block;font:700 14px var(--disp);opacity:.85} .incident b{display:block;font:700 17px/1.3 var(--disp);margin-top:2px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px} .three{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sq{display:flex;flex-direction:column;justify-content:space-between;gap:8px;min-height:120px}
.sq span{font:700 16px var(--disp)} .sq b{font:800 44px/1 var(--disp);letter-spacing:-.03em}
.s3{min-height:104px;padding:14px} .s3 b{font-size:28px}
.bigbtn{display:flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:22px;min-height:62px;font:800 18px var(--disp);width:100%}
.bigbtn svg{width:24px;height:24px}
.quick{display:flex;gap:10px}
.qbtn{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:76px;border:0;border-radius:22px;background:var(--panel);font:700 15px var(--disp)}
.qbtn svg{width:24px;height:24px;color:var(--sky)}
.note{color:var(--muted);font-size:15px;line-height:1.45;padding:2px 4px}
.note.link{background:none;border:0;text-align:left;color:var(--sky);font:700 16px var(--disp);padding:6px 4px}
.empty{color:var(--muted);font-size:16px;line-height:1.5;padding:14px 4px;text-align:center}

/* rides */
.mapcard{position:relative;padding:0;height:290px;overflow:hidden;background:#0F0C12}
.mapcard canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.mo{position:absolute;left:16px;top:14px;pointer-events:none}
.mo span{display:block;font:700 15px var(--disp);color:var(--muted)} .mo b{display:block;font:800 40px/1 var(--disp);letter-spacing:-.03em;margin-top:2px}
.mchips{position:absolute;left:12px;bottom:12px;display:flex;gap:6px;pointer-events:none}
.mchips span{font:700 14px var(--disp);background:rgba(22,18,25,.85);padding:7px 11px;border-radius:999px;color:var(--cream)}
.mfocus{position:absolute;left:10px;right:10px;bottom:10px;display:flex;align-items:center;gap:12px;background:var(--cream);color:var(--bg);border-radius:20px;padding:10px 10px 10px 16px}
.mfocus span{display:block;font:600 14px var(--disp);opacity:.7} .mfocus b{display:block;font:800 19px var(--disp);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mfocus .k{font:800 26px var(--disp);flex:none} .mfocus .k small{font-size:14px;margin-left:2px}
.rbtn{flex:none;width:52px;height:52px;border:0;border-radius:18px;background:var(--bg);color:var(--cream);display:grid;place-items:center} .rbtn svg{width:22px;height:22px}
.cams{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cam{display:flex;flex-direction:column;gap:3px;text-decoration:none;color:inherit}
.shot{aspect-ratio:16/10;border-radius:20px;overflow:hidden;background:var(--panel);margin-bottom:6px}
.shot img{width:100%;height:100%;object-fit:cover;display:block}
.camph{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--muted);font-size:13px;text-align:center;padding:8px;background:repeating-linear-gradient(135deg,#1F1A24 0 10px,#241E29 10px 20px)}
.camph svg{width:30px;height:30px}
.cam b{font:800 18px var(--disp)} .cam span{font:600 14px var(--disp);color:var(--muted)}
.rrow{display:flex;align-items:center;gap:14px;width:100%;border:0;background:none;padding:12px 2px;border-top:1px solid #2C2630;text-align:left;color:inherit}
.rrow:first-child{border-top:0}
.when{width:44px;flex:none;display:flex;flex-direction:column;align-items:center} .when b{font:800 24px/1 var(--disp)} .when small{font:700 13px var(--disp);color:var(--muted);margin-top:2px}
.rrow .t{display:block;font:700 17px var(--disp);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrow .s{display:block;font:500 14px var(--disp);color:var(--muted);margin-top:3px}
.km{flex:none;font:800 20px var(--disp)}
.rrow.sel{background:rgba(90,184,255,.1);border-radius:16px;box-shadow:inset 4px 0 0 var(--sky)}
.flag{font-style:normal;font:800 11px var(--disp);background:var(--sky);color:#061B2E;padding:2px 6px;border-radius:6px;vertical-align:3px;margin-left:4px}
.ch{display:flex;align-items:baseline;gap:8px;margin-bottom:10px} .ch b{font:800 19px var(--disp)} .ch span{color:var(--muted);font-size:15px}
.bars{display:flex;gap:10px;height:150px;align-items:flex-end}
.bcol{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px}
.bcol i{width:100%;background:var(--orange);border-radius:10px;min-height:4px} .bcol:not(:last-child) i{opacity:.55}
.bcol span{font:700 13px var(--disp);color:var(--muted)} .bcol .bv{color:var(--cream)}



/* floating nav */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:6;width:min(488px,calc(100% - 28px));height:72px;border-radius:26px;background:#231D28;display:flex;align-items:center;justify-content:space-between;padding:0 8px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.nav button{border:0;background:none;height:52px;min-width:48px;border-radius:18px;display:flex;align-items:center;justify-content:center;gap:8px;color:#9E93A4;padding:0 12px;font:800 15px var(--disp);transition:background .25s,color .25s}
.nav button svg{width:24px;height:24px;flex:none}
.nav button span{display:none}
.nav button[aria-current="true"]{background:var(--cream);color:var(--bg)} .nav button[aria-current="true"] span{display:inline}
.nav .plus{width:60px;height:60px;border-radius:21px;background:var(--orange);color:#1A0E07;padding:0}
.nav .plus svg{width:28px;height:28px}

/* sheets and forms */
.shade{position:fixed;inset:0;z-index:8;background:rgba(10,8,12,.6);opacity:0;pointer-events:none;transition:opacity .3s}
.shade.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;z-index:9;width:min(560px,100%);max-height:90vh;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;background:var(--panel);border-radius:30px 30px 0 0;padding:10px 18px calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,104%);visibility:hidden;transition:transform .42s cubic-bezier(.2,1.1,.3,1),visibility 0s .42s}
.sheet.on{transform:translate(-50%,0);visibility:visible;transition:transform .42s cubic-bezier(.2,1.1,.3,1)}
.grab{width:44px;height:5px;border-radius:5px;background:#4A4150;margin:2px auto 14px}
.sh-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:16px}
.sh-head h2{margin:0;font:800 28px/1.05 var(--disp);letter-spacing:-.02em}
.sh-head p{margin:6px 0 0;color:var(--muted);font-size:16px;line-height:1.45}
.sh-head .x{flex:none;width:46px;height:46px;border-radius:16px;border:0;background:var(--panel2);color:var(--cream);display:grid;place-items:center} .sh-head .x svg{width:20px;height:20px}
.fld{display:block;margin-bottom:14px}
.fld>span{display:block;font:700 15px var(--disp);color:var(--muted);margin-bottom:7px}
.fld input,.fld textarea{width:100%;padding:15px 16px;border:0;border-radius:16px;background:var(--panel2);color:var(--ink);font:700 19px var(--disp);outline:none;-webkit-appearance:none;appearance:none}
.fld input:focus,.fld textarea:focus{box-shadow:0 0 0 3px var(--orange)}
.fld textarea{min-height:96px;resize:vertical;font-weight:500;font-size:17px}
.two.f,.two{gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chipbtn{border:0;border-radius:999px;background:var(--panel2);color:var(--cream);font:700 15px var(--disp);padding:11px 15px;min-height:44px}
.chipbtn[aria-pressed="true"]{background:var(--cream);color:var(--bg)}
.tgl{display:flex;align-items:center;justify-content:space-between;width:100%;padding:12px 0;background:none;border:0;font:700 17px var(--disp);color:var(--ink);text-align:left}
.sw{width:54px;height:32px;border-radius:32px;background:var(--panel2);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#8E8494;transition:transform .25s,background .25s}
.sw.on{background:var(--orange)} .sw.on::after{transform:translateX(22px);background:#fff}
.btns{display:flex;gap:10px;margin-top:8px}
.btn{flex:1;border:0;border-radius:18px;background:var(--orange);color:#1A0E07;font:800 17px var(--disp);padding:16px 14px;min-height:56px}
.btn.ghost{background:var(--panel2);color:var(--cream)} .btn.danger{background:none;color:var(--red);box-shadow:inset 0 0 0 2px rgba(255,59,59,.5)} .btn.danger.solid{background:var(--red);color:#fff;box-shadow:none}
.btn.sm{flex:none;min-height:44px;padding:10px 16px;font-size:15px}
.confirm{margin-top:14px;padding:14px;border-radius:18px;background:rgba(255,59,59,.12)} .confirm>span{display:block;margin-bottom:10px;font-size:16px}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;width:100%;padding:14px 2px;border:0;border-top:1px solid #2C2630;background:none;color:inherit;text-align:left;text-decoration:none}
.li:first-child{border-top:0}
.li .t{display:block;font:700 17px var(--disp);white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .li .s{display:block;font:500 14px var(--disp);color:var(--muted);margin-top:3px} .li .r{margin-left:auto;font:800 17px var(--disp);white-space:nowrap}
.dot{width:12px;height:12px;border-radius:50%;flex:none;background:var(--lemon)} .dot.ok{background:var(--mint)} .dot.soon{background:var(--amber)} .dot.over{background:var(--red)} .dot.unset{background:#4A4150}
.bar{display:block;height:8px;border-radius:8px;background:var(--panel2);margin-top:8px;overflow:hidden} .bar i{display:block;height:100%;border-radius:8px;background:var(--lemon)} .bar.soon i{background:var(--amber)} .bar.over i{background:var(--red)}
.pblock{background:var(--panel2);border-radius:20px;padding:6px 14px;margin-bottom:12px}
.ph{font:800 15px var(--disp);padding:8px 0 4px}
.pi{display:flex;align-items:center;gap:10px;border-top:1px solid #3A3240;padding:10px 0} .pi:first-of-type{border-top:0}
.pmain{flex:1;min-width:0;display:flex;align-items:center;gap:12px;border:0;background:none;color:inherit;text-align:left;padding:0}
.pmain .t{display:block;font:700 17px var(--disp)} .pmain .s{display:block;font:500 14px var(--disp);color:var(--muted);margin-top:3px}
.done{flex:none;width:76px;min-height:60px;border:0;border-radius:16px;background:var(--lemon);color:#1F1700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:800 13px/1.1 var(--disp)}
.done svg{width:20px;height:20px} .done.ok{background:var(--mint)}
.addit{width:100%;border:0;background:none;color:var(--sky);font:700 15px var(--disp);padding:12px 0;text-align:left}
.plusgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pg{display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:16px;border:0;border-radius:24px;padding:18px;min-height:120px;text-align:left}
.pg svg{width:32px;height:32px} .pg b{font:800 22px var(--disp)}
.mlist{display:flex;flex-direction:column;gap:8px}
.mrow{display:flex;align-items:center;gap:14px;width:100%;border:0;border-radius:20px;background:var(--panel2);padding:12px 14px;color:inherit;text-align:left}
.mi{width:44px;height:44px;flex:none;border-radius:14px;background:var(--bg);color:var(--cream);display:grid;place-items:center} .mi svg{width:22px;height:22px}
.mrow b{display:block;font:800 17px var(--disp)} .mrow .grow>span{display:block;font:500 14px var(--disp);color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow>svg{width:18px;height:18px;color:var(--muted);flex:none}
