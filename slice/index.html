<style>
:root{
  --ink:#100C1C; --s1:#1C1733; --s2:#272044; --s3:#352C5C;
  --tx:#FFFFFF; --tx2:#BDB4DC; --tx3:#7F75A3;
  --yellow:#FFC21F; --coral:#FF5A36; --violet:#9B5CFF; --cyan:#1FB6FF; --green:#3DDC84; --pink:#FF3D7F; --orange:#FF8A1F; --lime:#B8F03C; --teal:#14D1B8; --red:#FF3B4E;
  --display:'Bricolage Grotesque','Plus Jakarta Sans',system-ui,-apple-system,sans-serif;
  --spring:cubic-bezier(.2,.9,.3,1.2); --ease:cubic-bezier(.2,.8,.2,1);
  --safe-t:env(safe-area-inset-top); --safe-b:env(safe-area-inset-bottom); --safe-t-px:env(safe-area-inset-top,0px); --safe-b-px:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--ink);color:var(--tx)}
body{font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.4;min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select{font:inherit;color:var(--tx)}
.num{font-variant-numeric:tabular-nums}
.disp{font-family:var(--display);letter-spacing:-.02em}
.hidden{display:none!important}
i.ti{line-height:1;display:inline-block}

/* ---------- shard cuts (all angular shapes come from these) ---------- */
.cut-a{clip-path:polygon(0 8px,10px 0,100% 0,100% calc(100% - 12px),calc(100% - 8px) 100%,0 100%)}
.cut-b{clip-path:polygon(12px 0,100% 0,100% 7px,100% 100%,9px 100%,0 calc(100% - 10px),0 0)}
.cut-c{clip-path:polygon(0 0,calc(100% - 14px) 0,100% 9px,100% 100%,7px 100%,0 calc(100% - 6px))}
.cut-btn{clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%)}
.cut-tile{clip-path:polygon(0 4px,6px 0,100% 0,100% calc(100% - 6px),calc(100% - 4px) 100%,0 100%)}

/* ---------- home: full-screen shards ---------- */
#home{position:fixed;inset:0;overflow:hidden;background:var(--ink)}
.stage{position:fixed;inset:0;overflow:hidden;background:var(--ink);touch-action:pan-y}
.mroot{position:absolute;inset:0;overflow:hidden}
.mroot>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.mroot .cell{cursor:pointer;transition:filter .2s;-webkit-tap-highlight-color:transparent}
.mroot .cell:active{filter:brightness(1.15)}
.mroot .terr{fill:none;pointer-events:none}
.mlabs{position:absolute;inset:0;pointer-events:none}
.lb{position:absolute;transform:translate(-50%,-50%);text-align:center;white-space:nowrap;will-change:left,top}
.lb i{display:block;margin:0 auto 2px}
.lb .a{font-family:var(--display);font-weight:800;line-height:1.05;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.lb .n{font-size:12px;font-weight:700;opacity:.85;margin-top:2px;max-width:150px;overflow:hidden;text-overflow:ellipsis}
.tag{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:6px;height:26px;padding:0 12px;background:#100C1C;color:#fff;font-size:12px;font-weight:800;white-space:nowrap;
  clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%)}
.tag .up{color:#FF8A8A}.tag .dn{color:#3DDC84}
/* top pills per screen */
.tleft,.tright{display:flex;align-items:center;gap:8px;pointer-events:auto}
.vpill{display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 16px;background:rgba(16,12,28,.86);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);font-weight:800;font-size:13px;color:var(--tx);white-space:nowrap}
.vpill i{font-size:17px}
.vpill.red{background:var(--red);color:#fff}
.vpill.ok{background:var(--green);color:#06301A}
#vpL{max-width:62vw;overflow:hidden;text-overflow:ellipsis}
#vpL:not(.tap){cursor:default}
/* activity: week strip + day mosaic */
#vAct{display:flex;flex-direction:column;padding-top:calc(var(--safe-t) + 62px)}
#actWeek{display:flex;gap:4px;height:86px;padding:0 10px;flex:none}
#actWeek .sl{flex:1;position:relative;background:var(--s1);clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);transition:flex-grow .35s var(--spring),background .3s;overflow:hidden;color:var(--tx2)}
#actWeek .sl.sel{flex-grow:2.6;background:var(--s3);color:var(--tx)}
#actWeek .sl.fut{opacity:.3}
#actWeek .fill{position:absolute;left:0;right:0;bottom:0;top:0;display:flex;flex-direction:column-reverse}
#actWeek .fill div{flex:none;animation:growUp .45s var(--spring) both;transform-origin:bottom}
@keyframes growUp{from{transform:scaleY(0)}}
#actWeek .lb2{position:absolute;left:0;right:0;top:8px;font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;text-align:center;text-shadow:0 1px 3px rgba(0,0,0,.6)}
#actWeek .lb2 b{display:block;font-family:var(--display);font-size:17px;letter-spacing:-.02em}
#actRoot{position:relative;flex:1;margin-top:8px}
/* + flow overlay */
#vAdd{z-index:40}
#addRoot{top:calc(var(--safe-t) + 62px)}
#addPills{position:absolute;left:0;right:0;top:0;padding:calc(var(--safe-t) + 10px) 14px 0;display:flex;align-items:center;gap:8px}
#addPills .grow{flex:1}
#addPills .vpill{padding:0 13px}
body.adding .topbar,body.adding .nav,body.adding .ffab,body.adding .handle,body.adding .newpill{visibility:hidden}
#movePill{top:calc(var(--safe-t) + 62px)}
#home.over::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 0 4px var(--red);animation:overPulse 1.4s ease-in-out infinite}
@keyframes overPulse{0%,100%{opacity:.4}50%{opacity:1}}
#home.over .cell,.mroot .terr.alarm{animation:seamPulse 1.4s ease-in-out infinite}
@keyframes seamPulse{0%,100%{stroke:#5A0A1A}50%{stroke:#FF3355}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}

/* ---------- floating chrome ---------- */
.topbar{position:fixed;left:0;right:0;top:0;padding:calc(var(--safe-t) + 10px) 14px 0;display:flex;align-items:center;justify-content:space-between;gap:10px;z-index:20;pointer-events:none}
.topbar>*{pointer-events:auto}
body.paged .topbar{background:linear-gradient(var(--ink) 72%,rgba(16,12,28,0));padding-bottom:16px}
input::-webkit-calendar-picker-indicator{display:none!important}
#fAcc button{font-size:11px;gap:0}
#fAcc button i{display:none}
.mpill{display:flex;align-items:center;background:rgba(16,12,28,.86);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);height:44px;padding:0 4px}
.mpill button{width:36px;height:44px;display:grid;place-items:center;font-size:18px;color:var(--tx2)}
.mpill button:disabled{opacity:.25}
.mpill b{font-weight:800;font-size:14px;min-width:96px;text-align:center;white-space:nowrap}
.ibtn{width:44px;height:44px;display:grid;place-items:center;background:rgba(16,12,28,.86);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);font-size:20px}
.newpill{position:fixed;left:50%;top:calc(var(--safe-t) + 64px);transform:translateX(-50%);z-index:19;display:flex;align-items:center;gap:8px;height:36px;padding:0 16px;background:var(--lime);color:#14200A;font-weight:800;font-size:13px;animation:dropIn .5s var(--spring) both}
@keyframes dropIn{from{transform:translate(-50%,-30px);opacity:0}to{transform:translate(-50%,0);opacity:1}}

.nav{position:fixed;left:10px;right:10px;bottom:calc(var(--safe-b) + 12px);z-index:20;display:grid;grid-template-columns:1fr 1fr 64px 1fr 1fr;align-items:center;height:64px;background:rgba(16,12,28,.9);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);padding:0 6px}

/* auto-hiding bars on home */
.topbar,.nav{transition:transform .5s var(--spring),opacity .3s}

.newpill.over{background:var(--red);color:#fff}
body.has-over .newpill:not(.over){top:calc(var(--safe-t) + 110px)}
body.has-over.chrome-off .newpill:not(.over){top:calc(var(--safe-t) + 58px)}
body.chrome-off .topbar{transform:translateY(-140%);opacity:0}
body.chrome-off .topbar>*{pointer-events:none}
body.chrome-off .nav,body.nav-off .nav{transform:translateY(160%);opacity:0;pointer-events:none}
body.chrome-off .newpill{top:calc(var(--safe-t) + 12px)}
.ffab{position:fixed;right:16px;bottom:calc(var(--safe-b) + 16px);z-index:21;width:56px;height:56px;display:grid;place-items:center;background:var(--pink);color:#fff;font-size:28px;
  box-shadow:0 0 0 5px var(--ink);transform:scale(0) rotate(-90deg);pointer-events:none;transition:transform .45s var(--spring)}
body.chrome-off .ffab,body.nav-off .ffab{transform:none;pointer-events:auto}
.ffab:active{transform:scale(.88) rotate(45deg)!important}
.handle{position:fixed;left:50%;bottom:calc(var(--safe-b) + 4px);z-index:21;width:96px;height:26px;margin-left:-48px;display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .3s}
.handle::after{content:"";width:44px;height:5px;background:rgba(16,12,28,.85);box-shadow:0 0 0 2px rgba(255,255,255,.55)}
body.chrome-off .handle,body.nav-off .handle{opacity:1;pointer-events:auto}

/* ---------- pages (activity / wrap-up) ---------- */
.page{position:fixed;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--ink);padding:calc(var(--safe-t) + 70px) 16px calc(var(--safe-b) + 110px);z-index:10}
.page .inner{max-width:520px;margin:0 auto}
.page.enter{animation:pageIn .45s var(--ease) both}
@keyframes pageIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.rise{opacity:0;animation:rise .5s var(--ease) forwards;animation-delay:calc(var(--i,0) * 55ms)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
h2.ttl{font-family:var(--display);font-weight:800;font-size:28px;letter-spacing:-.03em;margin-bottom:16px}
.panel{background:var(--s1);padding:16px;margin-bottom:12px}
.ph{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.ph h3{font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:-.02em}
.ph span{font-size:12px;font-weight:700;color:var(--tx3)}

/* search + chips */
.search{display:flex;align-items:center;gap:10px;height:48px;padding:0 14px;background:var(--s1);margin-bottom:12px;color:var(--tx3)}
.search i{font-size:18px}
.search input{flex:1;height:100%;border:0;background:transparent;outline:none;font-weight:600;color:var(--tx)}
.search input::placeholder{color:var(--tx3)}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 12px;padding:0 16px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 16px;display:flex;align-items:center;gap:6px;background:var(--s1);color:var(--tx2);font-weight:700;font-size:13px;transition:background .2s,color .2s,transform .25s var(--spring)}
.chip i{font-size:16px}
.chip[aria-pressed="true"]{background:var(--tx);color:var(--ink);transform:translateY(-2px)}

/* transaction rows */
.dayh{display:flex;justify-content:space-between;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--tx3);padding:14px 2px 6px}
.row{display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;gap:12px;width:100%;min-height:64px;padding:10px 0;text-align:left;border-top:1px solid rgba(255,255,255,.06)}
.row:first-of-type{border-top:0}
.tile{width:44px;height:44px;display:grid;place-items:center;font-size:21px;color:var(--fg,#100C1C)}
.rt{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rs{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:3px;font-size:12px;font-weight:600;color:var(--tx3)}
.tag{height:18px;padding:0 7px;display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase}
.tag i{font-size:11px}
.tag.new{background:var(--lime);color:#14200A}
.tag.plan{background:var(--yellow);color:#2B1A00}
.tag.xfer{background:var(--s3);color:var(--tx2)}
.tag.split{background:var(--cyan);color:#00243A}
.tag.fixed{background:#FFB36B;color:#2E1600}
#fKind button{font-size:11px}
#fKind button i{display:none}
.tag.in{background:var(--green);color:#06301A}
.ra.pos{color:var(--green)}
.tag.ok{background:transparent;color:var(--teal);padding:0}
.ra{text-align:right;font-family:var(--display);font-weight:800;font-size:17px;letter-spacing:-.02em}
.ra small{display:block;font-family:'Plus Jakarta Sans';font-size:11px;font-weight:700;color:var(--tx3);letter-spacing:0}
.ra.dim{color:var(--tx3)}
.empty{padding:32px 16px;text-align:center;color:var(--tx3);font-weight:600}
.empty i{font-size:36px;display:block;margin-bottom:10px;color:var(--s3)}

/* buttons */
.btn{width:100%;height:52px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:800;font-size:15px;background:var(--s2);color:var(--tx);transition:transform .15s,filter .15s}
.btn i{font-size:19px}
.btn:active{transform:scale(.97);filter:brightness(1.15)}
.btn.primary{background:var(--pink);color:#fff}
.btn.danger{background:transparent;color:var(--red);height:44px}
.btn+.btn{margin-top:10px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:12px;color:var(--tx3);font-weight:600;margin-top:8px;line-height:1.5}
.lbl{display:block;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--tx2);margin-bottom:8px}
.field{margin-bottom:16px}
.input{width:100%;height:48px;padding:0 14px;background:var(--s2);border:0;outline:none;font-weight:600;transition:box-shadow .2s}
.input:focus{box-shadow:inset 0 -3px 0 var(--pink)}
.input::placeholder{color:var(--tx3)}
select.input{-webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--tx2) 50%),linear-gradient(135deg,var(--tx2) 50%,transparent 50%);background-position:calc(100% - 20px) 21px,calc(100% - 14px) 21px;background-size:6px 6px;background-repeat:no-repeat;padding-right:36px;text-overflow:ellipsis}
input[type=date].input{-webkit-appearance:none;appearance:none;line-height:48px}

/* segmented */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--s2);padding:4px}
.seg button{height:40px;display:flex;align-items:center;justify-content:center;gap:5px;font-weight:700;font-size:12px;color:var(--tx2);transition:background .25s,color .25s}
.seg button i{font-size:16px}
.seg button[aria-pressed="true"]{background:var(--tx);color:var(--ink)}

/* switch (perfectly centred geometry) */
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:60px;padding:10px 14px;background:var(--s2);text-align:left;margin-bottom:8px}
.toggle b{display:block;font-weight:700;font-size:14px}
.toggle small{display:block;font-size:12px;font-weight:600;color:var(--tx3);margin-top:1px}
.sw{position:relative;flex:none;width:52px;height:30px;background:var(--s3);transition:background .25s}
.sw::after{content:"";position:absolute;top:4px;left:4px;width:22px;height:22px;background:var(--tx2);transition:transform .3s var(--spring),background .25s;clip-path:polygon(0 4px,4px 0,100% 0,100% calc(100% - 4px),calc(100% - 4px) 100%,0 100%)}
.sw.on{background:var(--green)}
.sw.on::after{transform:translateX(22px);background:#fff}
.collapse{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s var(--ease)}
.collapse.open{grid-template-rows:1fr}
.collapse>div{overflow:hidden}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(5,3,10,.6);opacity:0;pointer-events:none;transition:opacity .3s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;max-height:92vh;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--s1);z-index:50;
  padding:30px 16px calc(var(--safe-b) + 20px);transform:translateY(105%);visibility:hidden;transition:transform .45s var(--spring),visibility 0s .45s;
  clip-path:polygon(0 16px,14% 4px,31% 13px,52% 0,70% 11px,87% 2px,100% 14px,100% 100%,0 100%)}
.sheet.on{transform:none;visibility:visible;transition:transform .45s var(--spring)}
.grab{position:absolute;top:22px;left:50%;width:40px;height:4px;margin-left:-20px;background:var(--s3)}
.sheet h2{font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:-.03em;margin:10px 0 16px}
.sband{margin:-14px -16px 16px;padding:28px 16px 18px;color:var(--fg)}
.sband .big{font-family:var(--display);font-weight:800;font-size:40px;letter-spacing:-.03em;line-height:1}
.sband .sub{font-weight:700;font-size:13px;opacity:.85;margin-top:6px;display:flex;align-items:center;gap:6px}

/* amount input */
.amount{display:flex;align-items:center;justify-content:center;gap:4px;height:92px;background:var(--yellow);color:#2B1A00;margin-bottom:16px}
.amount span{font-family:var(--display);font-size:32px;font-weight:800}
.amount input{width:100%;max-width:230px;border:0;outline:none;background:transparent;text-align:center;font-family:var(--display);font-size:48px;font-weight:800;color:#2B1A00;letter-spacing:-.03em}
.amount input::placeholder{color:rgba(43,26,0,.35)}

/* category grid */
.cgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.copt{height:68px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;background:var(--s2);font-size:11px;font-weight:700;color:var(--tx2);transition:background .25s,color .25s,transform .25s var(--spring)}
.copt i{font-size:22px}
.copt[aria-pressed="true"]{background:var(--c);color:var(--fg);transform:scale(1.04)}

/* stats */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.stat{background:var(--s2);padding:12px 14px}
.stat span{display:block;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--tx3)}
.stat b{display:block;font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.02em;margin-top:4px}

/* wrap-up graphics */
.sbar{position:relative;display:flex;height:44px;background:var(--s2);margin:14px 0 26px;gap:3px;padding:0}
.sbar .seg2{height:100%;transform-origin:left;transform:scaleX(0);transition:transform .9s var(--ease)}
.sbar .pace{position:absolute;top:-6px;bottom:-6px;width:3px;background:var(--tx)}
.sbar .pace span{position:absolute;top:calc(100% + 4px);left:50%;transform:translateX(-50%);font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--tx2);white-space:nowrap}
.bigline{display:flex;align-items:baseline;gap:8px}
.bigline b{font-family:var(--display);font-weight:800;font-size:44px;letter-spacing:-.04em;line-height:1}
.bigline span{font-weight:700;color:var(--tx3)}
.flow{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:12px;padding:10px 0}
.flow+.flow{border-top:1px solid rgba(255,255,255,.06)}
.flow .t1{font-weight:700;font-size:14px}
.flow .t2{font-size:12px;font-weight:600;color:var(--tx3)}
.hist{display:flex;align-items:flex-end;gap:8px;height:140px;padding-top:20px}
.hcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px}
.hcol .bar{width:100%;transform-origin:bottom;transform:scaleY(0);transition:transform .9s var(--spring);clip-path:polygon(0 6px,100% 0,100% 100%,0 100%)}
.hcol .v{font-size:11px;font-weight:800;color:var(--tx2)}
.hcol .m{font-size:11px;font-weight:800;color:var(--tx3);text-transform:uppercase;letter-spacing:.05em}
.accbar{display:grid;grid-template-columns:96px 1fr 70px;align-items:center;gap:10px;padding:6px 0;font-size:13px;font-weight:700}
.accbar .tr{height:12px;background:var(--s2)}
.accbar .fl{height:100%;width:0;transition:width .9s var(--ease)}
.accbar .am{text-align:right;font-family:var(--display);font-weight:800}

/* accounts */
.flowsvg{width:100%;height:auto;display:block;overflow:visible}
.flowsvg .fl1{fill:var(--tx);font-size:12px;font-weight:800}
.flowsvg .fl2{fill:var(--tx2);font-size:11px;font-weight:700}
.flowsvg .rib{animation:ribIn .7s var(--ease) both;animation-delay:var(--d)}
.flowsvg .nod{transform-box:fill-box;transform-origin:center;animation:nodIn .5s var(--spring) both;animation-delay:var(--d)}
@keyframes ribIn{from{opacity:0}}
@keyframes nodIn{from{transform:scaleY(0)}}
.agrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.atile{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:0;padding:0 14px 12px;background:var(--s1);text-align:left;transition:transform .15s}
.atile:active{transform:scale(.97)}
.atile .aband{display:flex;align-items:center;gap:6px;width:calc(100% + 28px);margin:0 -14px 10px;padding:9px 14px;background:var(--ac);color:#100C1C;font-size:12px;font-weight:800;white-space:nowrap;overflow:hidden}
.atile .aband i{font-size:16px}
.atile b{font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:-.03em}
.atile small{font-size:11px;font-weight:700;color:var(--tx3)}
.atile .aio{display:flex;gap:10px;margin-top:6px;font-size:12px;font-weight:800;color:var(--tx2)}
.atile .aio .pos{color:var(--green)}
.card-bill .bigline b{font-size:36px}

/* result tiles (statement) */
.result{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:4px 0 14px}
.result div{padding:14px 8px;text-align:center}
.result b{display:block;font-family:var(--display);font-weight:800;font-size:28px}
.result span{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase}

/* toast + burst */
.toast{position:fixed;left:50%;top:calc(var(--safe-t) + 12px);z-index:70;transform:translate(-50%,-150%);display:flex;align-items:center;gap:8px;height:44px;padding:0 18px;background:var(--tx);color:var(--ink);font-weight:800;font-size:14px;white-space:nowrap;transition:transform .45s var(--spring)}
.toast i{font-size:18px}
.toast.on{transform:translate(-50%,0)}
#burst{position:fixed;inset:0;pointer-events:none;z-index:65}

/* launch */
#launch{position:fixed;inset:0;z-index:30;display:grid;place-items:center;pointer-events:none}
#launch .word{position:absolute;top:calc(50% + 62px);left:0;right:0;text-align:center;font-family:var(--display);font-weight:800;font-size:36px;letter-spacing:-.04em;color:#fff;animation:wordIn .5s var(--ease) .35s both;transition:opacity .12s,transform .3s var(--ease)}
@keyframes wordIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
body:not(.intro) #launch .word{opacity:0!important;animation:none;transform:translateY(20px)}
body.intro #launch{pointer-events:auto;cursor:pointer}
/* Home itself is the logo: a small square window onto your shards that opens to full screen */
#home{transition:clip-path .7s var(--ease)}
body.intro #home{clip-path:inset(calc(50% - 105px) calc(50% - 75px) calc(50% - 45px) round 18px)}
body.intro #home .mlabs{opacity:0}
#home .mlabs{transition:opacity .4s .35s}
body.intro .topbar{transform:translateY(-140%);opacity:0}
body.intro .nav{transform:translateY(160%);opacity:0}
body.intro .newpill{visibility:hidden}
body.intro #home.over::after{opacity:0;animation:none}


@media (prefers-reduced-motion: reduce){#home.over .cell,.mroot .terr.alarm{animation:none!important;stroke:#7A0F22}*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0ms!important;transition-duration:.01ms!important}.rise{opacity:1}}
</style>

/* ---------- reference data ---------- */
const CATS = {

  bills:{n:'Bills',i:'ti-bulb',c:'#B8F03C',fg:'#14200A'},

  const st=monthStats(ym);
  const cats=Object.entries(st.byCat).filter(([,v])=>v>0.004).sort((a,b)=>b[1]-a[1]);
  let list=cats; HOME_MORE=[];
  if(cats.length>MAX_CATS){ list=cats.slice(0,MAX_CATS-1); HOME_MORE=cats.slice(MAX_CATS-1); }
  const catSum=cats.reduce((a,[,v])=>a+v,0), left=Math.max(st.left,0);
  const leftF=catSum? Math.min(left/(left+catSum),LEFT_CAP) : 1;
  const sh={}; list.forEach(([k,v])=>sh[k]=(1-leftF)*v/(catSum||1));
  if(HOME_MORE.length) sh.more=(1-leftF)*HOME_MORE.reduce((a,[,v])=>a+v,0)/(catSum||1);
  // no shard over half the screen

    if(ex>0&&rest>0) Object.keys(sh).forEach(k=>{ if(sh[k]<.5) sh[k]+=ex*sh[k]/rest; }); }
  const items=list.map(([k,v])=>{ const C=cat(k); return {k,v:sh[k],raw:v,fill:C.c,fg:C.fg,label:shardLabel(C.i,val=>m0(val),C.n),onTap:()=>openCatSheet(k)}; });

  if(left>0) items.push({k:'left',v:leftF,raw:left,fill:SHARD_LEFT.c,fg:SHARD_LEFT.fg,label:shardLabel(SHARD_LEFT.i,val=>m0(val),`left of ${m0(S.allowance)}`,{big:1}),onTap:openLeftSheet});

const addDays=(d,n)=>{ const x=new Date(d+'T00:00'); x.setDate(x.getDate()+n); return iso(x); };
const weekStart=d=>{ const x=new Date(d+'T00:00'); x.setDate(x.getDate()-((x.getDay()+6)%7)); return iso(x); };
const dayOuts=d=>S.txs.filter(t=>t.date===d&&!isIn(t)&&t.kind==='everyday');
const act=new Mosaic($('#actRoot'),{band:actBand});
function dayGroups(d){
  const g={}; dayOuts(d).forEach(t=>{ const k='g:'+(mKey(t.merchant)||t.merchant); const e=g[k]||(g[k]={k,name:t.merchant,cat:t.category,amt:0,txs:[]}); e.amt+=counted(t); e.txs.push(t); });
  return Object.values(g).filter(e=>e.amt>0.004).sort((a,b)=>b.amt-a.amt);
}
function renderActivity(){
  // week strip
  const ws=weekStart(actDay), days=[...Array(7)].map((_,i)=>addDays(ws,i));
  const tots=days.map(d=>dayOuts(d).reduce((a,t)=>a+counted(t),0)), max=Math.max(...tots,1);
  const DN=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  $('#actWeek').innerHTML=days.map((d,i)=>{ const fut=d>TODAY, byc={}; dayOuts(d).forEach(t=>byc[t.category]=(byc[t.category]||0)+counted(t));
    const fill=Object.entries(byc).sort((a,b)=>b[1]-a[1]).map(([k,v],j)=>`<div style="height:${(v/max*82).toFixed(1)}%;background:${cat(k).c};animation-delay:${i*40+j*30}ms"></div>`).join('');
    return `<button class="sl${d===actDay?' sel':''}${fut?' fut':''}" data-d="${d}" ${fut?'disabled':''}><div class="fill">${fill}</div><div class="lb2">${DN[i]}<b>${+d.slice(8)}</b></div></button>`; }).join('');
  $$('#actWeek .sl').forEach(b=>b.onclick=()=>{ if(b.dataset.d===actDay) return; actDay=b.dataset.d; renderActivity(); });
  // day mosaic
  const groups=dayGroups(actDay); let items;
  if(!groups.length) items=[{k:'none',v:1,raw:0,fill:'#241D42',fg:'#FFFFFF',noCount:1,label:shardLabel('ti-mood-smile','','Nothing spent'),onTap:()=>{}}];
  else {
    let shown=groups, rest=[];
    if(groups.length>8){ shown=groups.slice(0,7); rest=groups.slice(7); }
    items=shown.map(e=>{ const C=cat(e.cat), n=e.txs.length;
      return {k:e.k,v:e.amt,raw:e.amt,fill:C.c,fg:C.fg,label:shardLabel(C.i,val=>money(val),esc(e.name)+(n>1?` ×${n}`:'')),
        onTap:()=>n===1?openEditor(e.txs[0]):openGroupSheet(e.name,e.txs)}; });
    if(rest.length){ const tot=rest.reduce((a,e)=>a+e.amt,0); items.push({k:'more',v:tot,raw:tot,fill:SHARD_MORE.c,fg:SHARD_MORE.fg,
      label:shardLabel('ti-dots',val=>money(val),`+${rest.length} more`),onTap:()=>openGroupSheet(`${rest.length} more`,rest.flatMap(e=>e.txs))}); }
  }
  act.set({items,floor:.07});
  const tot=groups.reduce((a,e)=>a+e.amt,0);
  setPills(`<i class="ti ti-calendar"></i>${new Date(actDay+'T00:00').toLocaleDateString('en-SG',{weekday:'short',day:'numeric',month:'short'})} · ${money(tot)}`,
    (actDay!==TODAY?`<button class="vpill cut-btn" id="toToday"><i class="ti ti-arrow-back-up"></i>Today</button>`:'')+`<button class="vpill cut-btn" id="openSearch" aria-label="Search"><i class="ti ti-search"></i></button>`);
  const tt=$('#toToday'); if(tt) tt.onclick=()=>{ actDay=TODAY; renderActivity(); };
  $('#openSearch').onclick=()=>openSearch();
}
function openGroupSheet(name,txs){
  const C=cat(txs[0].category), total=txs.reduce((a,t)=>a+counted(t),0);
  openSheet(`<div class="sband" style="background:${C.c};--fg:${C.fg}">
      <div class="sub" style="margin:0 0 8px"><i class="ti ${C.i}" style="font-size:20px"></i>${esc(name)}</div>
      <div class="big num">${money(total)}</div><div class="sub">${txs.length} payments</div></div>
    ${groupedList(txs)}`);
  bindRows('#sheetBody');
}
function openSearch(mode){
  openSheet(`<h2>${mode==='new'?'New to check':'Search'}</h2>
    ${mode==='new'?'':`<div class="search cut-a"><i class="ti ti-search"></i><input id="q" placeholder="Merchant or note" autocomplete="off"></div>`}
    ${mode==='new'?`<button class="btn cut-a" id="allGood" style="margin-bottom:12px"><i class="ti ti-checks"></i>All correct, clear the new tags</button>`:''}
    <div id="qres"></div>`);
  const draw=q=>{ let list=mode==='new'?S.txs.filter(t=>t.inbox):S.txs.filter(t=>!q||(t.merchant+' '+(t.note||'')).toLowerCase().includes(q.toLowerCase()));
    list=list.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,80);
    $('#qres').innerHTML=list.length?groupedList(list):`<div class="empty"><i class="ti ti-mood-empty"></i>Nothing matches</div>`; bindRows('#qres'); };
  draw(''); const q=$('#q'); if(q){ q.oninput=e=>draw(e.target.value); setTimeout(()=>q.focus(),350); }
  const ag=$('#allGood'); if(ag) ag.onclick=()=>{ S.txs.forEach(t=>t.inbox=false); save(); closeSheet(); toast('ti-checks','All caught up'); render(); };
}
// swipes: the mosaic steps a day, the strip steps a week
function swipe(el,fn){ let x0=null,y0=null; el.addEventListener('touchstart',e=>{ x0=e.touches[0].clientX; y0=e.touches[0].clientY; },{passive:true});
  el.addEventListener('touchend',e=>{ if(x0==null) return; const dx=e.changedTouches[0].clientX-x0, dy=e.changedTouches[0].clientY-y0; x0=null; if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.3) fn(dx<0?1:-1); },{passive:true}); }
swipe($('#actRoot'),dir=>{ const n=addDays(actDay,dir); if(n>TODAY) return; actDay=n; renderActivity(); });
swipe($('#actWeek'),dir=>{ let n=addDays(actDay,dir*7); if(n>TODAY) n=TODAY; if(n===actDay) return; actDay=n; renderActivity(); });

/* ---------- Month: the whole month, cracked by bucket then category ---------- */
let mz=null;
const month=new Mosaic($('#monthRoot'),{band:pageBand});
const BUCKETS={everyday:'Day-to-day',fixed:'Fixed',oneoff:'One-off'};
function bucketCats(st,kind){ const o={}; if(kind==='everyday') return {...st.byCat}; (kind==='fixed'?st.fixed:st.oneoff).forEach(t=>o[t.category]=(o[t.category]||0)+counted(t)); Object.keys(o).forEach(k=>{ if(o[k]<=.004) delete o[k]; }); return o; }
function renderMonth(){
  const st=monthStats(ym), pk=shiftMonth(ym,-1), pst=monthStats(pk), hasPrev=pst.txs.length>0;
  const sums={}, items=[];
  Object.keys(BUCKETS).forEach(kind=>{ const bc=bucketCats(st,kind), sum=Object.values(bc).reduce((a,v)=>a+v,0); sums[kind]=sum; if(sum<=0.004) return;
    const prev=hasPrev?Object.values(bucketCats(pst,kind)).reduce((a,v)=>a+v,0):null, diff=prev==null?null:sum-prev;
    const tag=`${BUCKETS[kind]} ${m0(sum)}${diff==null||Math.abs(diff)<1?'':`<span class="${diff>0?'up':'dn'}">${diff>0?'▲':'▼'}${m0(Math.abs(diff))}</span>`}`;
    items.push({k:kind,v:sum,tag,alarm:kind==='everyday'&&sum>S.allowance,onTap:()=>{ mz=kind; renderMonth(); },
      kids:Object.entries(bc).map(([k,v])=>{ const C=cat(k); return {k,v,raw:v,fill:C.c,fg:C.fg,label:shardLabel(C.i,val=>m0(val),C.n),onTap:mz===kind?()=>openCatSheet(k,kind):()=>{ mz=kind; renderMonth(); }}; })}); });
  if(!items.length) items.push({k:'none',v:1,raw:0,fill:'#241D42',fg:'#fff',noCount:1,label:shardLabel('ti-calendar-off','','Nothing logged this month'),onTap:()=>{}});
  if(mz&&!sums[mz]) mz=null;
  const one=sums.oneoff>0, fix=sums.fixed>0;
  const anchors={everyday:[.52,.36],fixed:one?[.18,.84]:[.42,.86],oneoff:fix?[.86,.78]:[.6,.86]};
  month.set({items,anchors,floor:.14,kidFloor:.1,zoom:mz});
  const day=st.everySum, over=day>S.allowance, total=sums.everyday+sums.fixed+sums.oneoff;
  const surplus=Math.max(S.allowance-day,0), canMove=surplus>0&&!surplusMoves(ym)&&(ym<THIS_M||st.daysLeft<=3);
  if(mz) setPills(`<i class="ti ti-arrow-left"></i>${BUCKETS[mz]} · ${m0(sums[mz])}`, mz==='everyday'?verdict(day,over):'', ()=>{ mz=null; renderMonth(); });
  else setPills(null, verdict(day,over));
  const mp=$('#movePill'); mp.classList.toggle('hidden',!canMove||!!mz); mp.innerHTML=`<i class="ti ti-moneybag"></i>Move ${m0(surplus)} to Surplus`;
  $('#mLabel').textContent=`${monthName(ym,{month:'short'})} · ${m0(total)}`;
  mp.onclick=()=>openEditor(null,{merchant:'To POSB Surplus',amount:surplus,category:'other',kind:'transfer',account:'salary',toAcc:'surplus'});
}
const verdict=(day,over)=>`<span class="vpill cut-btn ${over?'red':'ok'}"><i class="ti ti-${over?'alert-triangle':'check'}"></i>${m0(day)} / ${m0(S.allowance)}</span>`;
swipe($('#monthRoot'),dir=>{ if(mz) return; const n=shiftMonth(ym,dir); if(n>THIS_M) return; ym=n; renderMonth(); });

/* ---------- Accounts: balances as territories, debt striped ---------- */
let az=null;
const accts=new Mosaic($('#accRoot'),{band:pageBand});
function txDelta(t){ return isIn(t)?t.amount:-t.amount; }
// balance of an account right now: last known balance + everything logged after that date
function accBalance(a){
  const b=(S.balances||{})[a]; if(!b) return null;
  let v=b.amount;
  S.txs.forEach(t=>{ if(t.date<=b.date) return;
    if(t.account===a) v+=txDelta(t);
    else if(t.kind==='transfer'&&!isIn(t)&&t.toAcc===a&&!S.txs.some(x=>x.account===a&&isIn(x)&&x.kind==='transfer'&&Math.abs(x.amount-t.amount)<0.005&&Math.abs(daysBetween(x.date,t.date))<=3)) v+=t.amount;
    else if(t.kind==='transfer'&&isIn(t)&&t.fromAcc===a&&!S.txs.some(x=>x.account===a&&!isIn(x)&&x.kind==='transfer'&&Math.abs(x.amount-t.amount)<0.005&&Math.abs(daysBetween(x.date,t.date))<=3)) v-=t.amount;
  });
  return v;
}
function cardOwed(){
  const c=S.cardBill; if(!c) return null;
  let v=c.amount, since=0;
  S.txs.forEach(t=>{ if(t.date<=c.stmt) return;
    if(t.account==='card'){ if(isIn(t)) v-=t.amount; else { v+=t.amount; if(t.kind!=='transfer') since+=t.amount; } }
    else if(t.kind==='transfer'&&!isIn(t)&&t.toAcc==='card') v-=t.amount; });
  return {owed:v, since, paid:S.txs.some(t=>t.kind==='transfer'&&t.toAcc==='card'&&t.date>c.stmt)};
}
const surplusMoves = k => monthTxs(k).filter(t=>t.kind==='transfer'&&!isIn(t)&&t.toAcc==='surplus').reduce((a,t)=>a+t.amount,0);
const ACC_FILL={salary:['#FF5A36','#2A0800'],savings:['#3DDC84','#06301A'],surplus:['#FFC21F','#2B1A00'],cash:['#B8F03C','#14200A']};
function accZoomKids(a,bal,co){
  const txs=monthTxs(ym), gross=t=>(t.split&&t.split.share!=null)?t.split.share:t.amount, K=[];
  const add=(k,v,fill,fg,icon,name)=>{ if(v>0.004) K.push({k,v,raw:v,fill,fg,label:shardLabel(icon,val=>m0(val),name),onTap:()=>openAccSheet(a)}); };
  if(a==='salary'){ const o=txs.filter(t=>t.account==='salary'&&!isIn(t));
    add('js',o.filter(t=>t.kind==='transfer'&&t.toAcc==='savings').reduce((s,t)=>s+t.amount,0),'#3DDC84','#06301A','ti-pig-money','To JumpStart');
    add('sur',o.filter(t=>t.kind==='transfer'&&t.toAcc==='surplus').reduce((s,t)=>s+t.amount,0),'#FFC21F','#2B1A00','ti-moneybag','To Surplus');
    add('day',o.filter(t=>t.kind==='everyday').reduce((s,t)=>s+gross(t),0),'#FF3D7F','#FFFFFF','ti-sun','Day-to-day');
    add('fix',o.filter(t=>t.kind==='fixed').reduce((s,t)=>s+gross(t),0),'#FFB36B','#2E1600','ti-repeat','Fixed');
    add('one',o.filter(t=>t.kind==='oneoff').reduce((s,t)=>s+gross(t),0),'#7DD3FC','#062A3D','ti-bolt','One-off'); }
  if(a==='savings'&&bal!=null){ const owed=co&&!co.paid?Math.max(co.owed,0):0;
    add('free',Math.max(bal-owed,0),'#3DDC84','#06301A','ti-lock-open','Free to use');
    add('forcard',Math.min(owed,Math.max(bal,0)),'#FF8A8A','#3A0610','ti-credit-card-pay','For card bill'); }
  if(a==='card'){ const o=txs.filter(t=>t.account==='card'&&!isIn(t)&&t.kind!=='transfer');
    add('day',o.filter(t=>t.kind==='everyday').reduce((s,t)=>s+t.amount,0),'#FF3D7F','#FFFFFF','ti-sun','Day-to-day');
    add('fix',o.filter(t=>t.kind==='fixed').reduce((s,t)=>s+t.amount,0),'#FFB36B','#2E1600','ti-repeat','Fixed');
    add('one',o.filter(t=>t.kind==='oneoff').reduce((s,t)=>s+t.amount,0),'#FF8AC8','#3A0624','ti-bolt','One-off'); }
  if(a==='surplus'){ for(let i=5;i>=0;i--){ const k=shiftMonth(ym,-i); add('m'+k,surplusMoves(k),i?'#FFE08A':'#FFC21F','#2B1A00','ti-moneybag',monthName(k,{month:'short'})); } }
  if(a==='cash'){ add('wd',txs.filter(t=>t.category==='cash'&&!isIn(t)).reduce((s,t)=>s+t.amount,0),'#7CF2C9','#05302A','ti-cash','Withdrawn');
    add('sp',txs.filter(t=>t.account==='cash'&&!isIn(t)).reduce((s,t)=>s+gross(t),0),'#B8F03C','#14200A','ti-shopping-bag','Spent from cash'); }
  if(!K.length) K.push({k:'set',v:1,raw:0,noCount:1,fill:'#352C5C',fg:'#FFFFFF',label:shardLabel(bal==null?'ti-pencil':'ti-mood-empty','',bal==null?'Tap to set balance':'Nothing this month'),onTap:()=>openAccSheet(a)});
  return K;
}
function renderAccounts(){
  const co=cardOwed(), bal={}; ['salary','savings','surplus','cash'].forEach(a=>bal[a]=accBalance(a));
  const items=[];
  ['savings','salary','card','surplus','cash'].forEach(a=>{
    if(a==='card'&&!co) return;
    const A=ACCOUNTS[a], v=a==='card'?Math.max(co.owed,0):bal[a];
    const kids= az===a ? accZoomKids(a,v,co) : [ a==='card'
      ? {k:'bal',v:1,raw:v,fill:'url(#debt)',fg:'#FFD6DB',label:shardLabel('ti-credit-card',val=>'−'+m0(val),co.paid?'Paid':`Owed · due ${new Date(S.cardBill.due+'T00:00').toLocaleDateString('en-SG',{day:'numeric',month:'short'})}`),onTap:()=>{ az=a; renderAccounts(); }}
      : {k:'bal',v:1,raw:v==null?0:v,noCount:v==null,fill:ACC_FILL[a][0],fg:ACC_FILL[a][1],label:shardLabel(A.i,v==null?'':val=>m0(val),v==null?'Set balance':'est. today'),onTap:()=>{ az=a; renderAccounts(); }} ];
    items.push({k:a,v:Math.max(v||0,1),tag:A.n,kids,onTap:()=>{ az=a; renderAccounts(); }});
  });
  accts.set({items,anchors:{savings:[.4,.42],salary:[.84,.2],card:[.78,.78],surplus:[.16,.88],cash:[.1,.62]},floor:.09,kidFloor:.1,zoom:az});
  const st=monthStats(ym), spent=st.everySum+st.fixedSum+st.oneoffSum, rate=st.salaryIn?(st.salaryIn-spent)/st.salaryIn:null;
  const known=['salary','savings','surplus','cash'].reduce((s,a)=>s+(bal[a]||0),0), net=known-(co?Math.max(co.owed,0):0);
  if(az){
    const act= az==='card' ? (co&&!co.paid&&co.owed>0.004?`<button class="vpill cut-btn" id="payCard"><i class="ti ti-credit-card-pay"></i>Mark paid</button>`:'')
                         : `<button class="vpill cut-btn" id="setBal"><i class="ti ti-pencil"></i>Balance</button>`;
    setPills(`<i class="ti ti-arrow-left"></i>${ACCOUNTS[az].n}`, act, ()=>{ az=null; renderAccounts(); });
    const pc=$('#payCard'); if(pc) pc.onclick=()=>{ S.txs.push({id:uid(),date:TODAY,merchant:'Pay SC Card',amount:Math.round(co.owed*100)/100,category:'other',kind:'transfer',account:'savings',toAcc:'card',
      source:'manual',card:'',verified:false,inbox:false,split:null,note:'',created:Date.now()}); save(); toast('ti-check','Card payment logged'); renderAccounts(); };
    const sb=$('#setBal'); if(sb) sb.onclick=()=>openAccSheet(az);
  } else setPills(`<i class="ti ti-scale"></i>Net ${m0(net)}`, rate==null?'':`<span class="vpill cut-btn ${rate>=0?'ok':'red'}"><i class="ti ti-trending-up"></i>Kept ${Math.round(rate*100)}%</span>`, ()=>{});
}
function openAccSheet(a){
  const A=ACCOUNTS[a], bal=a==='card'?(cardOwed()||{}).owed:accBalance(a), b=(S.balances||{})[a];
  const list=monthTxs(ym).filter(t=>t.account===a||(t.kind==='transfer'&&t.toAcc===a));
  openSheet(`
    <div class="sband" style="background:${A.c};--fg:#100C1C">
      <div class="sub" style="margin:0 0 8px"><i class="ti ${A.i}" style="font-size:20px"></i>${A.n}</div>
      <div class="big num">${bal==null?'—':(a==='card'?'−':'')+money(bal)}</div>
      <div class="sub">${a==='card'?'Statement plus charges since, minus payments':b?`From ${money(b.amount)} on ${dayLabel(b.date)} (${esc(b.src||'you')}) plus what's logged since`:'No balance yet'}</div>
    </div>
    ${a==='card'?'':`<div class="field"><label class="lbl" for="balIn">Balance in your bank app now</label>
      <div class="row2"><input class="input cut-btn" id="balIn" inputmode="decimal" placeholder="0.00"><button class="btn cut-a" id="balSave" style="height:48px"><i class="ti ti-check"></i>Set</button></div>
      <p class="hint">Check your bank app and type what it shows. Slice carries on from there.</p></div>`}
    <span class="lbl" style="margin-top:8px">${monthName(ym)}</span>
    ${list.length?groupedList(list):`<div class="empty" style="padding:14px">Nothing logged for this account this month</div>`}`);
  bindRows('#sheetBody');
  const bs=$('#balSave'); if(bs) bs.onclick=()=>{ const v=parseFloat(String($('#balIn').value).replace(/[^0-9.-]/g,'')); if(isNaN(v)) return shake($('#balIn'));
    S.balances=S.balances||{}; S.balances[a]={amount:Math.round(v*100)/100,date:TODAY,src:'you'}; save(); closeSheet(); toast('ti-check',`${A.short} balance set`); render(); };
}

/* ---------- top bar pills per screen ---------- */
let pillBack=null;
function setPills(leftHTML,rightHTML,onLeft){
  const L=$('#vpL'); L.classList.toggle('hidden',!leftHTML); $('#mpill').classList.toggle('hidden',!!leftHTML);
  if(leftHTML) L.innerHTML=leftHTML; pillBack=onLeft||null; L.classList.toggle('tap',!!onLeft);
  $('#vpR').innerHTML=rightHTML||'';
}
$('#vpL').onclick=()=>{ if(pillBack) pillBack(); };

/* ---------- navigation ---------- */
function renderMonthPill(){
  $('#mLabel').textContent = ym===THIS_M ? monthName(ym) : monthName(ym,{month:'short',year:'numeric'});
  $('#mNext').disabled = ym>=THIS_M;
  const n=S.txs.filter(t=>t.inbox).length, p=$('#newPill');
  p.classList.toggle('hidden', !n || view!=='home');
  p.innerHTML=`<i class="ti ti-bolt"></i>${n} new to check`;
}
const STAGES={home:['#home',home],activity:['#vAct',act],wrap:['#vMonth',month],accounts:['#vAcc',accts]};
function render(launch){
  renderMonthPill();
  Object.entries(STAGES).forEach(([k,[sel,m]])=>{ $(sel).classList.toggle('hidden',k!==view); if(k===view) m.start(); else m.stop(); });
  if(view==='home'){ setPills(null,''); renderHome(launch); }
  if(view==='activity') renderActivity();
  if(view==='wrap') renderMonth();
  if(view==='accounts') renderAccounts();
  if(view!=='wrap') $('#movePill').classList.add('hidden');
  if(view!=='home'){ $('#overPill').classList.add('hidden'); document.body.classList.remove('has-over'); }
}
function go(v){
  if(v!==view){ mz=null; az=null; }
  view=v;
  $$('.nbtn[data-view]').forEach(b=>b.setAttribute('aria-current',b.dataset.view===v?'page':'false'));
  chromeShow(3000);
  render(false);
}

/* ---------- transaction rows (sheets and search) ---------- */

    return `<button class="row" data-id="${t.id}">${tileHTML(t.category)}
      <span style="min-width:0"><div class="rt">${esc(t.merchant)}</div><div class="rs"><span>${(ACCOUNTS[t.account]||ACCOUNTS.card).short}</span>${tags}</div></span>
      <span class="ra num pos">+${money(t.amount)}</span></button>`; }
  const split=t.split&&t.split.share!=null, back=PB[t.id]||0;

/* =================================================================
   + FLOW — amount, where, what, logged. Every answer is a shard,
   sized by how likely you are to pick it.
   ================================================================= */
const adder=new Mosaic($('#addRoot'),{band:H=>[0,H]});
let addAmt='0', addPhase='keys', addAcc='card', addAccTouched=false, addDay='Today', addMerchant=null, addTimer=null, lastAdded=null;
const ACC_ORDER=['card','salary','savings','surplus','cash'];
function recentMerchants(){
  const since=addDays(TODAY,-60), m={};
  S.txs.forEach(t=>{ if(isIn(t)||t.kind==='transfer'||t.date<since) return; const k=mKey(t.merchant); if(!k) return;
    const e=m[k]||(m[k]={name:t.merchant,cat:t.category,acc:t.account,n:0,last:''}); e.n++;
    if(t.date>=e.last){ e.last=t.date; e.cat=t.category; e.acc=t.account; e.name=t.merchant; } });
  return Object.values(m).sort((a,b)=>b.n-a.n||b.last.localeCompare(a.last)).slice(0,6);
}
function catUsage(){ const since=addDays(TODAY,-90), u={}; Object.keys(CATS).forEach(k=>u[k]=1);
  S.txs.forEach(t=>{ if(!isIn(t)&&t.kind!=='transfer'&&t.date>=since&&u[t.category]!=null) u[t.category]++; }); return u; }
function addPills(){
  const A=ACCOUNTS[addAcc];
  $('#addPills').innerHTML=`<button class="vpill cut-btn" id="aClose" aria-label="Close"><i class="ti ti-x"></i></button>
    <span class="grow"></span>
    <button class="vpill cut-btn" id="aDay"><i class="ti ti-calendar"></i>${addDay}</button>
    <button class="vpill cut-btn" id="aAcc"><i class="ti ${A.i}"></i>${A.short}</button>
    <button class="vpill cut-btn" id="aMore"><i class="ti ti-dots"></i>More</button>`;
  $('#aClose').onclick=closeAdd;
  $('#aDay').onclick=()=>{ addDay=addDay==='Today'?'Yesterday':'Today'; addPills(); };
  $('#aAcc').onclick=()=>{ addAcc=ACC_ORDER[(ACC_ORDER.indexOf(addAcc)+1)%ACC_ORDER.length]; addAccTouched=true; addPills(); };
  $('#aMore').onclick=()=>{ const amt=parseFloat(addAmt)>0?parseFloat(addAmt):''; const date=addDay==='Yesterday'?addDays(TODAY,-1):TODAY; closeAdd(); openEditor(null,{amount:amt,account:addAcc,date}); };
}
function addPhaseSet(p){
  addPhase=p; const [W,H]=adder.size(), items=[];
  if(p==='keys'){
    const top=H*.30, rh=(H-top)/5, jit=(k,a)=>{ let x=0; for(const c of k) x=(x*31+c.charCodeAt(0))%997; return ((x%100)/100-.5)*a; };
    items.push({k:'amt',v:.27,fixed:[W/2,H*.13],still:1,noCount:1,fill:'#FFC21F',fg:'#2B1A00',stroke:5,label:r=>`<div class="a" style="font-size:${Math.round(clamp(r*.55,18,64))}px">$${addAmt}</div>`});
    ['1','2','3','4','5','6','7','8','9','.','0','del'].forEach((k,i)=>{ const rr=Math.floor(i/3), c=i%3;
      items.push({k:'k'+k,v:.055,fixed:[W*(c+.5)/3+jit(k,30),top+rh*(rr+.5)+jit(k+'y',22)],fast:1,bump:1,noCount:1,stroke:5,fill:['#1C1733','#211B3B','#272044'][(rr+c)%3],fg:'#FFFFFF',
        label:r=>k==='del'?`<i class="ti ti-backspace" style="font-size:${Math.round(Math.min(28,r*.5))}px"></i>`:`<div class="a" style="font-size:${Math.round(clamp(r*.6,18,34))}px">${k}</div>`,
        onTap:()=>addKey(k)}); });
    items.push({k:'next',v:.07,fixed:[W/2,top+rh*4.5],fast:1,bump:1,noCount:1,stroke:5,fill:'#FF3D7F',fg:'#FFFFFF',
      label:r=>`<i class="ti ti-arrow-right" style="font-size:${Math.round(Math.min(30,r*.55))}px;${parseFloat(addAmt)>0?'':'opacity:.4'}"></i>`,onTap:()=>{ if(parseFloat(addAmt)>0) addPhaseSet('where'); }});
    adder.set({items,floor:0});
  } else if(p==='where'||p==='what'){
    items.push({k:'amt',v:.09,noCount:1,fill:'#FFC21F',fg:'#2B1A00',label:r=>`<div class="a" style="font-size:${Math.round(clamp(r*.55,18,64))}px">$${addAmt}</div>`,onTap:()=>addPhaseSet('keys')});
    if(p==='where'){
      const rec=recentMerchants(), tot=rec.reduce((a,e)=>a+e.n,0)||1;
      rec.forEach((e,i)=>{ const C=cat(e.cat); items.push({k:'m'+i,v:Math.max(e.n/tot*.72,.07),noCount:1,fill:C.c,fg:C.fg,label:shardLabel(C.i,'',esc(e.name.replace(/^PayNow( to)?\s+/i,''))),onTap:()=>addPick(e.name,e.cat,e.acc,'m'+i)}); });
      items.push({k:'else',v:.1,noCount:1,fill:'#352C5C',fg:'#FFFFFF',label:shardLabel('ti-dots','','Elsewhere'),onTap:()=>addPhaseSet('what')});
    } else {
      const u=catUsage(), tot=Object.values(u).reduce((a,v)=>a+v,0);
      Object.keys(CATS).forEach(k=>{ const C=cat(k); items.push({k:'c'+k,v:Math.max(u[k]/tot*.85,.04),noCount:1,fill:C.c,fg:C.fg,label:shardLabel(C.i,'',C.n),onTap:()=>addPick(null,k,null,'c'+k)}); });
    }
    adder.set({items,floor:0,anchors:{amt:[.5,.07]}});
  }
}
function addKey(k){
  if(k==='del') addAmt=addAmt.length>1?addAmt.slice(0,-1):'0';
  else if(k==='.'){ if(!addAmt.includes('.')) addAmt+='.'; }
  else { if(addAmt.includes('.')&&addAmt.split('.')[1].length>=2) return; if(addAmt.replace('.','').length>=7) return; addAmt=addAmt==='0'?k:addAmt+k; }
}
function addPick(merchant,catK,acc,key){
  if(acc&&!addAccTouched) addAcc=acc;
  const amt=Math.round(parseFloat(addAmt)*100)/100, date=addDay==='Yesterday'?addDays(TODAY,-1):TODAY, mer=merchant||cat(catK).n;
  const rec={id:uid(),date,merchant:mer,amount:amt,category:catK,kind:merchant?kindFor(mer,catK):defaultKind(catK),account:addAcc,
    source:'manual',card:'',verified:false,inbox:false,split:null,note:'',created:Date.now()};
  S.txs.push(rec); save(); lastAdded=rec.id;
  // the picked shard swallows the screen
  const C=cat(catK), A=ACCOUNTS[addAcc];
  adder.set({items:[{k:key,v:1,noCount:1,fill:C.c,fg:C.fg,label:()=>`<i class="ti ${C.i}" style="font-size:56px"></i><div class="a" style="font-size:52px">${money(amt)}</div><div class="n">${esc(mer)} · ${addDay} · ${A.short}</div>`,onTap:closeAdd}],floor:0});
  addPhase='done'; addPills();
  clearTimeout(addTimer); addTimer=setTimeout(()=>{ closeAdd(); toast('ti-check',`${money(amt)} logged · tap to undo`,()=>{ S.txs=S.txs.filter(t=>t.id!==lastAdded); save(); render(); toast('ti-arrow-back-up','Undone'); }); },900);
}
function openAdd(){
  clearTimeout(addTimer); addAmt='0'; addAcc='card'; addAccTouched=false; addDay='Today';
  $('#vAdd').classList.remove('hidden'); document.body.classList.add('adding');
  Object.values(adder.T).forEach(B=>{ adder.drop(B.k); }); adder.T={}; adder.svg.querySelectorAll('.terr').forEach(e=>e.remove());
  Object.values(STAGES).forEach(([,m])=>m.stop());
  addPills(); adder.start(); requestAnimationFrame(()=>addPhaseSet('keys'));
}
function closeAdd(){ clearTimeout(addTimer); $('#vAdd').classList.add('hidden'); document.body.classList.remove('adding'); adder.stop(); render(); }
$('#btnAdd').onclick=openAdd;
$('#fabFloat').onclick=openAdd;

function parseAmount(v){ if(typeof v==='number') return v; const s=String(v||'').replace(/[^0-9.,-]/g,''); return parseFloat(s.replace(/,(?=\d{3}\b)/g,'').replace(',','.')); }
function parseDate(v,ts){ const d=new Date(v); return iso(v&&!isNaN(d)?d:new Date(ts||Date.now())); }
async function sync(manual){
  if(!S.sync.url||!S.sync.secret){ if(manual) toast('ti-plug-off','Add your Worker URL and secret'); return; }
  try{
    const h={Authorization:'Bearer '+S.sync.secret};
    const r=await fetch(S.sync.url+'/tx',{headers:h}); if(!r.ok) throw new Error(r.status);
    const items=await r.json(), ids=[]; let added=0;
    for(const it of items){
      ids.push(it.id); if(S.txs.some(t=>t.remoteId===it.id)) continue;
      const amt=parseAmount(it.amount); if(!(amt>0)) continue;
      const mer=String(it.merchant||'Apple Pay').trim(), c=guessCat(mer), account=accountFor(it.card);
      S.txs.push({id:uid(),remoteId:it.id,date:parseDate(it.date,it.ts),merchant:mer,amount:Math.round(amt*100)/100,category:c,kind:kindFor(mer,c),account,
        source:/PAYNOW/i.test(it.card||'')?'paynow':'applepay',card:it.card||'',verified:false,inbox:true,split:null,note:'',created:Date.now()});
      added++;
    }
    if(ids.length) await fetch(S.sync.url+'/ack',{method:'POST',headers:{...h,'Content-Type':'application/json'},body:JSON.stringify({ids})});
    S.sync.last=Date.now(); save();
    if(added){ toast('ti-bolt',`${added} new synced`); render(); } else if(manual) toast('ti-check','Up to date');
  }catch(e){ if(manual) toast('ti-alert-triangle','Sync failed. Check URL and secret'); }
}

/* =================================================================
   STATEMENT CHECK (SC credit card PDF, parsed on-device)
   ================================================================= */
const MON={Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
async function pdfToLines(pdf){ const out=[];
  for(let p=1;p<=pdf.numPages;p++){ const page=await pdf.getPage(p), tc=await page.getTextContent(), rows=[];
    for(const it of tc.items){ if(!it.str||!it.str.trim()) continue; const y=it.transform[5], x=it.transform[4];
      let r=rows.find(r=>Math.abs(r.y-y)<3); if(!r){r={y,items:[]};rows.push(r);} r.items.push({x,s:it.str}); }
    rows.sort((a,b)=>b.y-a.y); for(const r of rows){ r.items.sort((a,b)=>a.x-b.x); out.push(r.items.map(i=>i.s).join(' ').replace(/\s+/g,' ').trim()); } }
  return out; }
function parseStatement(lines){
  let st=null; for(const l of lines){ const m=l.match(/Statement Date\s*:?\s*(\d{1,2}) (\w{3}) (\d{4})/); if(m){st={m:MON[m[2]],y:+m[3]};break;} }
  if(!st) st={m:now.getMonth(),y:now.getFullYear()};
  const re=/^(\d{1,2}) (Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec) (\d{1,2}) (?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec) (.+?) (-?[\d,]+\.\d{2}) ?(CR)?$/;
  const out=[]; for(const l of lines){ const m=l.match(re); if(!m) continue;
    const desc=m[4].replace(/Transaction Ref \d+/,'').replace(/\s+/g,' ').trim(), mon=MON[m[2]], y=mon>st.m?st.y-1:st.y;
    out.push({date:`${y}-${String(mon+1).padStart(2,'0')}-${String(+m[1]).padStart(2,'0')}`,desc,amount:parseFloat(m[5].replace(/,/g,'')),credit:!!m[6]}); }
  return out; }
// JumpStart (SC savings) statement: date, description, amount, running balance
function parseJumpstart(lines){
  const out=[]; let bal=null, cur=null, extra=0;
  const re=/^(\d{2}) (Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec) (\d{4}) (.+)$/;
  const num=x=>parseFloat(x.replace(/,/g,''));
  for(const l of lines){
    const m=l.match(re);
    if(m){
      const rest=m[4], nums=rest.match(/[\d,]+\.\d{2}/g)||[];
      if(/BALANCE FROM PREVIOUS/i.test(rest)){ if(nums.length) bal=num(nums[nums.length-1]); cur=null; continue; }
      if(/CLOSING BALANCE/i.test(rest)){ if(nums.length) out.closing={amount:num(nums[nums.length-1]),date:`${m[3]}-${String(MON[m[2]]+1).padStart(2,'0')}-${m[1]}`}; cur=null; continue; }
      if(nums.length<2){ cur=null; continue; }
      const amt=num(nums[nums.length-2]), nb=num(nums[nums.length-1]);
      const dir= bal!=null ? (nb>bal?'in':'out') : (/WITHDRAWAL|TO CARD/i.test(rest)?'out':'in');
      bal=nb; extra=0;
      cur={date:`${m[3]}-${String(MON[m[2]]+1).padStart(2,'0')}-${m[1]}`,desc:rest.replace(/\s*[\d,]+\.\d{2}.*$/,'').trim(),amount:amt,dir};
      out.push(cur);
    } else if(cur && extra<3 && !/^(Page \d|Your Statement|If you note|Deposit Insurance)/i.test(l)){ cur.desc+=' '+l; extra++; }
    else cur=null;
  }
  return out;
}
function jumpstartRow(r){
  const d=r.desc.toUpperCase();
  if(/TO CARD/.test(d)) return {merchant:'Pay SC Card',category:'other',kind:'transfer',toAcc:'card'};
  if(/IBFT|TRANSFER/.test(d) && r.dir==='in') return {merchant:'From POSB',category:'other',kind:'transfer',fromAcc:'salary'};
  if(/INTEREST/.test(d)) return {merchant:'Interest',category:'other',kind:'income'};
  const name=tidyName(r.desc.split('|')[0]);
  if(r.dir==='in') return {merchant:name,category:'other',kind:'income'};
  const c=guessCat(name)!=='other'?guessCat(name):guessCat(name+' '+r.desc); return {merchant:name,category:c,kind:kindFor(name,c)};
}
function importAccount(rows,account){
  let added=0, already=0; const used=new Set();
  if(rows.closing){ S.balances=S.balances||{}; const b=S.balances[account]; if(!b||b.date<=rows.closing.date) S.balances[account]={...rows.closing,src:'statement'}; }
  rows.forEach(r=>{
    const dup=S.txs.find(t=>!used.has(t.id)&&t.account===account&&t.date===r.date&&Math.abs(t.amount-r.amount)<0.005&&(isIn(t)?'in':'out')===r.dir);
    if(dup){ used.add(dup.id); dup.verified=true; already++; return; }
    const info=jumpstartRow(r), t={id:uid(),date:r.date,amount:r.amount,account,source:'statement',card:'',verified:true,inbox:false,split:null,note:'',created:Date.now(),...info};
    if(r.dir==='in') t.dir='in'; S.txs.push(t); used.add(t.id); added++;
  });
  save(); render();
  openSheet(`
    <h2>JumpStart imported</h2>
    <div class="result" style="grid-template-columns:1fr 1fr">
      <div class="cut-tile" style="background:var(--cyan);color:#00243A"><b>${added}</b><span>Added</span></div>
      <div class="cut-tile" style="background:var(--green);color:#06301A"><b>${already}</b><span>Already in</span></div>
    </div>
    <p class="hint">Card payments and top-ups from POSB are marked as transfers, so nothing is counted twice.</p>
    <button class="btn primary cut-a" id="rDone" style="margin-top:16px"><i class="ti ti-check"></i>Done</button>`);
  if(added) burst(null);
  $('#rDone').onclick=closeSheet;
}
function tidyName(desc){ const s=desc.replace(/\b(SINGAPORE|SG)\b/gi,'').replace(/\s\d{4,}\b/g,'').replace(/COGOLINKS\*/i,'').replace(/~+/g,'').replace(/\s+/g,' ').trim();
  return s.split(' ').map(w=>w.length<=3&&/^[A-Z]+$/.test(w)?w:w.charAt(0)+w.slice(1).toLowerCase()).join(' '); }
$('#pdfInput').onchange=async e=>{
  const f=e.target.files[0]; e.target.value=''; if(!f) return;
  toast('ti-file-search','Reading statement');
  try{
    const pdfjs=await import('https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.min.mjs');
    pdfjs.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs';
    const pdf=await pdfjs.getDocument({data:new Uint8Array(await f.arrayBuffer())}).promise;
    const lines=await pdfToLines(pdf), all=lines.join(' ');
    if(/JUMPSTART/i.test(all)||(/Statement of Account/i.test(all)&&/Withdrawal/i.test(all))){
      const js=parseJumpstart(lines); if(!js.length) return toast('ti-alert-triangle','No transactions found in that PDF');
      return importAccount(js,'savings'); }
    const sd=all.match(/Statement Date\s*:?\s*(\d{1,2}) (\w{3}) (\d{4})/), dd=all.match(/Payment Due Date\s*:?\s*(\d{1,2}) (\w{3}) (\d{4})/), nb=all.match(/NEW BALANCE\s+([\d,]+\.\d{2})/);
    const toIso=m=>`${m[3]}-${String(MON[m[2]]+1).padStart(2,'0')}-${String(+m[1]).padStart(2,'0')}`;
    if(sd&&dd&&nb&&(!S.cardBill||S.cardBill.stmt<=toIso(sd))) S.cardBill={amount:parseFloat(nb[1].replace(/,/g,'')),stmt:toIso(sd),due:toIso(dd)};
    const rows=parseStatement(lines).filter(r=>!r.credit);
    if(!rows.length) return toast('ti-alert-triangle','Couldn\'t read that statement. POSB history PDFs are images, so they can\'t be read yet');
    reconcile(rows);
  }catch(err){ console.error(err); toast('ti-alert-triangle','Couldn\'t read that PDF'); }
};
function reconcile(rows){
  let matched=0,fixed=0,added=0,already=0; const fixes=[], claimed=new Set();
  const cardTx=()=>S.txs.filter(t=>t.account==='card'&&!isIn(t));
  rows.forEach(r=>{
    const done=cardTx().find(t=>t.verified&&!claimed.has(t.id)&&t.date===r.date&&Math.abs(t.amount-r.amount)<0.005);
    if(done){ claimed.add(done.id); already++; return; }
    const pool=cardTx().filter(t=>!t.verified&&Math.abs(daysBetween(t.date,r.date))<=3);
    let hit=pool.find(t=>Math.abs(t.amount-r.amount)<0.005);
    if(hit){ hit.verified=true; claimed.add(hit.id); matched++; return; }
    const k=mKey(r.desc); hit=pool.find(t=>k&&mKey(t.merchant)===k);
    if(hit){ fixes.push([hit.merchant,hit.amount,r.amount]); Object.assign(hit,{amount:r.amount,verified:true}); claimed.add(hit.id); fixed++; return; }
    const name=tidyName(r.desc), c=guessCat(name)!=='other'?guessCat(name):guessCat(name+' '+r.desc);
    S.txs.push({id:uid(),date:r.date,merchant:name,amount:r.amount,category:c,kind:kindFor(name,c),account:'card',source:'statement',card:'',verified:true,inbox:false,split:null,note:'',created:Date.now()});
    added++;
  });
  save(); render();
  openSheet(`
    <h2>Statement checked</h2>
    <div class="result">
      <div class="cut-tile" style="background:var(--green);color:#06301A"><b>${matched}</b><span>Matched</span></div>
      <div class="cut-tile" style="background:var(--yellow);color:#2B1A00"><b>${fixed}</b><span>Fixed</span></div>
      <div class="cut-tile" style="background:var(--cyan);color:#00243A"><b>${added}</b><span>Added</span></div>
    </div>
    ${already?`<p class="hint">${already} were already confirmed earlier.</p>`:''}
    ${fixes.length?`<span class="lbl" style="margin-top:16px">Fixed amounts</span>${fixes.map(([m,a,b])=>`<div class="flow"><span></span><div class="t1">${esc(m)}</div><div class="num" style="font-weight:800">${money(a)} <i class="ti ti-arrow-right" style="color:var(--tx3)"></i> ${money(b)}</div></div>`).join('')}`:''}
    ${added?`<p class="hint">Added items were paid without Apple Pay. Check their categories in Activity.</p>`:''}
    <button class="btn primary cut-a" id="rDone" style="margin-top:16px"><i class="ti ti-check"></i>Done</button>`);
  if(matched+fixed+added) burst(null);
  $('#rDone').onclick=closeSheet;
}

/* ---------- toast + shard burst ---------- */
function toast(icon,msg,onTap){ const t=$('#toast'); t.innerHTML=`<i class="ti ${icon}"></i>${esc(msg)}`; t.classList.add('on'); clearTimeout(t._t);
  t.onclick=onTap?()=>{ t.classList.remove('on'); t.onclick=null; onTap(); }:null; t._t=setTimeout(()=>{ t.classList.remove('on'); t.onclick=null; },onTap?4000:2200); }
function burst(fromEl){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c=$('#burst'), x=c.getContext('2d'), dpr=devicePixelRatio||1; c.width=innerWidth*dpr; c.height=innerHeight*dpr; x.setTransform(dpr,0,0,dpr,0,0);
  const r=fromEl?fromEl.getBoundingClientRect():{left:innerWidth/2,top:innerHeight/2,width:0,height:0};
  const ox=r.left+r.width/2, oy=r.top+r.height/2, cols=['#FF3D7F','#FFC21F','#9B5CFF','#3DDC84','#1FB6FF','#FF5A36','#B8F03C'];
  const ps=Array.from({length:46},()=>{ const a=-Math.PI/2+(Math.random()-.5)*Math.PI*1.4, s=Math.random()*12+7;
    return {x:ox,y:oy,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:Math.random()*6,vr:(Math.random()-.5)*.5,sz:Math.random()*12+8,c:cols[Math.random()*cols.length|0],
      p:[[0,-1],[Math.random()*.8+.4,Math.random()*.8],[-(Math.random()*.8+.4),Math.random()*.6+.2]]}; });
  const t0=performance.now();
  (function f(n){ const el=n-t0; x.clearRect(0,0,innerWidth,innerHeight);
    ps.forEach(p=>{ p.vy+=.42; p.vx*=.985; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr;
      x.save(); x.translate(p.x,p.y); x.rotate(p.r); x.globalAlpha=Math.max(0,1-el/1500); x.fillStyle=p.c; x.beginPath();
      p.p.forEach(([a,b],i)=>i?x.lineTo(a*p.sz,b*p.sz):x.moveTo(a*p.sz,b*p.sz)); x.closePath(); x.fill(); x.restore(); });
    if(el<1500) requestAnimationFrame(f); else x.clearRect(0,0,innerWidth,innerHeight); })(t0);
}

/* ---------- updates: the home-screen app keeps an old copy for a while, so check GitHub for a newer build ---------- */
const BUILD=document.querySelector('meta[name="slice-build"]').content;
const ss=(k,v)=>{ try{ if(v===undefined) return sessionStorage.getItem(k); sessionStorage.setItem(k,v); }catch(e){ return null; } };
async function checkUpdate(){
  if(!/^https?:/.test(location.protocol)) return;
  try{
    const r=await fetch(location.pathname+'?check='+Date.now(),{cache:'no-store'}); if(!r.ok) return;
    const m=(await r.text()).match(/name="slice-build" content="([^"]+)"/); if(!m||m[1]===BUILD) return;
    if(ss('slice.reloaded')===m[1]) return;            // tried this build already this session
    const busy=$('#sheet').classList.contains('on')||!$('#vAdd').classList.contains('hidden');
    if(busy){ setTimeout(checkUpdate,8000); return; }  // never reload in the middle of logging
    ss('slice.reloaded',m[1]); try{ localStorage.setItem('slice.updated',m[1]); }catch(e){}
    location.replace(location.pathname+'?v='+m[1]);
  }catch(e){}
}
try{ if(localStorage.getItem('slice.updated')===BUILD){ localStorage.removeItem('slice.updated'); setTimeout(()=>toast('ti-sparkles','Slice updated'),1600); } }catch(e){}
checkUpdate();
let rsT=null; addEventListener('resize',()=>{ clearTimeout(rsT); rsT=setTimeout(()=>{ ENGINES.forEach(m=>{ Object.keys(m.T).forEach(k=>{ const B=m.T[k]; [B.k,...Object.keys(B.kids).map(x=>B.k+'/'+x)].forEach(id=>m.drop(id)); }); m.svg.querySelectorAll('.terr').forEach(e=>e.remove()); Object.values(m.tg).forEach(e=>e.remove()); m.T={}; m.tr={}; m.tg={}; }); if($('#vAdd').classList.contains('hidden')) render(); else addPhaseSet(addPhase==='done'?'keys':addPhase); },200); });
</script>
</body>
</html>
