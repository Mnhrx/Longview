<style>
/* Layout: full-screen transit-diagram map, white signage panels: HUD on top, tab bar at bottom, sheet above it. Single committed light look. */
:root{
  --ink:#1b2128;
  --paper:#ffffff;
  --soft:#eef0f2;
  --rule:#e1e4e8;
  --muted:#6b7580;
  --land:#f1f0ea;
  --go:#1f8a5b;
  --stop:#d2402f;
  --warn:#b7791f;
  --display:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --body:'Barlow',system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--land);}
body{font-family:var(--body);color:var(--ink);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;font-size:15px}
#map{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.panel{background:var(--paper);box-shadow:0 1px 2px rgba(20,25,30,.12),0 4px 14px rgba(20,25,30,.08)}

.hud{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;
  padding-top:calc(env(safe-area-inset-top,0px) + 10px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.hud>*{pointer-events:auto}
.cash{border-radius:10px;padding:6px 12px 7px;min-width:0}
.cash .amt{font-family:var(--display);font-weight:700;font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
.cash .amt.neg{color:var(--stop)}
.cash .date{font-family:var(--display);font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:3px}
.hudr{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.hudl{display:flex;flex-direction:column;align-items:flex-start;gap:6px;min-width:0}
#regionBtn{max-width:46vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.speed{display:flex;border-radius:10px;padding:3px;gap:2px}
.speed button{background:none;border:0;border-radius:7px;padding:8px 10px;font-family:var(--display);font-weight:600;font-size:16px;min-width:38px;color:var(--muted)}
.speed button.on{background:var(--ink);color:#fff}
.layer{border:0;border-radius:999px;padding:6px 12px;font-family:var(--display);font-weight:600;font-size:14px;letter-spacing:.06em;text-transform:uppercase}
.layer.on{background:var(--ink);color:#fff}

.hint{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 112px);z-index:4;
  background:var(--ink);color:#fff;font-weight:600;border-radius:999px;padding:8px 10px 8px 16px;display:flex;gap:8px;align-items:center;
  max-width:calc(100vw - 32px);box-shadow:0 4px 14px rgba(0,0,0,.2);white-space:nowrap}
.hint span{overflow:hidden;text-overflow:ellipsis}
.hint button{background:rgba(255,255,255,.18);border:0;border-radius:999px;padding:4px 10px;font-weight:600;font-size:13px;color:#fff}
.toasts{position:fixed;top:calc(env(safe-area-inset-top,0px) + 160px);left:0;right:0;z-index:4;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;padding-left:16px;padding-right:16px}
.toast{background:var(--paper);border-left:4px solid var(--ink);border-radius:8px;padding:8px 12px;font-size:14px;max-width:420px;box-shadow:0 4px 14px rgba(20,25,30,.14);animation:tin .25s ease-out}
.toast.bad{border-left-color:var(--stop)}.toast.good{border-left-color:var(--go)}
@keyframes tin{from{transform:translateY(-6px);opacity:0}}

.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:repeat(5,1fr);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));border-top:1px solid var(--rule)}
.bar button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;color:var(--muted);font-family:var(--display);font-size:12.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;min-width:0;position:relative}
.bar button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bar button.on{color:var(--ink)}
.bar button.on::before{content:"";position:absolute;top:0;left:25%;right:25%;height:3px;border-radius:0 0 3px 3px;background:var(--ink)}
.bar .dot{position:absolute;top:6px;left:calc(50% + 8px);min-width:16px;height:16px;border-radius:8px;background:var(--stop);color:#fff;font-size:10px;font-family:var(--body);font-weight:700;display:flex;align-items:center;justify-content:center;letter-spacing:0;padding:0 4px;box-sizing:border-box}

.sheet{position:fixed;left:0;right:0;z-index:5;bottom:calc(62px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.card{pointer-events:auto;background:var(--paper);border-radius:14px 14px 10px 10px;width:100%;max-width:480px;max-height:56vh;overflow:auto;padding:14px 16px 16px;box-shadow:0 -4px 24px rgba(20,25,30,.16);margin-bottom:8px;animation:sin .2s ease-out;box-sizing:border-box}
@keyframes sin{from{transform:translateY(12px);opacity:0}}
@media (prefers-reduced-motion:reduce){.card,.toast{animation:none}}
.card.compact{padding:10px 12px;max-height:none}
.cpt{display:flex;align-items:center;gap:10px}
.cpt>div{flex:1;min-width:0}
.cpt b{display:block;font-family:var(--display);font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cpt small{color:var(--muted);font-size:12.5px}
.card h2{font-family:var(--display);font-weight:700;font-size:25px;margin:0;line-height:1.1;text-wrap:balance;display:flex;align-items:center;gap:8px}
.card .sub{color:var(--muted);font-size:13px;letter-spacing:.1em;text-transform:uppercase;font-family:var(--display);margin-top:2px}
.card h3{font-family:var(--display);font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:18px 0 2px;font-weight:600}
.card p{margin:10px 0;line-height:1.45}
.note{font-size:13px;color:var(--muted)}
.x{margin-left:auto;background:none;border:0;color:var(--muted);font-size:24px;line-height:1;padding:2px 6px}
.rows{display:grid;margin-top:6px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--rule);font-variant-numeric:tabular-nums}
.row>span:first-child{color:var(--muted);min-width:0}
.row b{font-weight:600;text-align:right;white-space:nowrap}
button.row{background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left;font:inherit}
button.row>span:first-child{color:var(--ink)}
small.m{display:block;color:var(--muted);font-size:13px;line-height:1.35;margin-top:1px}
.pos{color:var(--go)}.neg{color:var(--stop)}.warnc{color:var(--warn)}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:22px;padding:0 5px;border-radius:11px;color:#fff;font-family:var(--display);font-weight:700;font-size:14px;margin-right:6px;vertical-align:middle;box-sizing:border-box}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{flex:1 1 auto;background:var(--soft);border:0;border-radius:9px;padding:11px 14px;font-weight:600;min-height:44px}
.btn.pri{background:var(--ink);color:#fff}
.btn.warn{background:#fbe9e6;color:#a8301f}
.btn.sm{min-height:36px;padding:7px 12px;font-size:14px;flex:none}
.btn:disabled{opacity:.35;cursor:not-allowed}
.veh{display:grid;grid-template-columns:1fr auto;gap:3px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--rule)}
.veh .nm{font-family:var(--display);font-size:19px;font-weight:600;min-width:0}
.veh .sp{color:var(--muted);font-size:13px;grid-column:1;line-height:1.35}
.veh .btn{grid-row:1/3;grid-column:2;flex:none;min-width:92px}
.lc{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;padding:10px 0;border-top:1px solid var(--rule)}
.lc .main{background:none;border:0;text-align:left;padding:0;min-width:0;font:inherit;color:var(--ink)}
.lc .rt{font-weight:600;line-height:1.3}
.lc .side{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.mini{display:flex;gap:6px;align-items:center}
.mini button{min-width:40px;height:36px;border:0;border-radius:8px;background:var(--soft);font-size:20px;font-weight:600;line-height:1;padding:0 10px}
.mini button.txt{font-size:14px}
.mini button.add{background:var(--ink);color:#fff}
.mini button:disabled{opacity:.3}
.chip{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.03em;padding:1px 6px;border-radius:4px;margin-left:4px;vertical-align:1px}
.chip.bad{background:#fbe9e6;color:#a8301f}.chip.warn{background:#fdf1dc;color:#8a5a12}.chip.ok{background:#e3f3ea;color:#17673f}.chip.info{background:var(--soft);color:var(--ink)}
.goal{height:8px;background:var(--soft);border-radius:4px;overflow:hidden;margin-top:6px}
.goal i{display:block;height:100%;background:var(--go)}
.wish{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:7px 0;border-top:1px solid var(--rule);font-variant-numeric:tabular-nums}
.wish .bar2{grid-column:1/3;height:6px;background:var(--soft);border-radius:3px;overflow:hidden}
.wish .bar2 i{display:block;height:100%;background:var(--ink)}
.tool{display:grid;grid-template-columns:44px 1fr;gap:4px 12px;align-items:center;padding:12px 0;border-top:1px solid var(--rule);background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left;font:inherit}
.tool svg{grid-row:1/3;width:40px;height:40px;stroke:var(--ink);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;background:var(--soft);border-radius:10px;padding:6px;box-sizing:border-box}
.tool b{font-family:var(--display);font-size:19px;font-weight:600}
.tool span{color:var(--muted);font-size:13px;line-height:1.35}
ol{margin:8px 0 0;padding-left:20px;line-height:1.5}
label.sub{display:block;margin-top:6px}
.field{display:block;width:100%;box-sizing:border-box;margin-top:6px;background:var(--soft);border:1px solid var(--rule);border-radius:9px;color:var(--ink);font:inherit;font-size:17px;padding:11px 12px;-webkit-user-select:text;user-select:text}
.field:focus{outline:2px solid var(--ink);outline-offset:1px}
svg.chart{width:100%;height:auto;display:block;margin-top:8px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.stat{background:var(--soft);border-radius:10px;padding:10px 12px;min-width:0}
.stat span{display:block;font-size:12px;color:var(--muted);letter-spacing:.04em}
.stat b{display:block;font-family:var(--display);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15;overflow-wrap:anywhere}
.stat small{display:block;font-size:12px;color:var(--muted)}
.stat.wide{grid-column:1/3}
.why{margin:8px 0 0;padding-left:18px;line-height:1.45}
.why li{margin-bottom:6px}
.why.steps{list-style:none;padding-left:0}
</style>

<canvas id="map"></canvas>

<div class="hud">

</nav>

<script>
(() => {
'use strict';
const W = 56, H = 56, T = 24;
const SAVE_KEY = 'lineworks-save-v3';

function rng(seed){ return function(){ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

const P = id => S.towns[id];
const lineById = id => S.lines.find(l=>l.id===id);
const dist = (a,b) => Math.abs(a.x-b.x)+Math.abs(a.y-b.y);
const eDist = (a,b) => Math.hypot(a.x-b.x, a.y-b.y);
const isPax = p => p.kind!=='industry';
const popO = p => p.kind==='attraction' ? p.draw*0.5 : p.kind==='industry' ? 0 : p.pop;
const popD = p => p.kind==='attraction' ? p.draw : p.kind==='industry' ? 0 : p.pop;
const sizeOf = p => p.kind==='attraction' ? p.draw : p.kind==='industry' ? 1000 : p.pop;
const roadPass = i => roads[i]===1 || placeTile[i]>=0;
const railPass = i => rails[i]===1 || placeTile[i]>=0;
const pass = mode => mode==='rail' ? railPass : roadPass;
const year = () => START_YEAR + Math.floor(S.day/360);
const monthIdx = () => Math.floor(S.day/30)%12;
const season = () => SEASON[monthIdx()];
const dateStr = d => MONTHS[Math.floor(d/30)%12] + ' ' + (START_YEAR + Math.floor(d/360));
const DWELL = { road:0.6, rail:0.8, air:1.0 };
const FARE_MAX = 3.0;
const fare = (mode,a,b) => (mode==='air' ? 4+0.9*eDist(a,b) : mode==='rail' ? 2.5+0.65*dist(a,b) : 1.6+0.6*dist(a,b)) * S.fareInfl;
const CARGO_VALUE = { food:1.1, ore:1.0, goods:1.5 };
const cargoFare = (a,b,good) => (1.8+1.25*dist(a,b)) * (CARGO_VALUE[good]||1) * S.fareInfl;
const price = m => Math.round(MODELS[m].cost * S.infl);
const vAge = v => (S.day - v.bought)/360;
const fuel = () => S.fuelUntil>S.day ? 1.3 : 1;
const CAR = { seats:40, tonnes:60, cost:8000, run:450, max:6, slow:0.04 };
const vCars = v => MODELS[v.model].mode==='rail' ? (v.cars||0) : 0;
const vCap = v => MODELS[v.model].cap + vCars(v)*(MODELS[v.model].kind==='freight'?CAR.tonnes:CAR.seats);
const vSpeed = v => MODELS[v.model].speed * (1 - CAR.slow*vCars(v));
const carPrice = () => Math.round(CAR.cost*S.infl);
const runCost = v => (MODELS[v.model].run + vCars(v)*CAR.run) * S.infl * (1 + 0.05*vAge(v)) * fuel();
const vehValue = v => Math.round(v.paid * 0.75 * Math.max(0.1, 1 - vAge(v)/MODELS[v.model].life));
const bestModel = (mode,kind) => Object.keys(MODELS).filter(k=>MODELS[k].mode===mode && MODELS[k].kind===kind && MODELS[k].year<=year()).pop();
const aboard = v => v.cargo.reduce((s,c)=>s+c.n,0);
const lineVehicles = l => S.vehicles.filter(v=>v.line===l.id);
const kindLabel = p => p.kind==='industry' ? IND[p.type].name : p.kind==='attraction' ? 'Tourist attraction' : (TOWN_TYPES[p.type]?.name || 'Town');
const modeName = m => m==='rail' ? 'Railway' : m==='air' ? 'Air' : 'Road';
const vehWord = (mode,n) => mode==='air' ? (n===1?'plane':'planes') : mode==='rail' ? (n===1?'train':'trains') : (n===1?'vehicle':'vehicles');

function attrOf(p){
  let a = p.kind==='attraction' ? 1.3 : (TOWN_TYPES[p.type]?.attr ?? 0.8);
  if(p.kind==='attraction'||p.type==='resort'){ a*=season(); if(S.tourismUntil>S.day) a*=1.5; }
  for(const b of S.props) if(b.town===p.id && PT[b.type].boost) a*=1+PT[b.type].boost;
  if(S.events.some(e=>e.type==='festival'&&e.town===p.id&&e.until>S.day)) a*=2.5;
  return a;
}

// ---------- business ----------
function canHost(type,p){
  const w=PT[type].where;
  if(w==='industry') return p.kind==='industry';
  if(w==='resort') return p.kind==='attraction' || p.type==='resort';
  if(w==='townvillage') return p.kind==='town'||p.kind==='village';
  return p.kind==='town';
}
const propPrice = (type,p) => Math.round(PT[type].base * Math.pow(Math.max(sizeOf(p),200)/1000, 0.8) * S.infl);
const propValue = b => Math.round(propPrice(b.type, P(b.town)) * 0.9);
function visitF(p){ return clamp(0.5 + (p.arrLast||0)/(Math.max(popD(p),200)*0.04), 0.5, 2.5); }
function propRent(b){
  const p=P(b.town), pt=PT[b.type];
  let r = propPrice(b.type,p) * pt.rate;
  r *= p.kind==='industry' ? (0.5 + (p.shipShare||0)) : (0.4 + p.rating);
  if(pt.visitors) r *= visitF(p);
  if(pt.seasonal) r *= season();
  return r;
}
const propUpkeep = b => b.paid * UPKEEP;
const propPL = b => propValue(b) + b.rentTotal - b.upkeepTotal - b.paid;
const maxProps = p => p.kind==='town' ? 3 : p.kind==='attraction' ? 2 : 1;
const airportValue = () => S.towns.filter(t=>t.airport).length * AIRPORT_COST * 0.5 * S.infl;
function assetsOf(o){ return o.vehicles.reduce((s2,v)=>s2+vehValue(v),0) + o.props.reduce((s2,b)=>s2+Math.round(propPrice(b.type,o.towns[b.town])*0.9),0) + o.towns.filter(t=>t.airport).length*AIRPORT_COST*0.5*S.infl; }
let bgActive=null, bgIndex=-1;
const intlValue = () => (S.intl||[]).reduce((s2,rt)=>s2+rt.veh.reduce((a,v)=>a+vehValue(v),0),0);
function loadLegacy(){ let a=null, b2=S&&S.legacy; try{ a=JSON.parse(localStorage.getItem(LEGACY_KEY)||'null'); }catch(e){}
  const pick=[a,b2].filter(Boolean).sort((x,y)=>(y.hall||[]).length-(x.hall||[]).length)[0]; return pick||{rep:0,hall:[]}; }
function saveLegacy(L){ if(S) S.legacy=L; try{ localStorage.setItem(LEGACY_KEY,JSON.stringify(L)); }catch(e){} }
const repLevel = () => Math.min(10,(S.legacy?.rep)||0);
const loanRate = () => Math.max(0.04, 0.08-0.005*repLevel());
const maxLoan = () => 300000 + 100000*repLevel();
const companyValue = () => S.money - S.loan + assetsOf(S) + (S.others||[]).reduce((s2,o,i)=>i===bgIndex?s2:s2+assetsOf(o),0) + (bgActive?assetsOf(bgActive):0) + intlValue();

// ---------- world generation ----------
function blankTerrain(seed){
  const r=rng(seed), n1=noise(r,12), n2=noise(r,4), n3=noise(r,6);
  const ter=new Array(W*H);
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){
    const e=n1(x,y)*0.75+n2(x,y)*0.25;
    ter[idx(x,y)] = e<0.3 ? WATER : e>0.74 ? HILL : n3(x,y)>0.63 ? FOREST : GRASS;
  }
  return { ter, r };
}
const small = p => p.kind!=='town';
function farFrom(list,x,y,sm){ return list.every(o => Math.max(Math.abs(o.x-x),Math.abs(o.y-y)) >= ((sm||small(o)) ? 3 : 4)); }
function clearFor(ter,p){ const rr=small(p)?0:1; for(let dy=-rr;dy<=rr;dy++) for(let dx=-rr;dx<=rr;dx++) ter[idx(p.x+dx,p.y+dy)]=GRASS; }
function mkPlace(list,name,x,y,kind,type,size){
  const p={ id:list.length, name, x, y, kind, type, pop:0, draw:0, waiting:{}, cwait:{}, boarded:0, lost:0, arrivals:0, arrLast:0, transfers:0,
    rating:0.3, growth:0, airport:false, prod:1, produced:0, shipped:0, shipShare:0, oreMonth:0, oreLast:0, supplied:0 };
  if(kind==='attraction') p.draw=Math.round(size); else if(kind!=='industry') p.pop=Math.round(size);
  list.push(p); return p;
}
function nearWater(ter,x,y,r){ for(let dy=-r;dy<=r;dy++) for(let dx=-r;dx<=r;dx++){ const nx=x+dx, ny=y+dy; if(nx>=0&&ny>=0&&nx<W&&ny<H&&ter[idx(nx,ny)]===WATER) return true; } return false; }
function assignTypes(list, ter, r){
  const towns=list.filter(p=>p.kind==='town').sort((a,b)=>b.pop-a.pop);
  towns.forEach(t=>t.type=t.pop>2000?'city':'market');
  if(towns[0]) towns[0].type='capital';
  const free=()=>towns.filter(t=>t.type==='city'||t.type==='market');
  const coastal=free().filter(t=>nearWater(ter,t.x,t.y,3));
  if(coastal[0]) coastal[0].type='port';
  const c2=free().filter(t=>nearWater(ter,t.x,t.y,3)); (c2[0]||free()[free().length-1]||{}).type='resort';
  const f=free(); if(f.length) f[Math.floor(r()*f.length)].type='university';
  const inds=list.filter(p=>p.kind==='industry');
  const f2=free(); if(f2.length&&inds.length){ let best=null; for(const t of f2) for(const i of inds){ const d=dist(t,i); if(!best||d<best.d) best={t,d}; } best.t.type='industrial'; }
  list.filter(p=>p.kind==='village').forEach(v=>v.type='farming');
}
function randomWorld(seed){
  const { ter, r } = blankTerrain(seed);
  const list=[], names=NAMES.slice().sort(()=>r()-0.5), vnames=VILLAGES.slice().sort(()=>r()-0.5);
  const landOK=(x,y,rr)=>{ for(let dy=-rr;dy<=rr;dy++) for(let dx=-rr;dx<=rr;dx++) if(ter[idx(x+dx,y+dy)]===WATER) return false; return true; };
  let n=0;
  for(let tries=0; tries<6000 && n<11; tries++){
    const x=3+Math.floor(r()*(W-6)), y=3+Math.floor(r()*(H-6));
    if(!landOK(x,y,1) || list.some(t=>Math.abs(t.x-x)+Math.abs(t.y-y)<12)) continue;
    clearFor(ter, mkPlace(list,names[n++],x,y,'town','city',700+Math.pow(r(),2)*3800));
  }
  const addSmall=(count, make, pick)=>{ let k=0; for(let tries=0; tries<6000 && k<count; tries++){
    const x=2+Math.floor(r()*(W-4)), y=2+Math.floor(r()*(H-4));
    if(!landOK(x,y,0) || !farFrom(list,x,y,true) || (pick&&!pick(x,y))) continue;
    const p=make(x,y,k++); clearFor(ter,p); } };
  addSmall(9,(x,y,k)=>mkPlace(list,vnames[k],x,y,'village','farming',150+r()*350));
  addSmall(3,(x,y,k)=>mkPlace(list,IND_NAMES.farm[k],x,y,'industry','farm'));
  addSmall(2,(x,y,k)=>mkPlace(list,IND_NAMES.mine[k],x,y,'industry','mine'),(x,y)=>ter[idx(x,y)]===HILL||r()<0.05);
  addSmall(2,(x,y,k)=>mkPlace(list,IND_NAMES.factory[k],x,y,'industry','factory'));
  addSmall(1,(x,y)=>mkPlace(list,'Silver Sands',x,y,'attraction','beach',1400+r()*900),(x,y)=>nearWater(ter,x,y,1));
  addSmall(1,(x,y)=>mkPlace(list,'Mistral Peaks',x,y,'attraction','highlands',1000+r()*800),(x,y)=>ter[idx(x,y)]===HILL||r()<0.03);
  assignTypes(list, ter, r);
  return { ter, places:list, plannedLines:[], region:null };
}

function geoWorld(geo, seed){
  const r=rng(seed), n3=noise(r,6), n2=noise(r,3);
  const ok=v=>typeof v==='number'&&isFinite(v);
  const okPlace=t=>t&&typeof t.name==='string'&&t.name.trim()&&ok(t.lat)&&ok(t.lon)&&Math.abs(t.lat)<=90&&Math.abs(t.lon)<=180;
  const arr=k=>(Array.isArray(geo[k])?geo[k]:[]).filter(okPlace).slice(0,18);
  const srcT=arr('towns'), srcV=arr('villages'), srcI=arr('industries'), srcA=arr('attractions');
  if(srcT.length<3) throw {code:'too_few'};
  const all=srcT.concat(srcV,srcI,srcA);
  const lat0=srcT.reduce((a,t)=>a+t.lat,0)/srcT.length, k=Math.cos(lat0*Math.PI/180);
  const proj=(lat,lon)=>[lon*k,-lat];
  let minx=Infinity,miny=Infinity,maxx=-Infinity,maxy=-Infinity;
  const fixed=Array.isArray(geo.bbox)&&geo.bbox.length===4&&geo.bbox.every(ok);
  const ext=fixed?[[geo.bbox[0],geo.bbox[1]],[geo.bbox[2],geo.bbox[3]]]:all.map(t=>[t.lat,t.lon]);
  for(const [la,lo] of ext){ const [px,py]=proj(la,lo); minx=Math.min(minx,px);maxx=Math.max(maxx,px);miny=Math.min(miny,py);maxy=Math.max(maxy,py); }
  let bw=Math.max(maxx-minx,0.02), bh=Math.max(maxy-miny,0.02);
  const pad=fixed?0:Math.max(bw,bh)*0.08; minx-=pad; miny-=pad; bw+=pad*2; bh+=pad*2;
  const scale=(W-6)/Math.max(bw,bh), offX=3+((W-6)-bw*scale)/2, offY=3+((H-6)-bh*scale)/2;
  const toG=(lat,lon)=>{ const [px,py]=proj(lat,lon); return [(px-minx)*scale+offX,(py-miny)*scale+offY]; };
  const perKm=scale/111;
  const hasLand=Array.isArray(geo.land)&&geo.land.length>0;
  const ter=new Array(W*H).fill(hasLand?WATER:GRASS);
  const fillPoly=(poly,val,samples)=>{
    const pts=poly.filter(q=>Array.isArray(q)&&ok(q[0])&&ok(q[1])).slice(0,2000).map(q=>toG(q[0],q[1]));
    if(pts.length<3) return;
    let x0=W,x1=0,y0=H,y1=0; for(const [x,y] of pts){ x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y); }
    const inside=(px,py)=>{ let c=false; for(let i=0,j=pts.length-1;i<pts.length;j=i++){ const [xi,yi]=pts[i],[xj,yj]=pts[j]; if(((yi>py)!==(yj>py)) && px<(xj-xi)*(py-yi)/(yj-yi)+xi) c=!c; } return c; };
    for(let y=Math.max(0,Math.floor(y0));y<=Math.min(H-1,Math.ceil(y1));y++) for(let x=Math.max(0,Math.floor(x0));x<=Math.min(W-1,Math.ceil(x1));x++){
      if(samples){ let n=0; for(const [sx,sy] of [[.25,.25],[.75,.25],[.25,.75],[.75,.75],[.5,.5]]) if(inside(x+sx,y+sy)) n++; if(n>=3) ter[idx(x,y)]=val; }
      else if(inside(x+0.5,y+0.5)) ter[idx(x,y)]=val;
    }
  };
  if(hasLand) geo.land.slice(0,60).forEach(poly=>{ if(Array.isArray(poly)) fillPoly(poly,GRASS,true); });
  (Array.isArray(geo.channels)?geo.channels:[]).slice(0,10).forEach(line=>{
    if(!Array.isArray(line)) return; const pts=line.filter(q=>Array.isArray(q)&&ok(q[0])&&ok(q[1])).map(q=>toG(q[0],q[1]));
    let lx=null, ly=null;
    for(let k=0;k<pts.length-1;k++){ const [x0,y0]=pts[k],[x1,y1]=pts[k+1], n=Math.ceil(Math.hypot(x1-x0,y1-y0)*3)+1;
      for(let s2=0;s2<=n;s2++){ const x=Math.floor(x0+(x1-x0)*s2/n), y=Math.floor(y0+(y1-y0)*s2/n); if(x<0||y<0||x>=W||y>=H) continue;
        if(lx!==null&&x!==lx&&y!==ly) ter[idx(x,ly)]=WATER; ter[idx(x,y)]=WATER; lx=x; ly=y; } }
  });
  const circles=(list,type)=>{ (Array.isArray(list)?list:[]).slice(0,14).forEach(c=>{
    if(!Array.isArray(c)||!ok(c[0])||!ok(c[1])||!ok(c[2])) return;
    const [gx,gy]=toG(c[0],c[1]), rad=clamp(c[2]*perKm,1,16);
    for(let y=0;y<H;y++) for(let x=0;x<W;x++){ const d=Math.hypot(x+0.5-gx,y+0.5-gy); if(ter[idx(x,y)]!==WATER && d<rad*(0.75+0.5*n2(x,y))) ter[idx(x,y)]=type; } }); };
  circles(geo.forests,FOREST); circles(geo.mountains,HILL);
  for(let i=0;i<W*H;i++) if(ter[i]===GRASS && n3(i%W,(i/W)|0)>0.76) ter[i]=FOREST;
  (Array.isArray(geo.water)?geo.water:[]).slice(0,24).forEach(poly=>{
    if(!Array.isArray(poly)) return;
    const pts=poly.filter(q=>Array.isArray(q)&&ok(q[0])&&ok(q[1])).slice(0,240).map(q=>toG(q[0],q[1]));
    if(pts.length<3) return;
    for(let y=0;y<H;y++) for(let x=0;x<W;x++){
      const px=x+0.5, py=y+0.5; let inside=false;
      for(let i=0,j=pts.length-1;i<pts.length;j=i++){ const [xi,yi]=pts[i],[xj,yj]=pts[j];
        if(((yi>py)!==(yj>py)) && px<(xj-xi)*(py-yi)/(yj-yi)+xi) inside=!inside; }
      if(inside) ter[idx(x,y)]=WATER;
    } });
  const list=[];
  const place=(t,kind,type,size)=>{
    let [gx,gy]=toG(t.lat,t.lon); gx=clamp(Math.round(gx-0.5),2,W-3); gy=clamp(Math.round(gy-0.5),2,H-3);
    if(ter[idx(gx,gy)]===WATER){ let best=null;
      for(let dy=-4;dy<=4;dy++) for(let dx=-4;dx<=4;dx++){ const x=gx+dx,y=gy+dy; if(x<2||y<2||x>W-3||y>H-3||ter[idx(x,y)]===WATER) continue;
        const d=Math.abs(dx)+Math.abs(dy); if(!best||d<best.d) best={x,y,d}; }
      if(!best) return null; gx=best.x; gy=best.y; }
    if(!farFrom(list,gx,gy,kind!=='town')) return null;
    const np=mkPlace(list,t.name.trim().slice(0,22),gx,gy,kind,type,size); np.lat=t.lat; np.lon=t.lon; return np;
  };
  srcT.slice().sort((a,b)=>(b.pop||0)-(a.pop||0)).forEach(t=>{ if(list.length<14) place(t,'town',TOWN_TYPES[t.type]&&t.type!=='farming'?t.type:'city',ok(t.pop)&&t.pop>0?t.pop:50000); });
  if(list.length<3) throw {code:'too_few'};
  srcV.slice(0,12).forEach(t=>place(t,'village','farming',ok(t.pop)&&t.pop>0?t.pop:3000));
  srcI.slice(0,8).forEach(t=>{ const ty=IND[t.type]?t.type:'farm'; place(t,'industry',ty,0); });
  srcA.slice(0,6).forEach(t=>place(t,'attraction',typeof t.kind==='string'?t.kind.slice(0,20):'park',0));
  const big=list.filter(p=>p.kind==='town'), lp=big.map(t=>Math.log10(Math.max(100,t.pop))), lo=Math.min(...lp), hi=Math.max(...lp);
  big.forEach((t,i)=>{ t.pop=Math.round(800+((lp[i]-lo)/((hi-lo)||1))*5200); });

// ---------- tenders, rival and events ----------
function newTender(r, first){
  const towns=S.towns.filter(p=>p.kind==='town').sort((a,b)=>b.pop-a.pop);
  const cand=[];
  for(const a of towns.slice(0,8)) for(const w of wishList(a)){
    const b=w.b, d=dist(a,b);
    if(d<8||rivalOn(a.id,b.id)) continue;
    if(S.lines.some(l=>l.stops.includes(a.id)&&l.stops.includes(b.id))) continue;
    if(S.tenders.some(t=>(t.state==='open'||t.state==='won')&&((t.a===a.id&&t.b===b.id)||(t.a===b.id&&t.b===a.id)))) continue;
    cand.push({a,b,d});
  }
  if(!cand.length) return;
  const c=cand[Math.floor(r()*Math.min(cand.length,6))];
  const mode = c.d>=20 && r()<0.6 ? 'rail' : 'any';
  const scale=clamp(Math.pow(Math.max(companyValue(),1)/3e6,0.55),1,80);
  const reward=Math.round((12000 + c.d*2200)*(mode==='rail'?1.7:1)*S.infl*scale/500)*500;
  S.tenders.push({ id:S.nextTender++, a:c.a.id, b:c.b.id, mode, reward, bidUntil:S.day+(first?75:60), deadline:S.day+(first?75:60)+720,
    state:'open', myBid:null, rivalBid:0.7+r()*0.3 });
  if(!first) toast(`New tender: link ${c.a.name} and ${c.b.name}${mode==='rail'?' by rail':''}.`, '');
}
function tenderDone(t){ return S.lines.some(l=>l.stops.includes(t.a)&&l.stops.includes(t.b)&&(t.mode==='any'||l.mode===t.mode)&&lineVehicles(l).some(v=>MODELS[v.model].kind==='pass')); }
function monthlyTenders(r){
  for(const t of S.tenders){
    const a=P(t.a), b=P(t.b);
    if(t.state==='open' && S.day>=t.bidUntil){
      if(t.myBid!=null && t.myBid<t.rivalBid){ t.state='won'; S.stats.tendersWon++; toast(`You won the ${a.name}–${b.name} tender at ${money(t.reward*t.myBid)}. Finish by ${dateStr(t.deadline)}.`,'good'); news(`Won tender ${a.name}–${b.name}.`); }
      else if(t.myBid==null && r()<0.5){ t.state='lapsed'; news(`Tender ${a.name}–${b.name} lapsed with no winner.`); }
      else { t.state='lost'; if(t.myBid!=null) S.stats.tendersLost++; S.rival.routes.push({a:t.a,b:t.b,mode:t.mode==='rail'?'rail':'road'}); S.rival.value+=t.reward*t.rivalBid;
        toast(`${RIVAL} won the ${a.name}–${b.name} tender${t.myBid!=null?` with ${Math.round(t.rivalBid*100)}%`:''}. Your demand on that route falls 40%.`,'bad'); news(`${RIVAL} now serves ${a.name}–${b.name}.`); }
    } else if(t.state==='won'){
      if(tenderDone(t)){ const pay=t.reward*t.myBid; t.state='done'; S.stats.tendersDone++; S.stats.income+=pay; S.money+=pay; S.m.tenders+=pay; toast(`Tender complete: ${a.name}–${b.name}. Paid ${money(pay)}.`,'good'); news(`Tender ${a.name}–${b.name} paid ${money(pay)}.`); }
      else if(S.day>t.deadline){ const pen=t.reward*t.myBid*0.25; t.state='failed'; S.money-=pen; S.m.tenders-=pen; toast(`Missed the ${a.name}–${b.name} deadline. Penalty ${money(pen)}.`,'bad'); news(`Missed tender ${a.name}–${b.name}.`); }
    }
  }
  S.tenders=S.tenders.filter(t=>t.state==='open'||t.state==='won'||S.day-t.bidUntil<720);

}
function news(txt){ if(ui.bg||(S.others&&S.others.length)) txt=S.region+': '+txt; S.news.unshift(dateStr(S.day)+': '+txt); S.news=S.news.slice(0,8); }
function monthlyEvents(r){
  S.events=S.events.filter(e=>e.until>S.day);

  const towns=S.towns.filter(p=>p.kind==='town'), pick=a=>a[Math.floor(r()*a.length)];
  const roll=r();
  if(roll<0.3){ const t=pick(towns); S.events.push({type:'festival',town:t.id,until:S.day+30}); toast(`Festival in ${t.name}! Travel there is up 150% this month.`,'good'); news(`Festival in ${t.name}.`); }

}

// ---------- simulation ----------
function step(dt){
  stepRegion(dt);
  const before=Math.floor(S.day/30);
  S.day+=dt;
  if(Math.floor(S.day/30)!==before) endMonth();
}
function stepRegion(dt){
  for(const a of S.towns){
    if(isPax(a)){
      const cap=Math.max(softPop(popD(a)),softPop(popO(a)))*0.06;
      for(const {f,rate} of (rates.get(a.id)||[])){
        let w=(a.waiting[f]||0)+rate*dt;
        const gone=w*0.02*dt; w-=gone; a.lost+=gone;
        if(w>cap){ a.lost+=w-cap; w=cap; }
        a.waiting[f]=w;
      }
    } else {
      const dests=fRoutes.get(a.id); const r=prodRate(a)*dt; a.produced+=r;
      if(dests&&dests.size){ const share=r/dests.size; for(const d of dests) a.cwait[d]=Math.min(600,(a.cwait[d]||0)+share); }
    }
  }
  for(const v of S.vehicles){
    const lp=linePaths.get(v.line); if(!lp||!lp.pts||lp.pts.length<2) continue;
    const l=lineById(v.line); if(l.suspendUntil>S.day) continue;
    if(v.wait>0){ v.wait-=dt; continue; }
    const target=lp.stopPos[v.next];
    v.pos+=v.dir*vSpeed(v)*dt;
    if((v.dir>0&&v.pos>=target)||(v.dir<0&&v.pos<=target)){ v.pos=target; arrive(v, v.next); }

}
const RKEYS=['terrain','towns','lines','vehicles','props','tenders','rival','events','region','seed','perf'];
function stashActive(){ const o={}; for(const k of RKEYS) o[k]=S[k]; o.roads=roads; o.rails=rails; o.planned=planned;

function activate(o){
  for(const k of RKEYS) S[k]=o[k];
  S.perf=S.perf||{rev:0,last:0}; S.events=S.events||[]; S.tenders=S.tenders||[]; S.rival=S.rival||{value:400000,routes:[]};
  if(o._rt){ terrain=S.terrain; roads=o.roads; rails=o.rails; planned=o.planned; ({placeTile,linePaths,overlay,laneOff,routes,fRoutes,rates,lineCount}=o._rt); netVer++; }
  else { S.roads=o.roads; S.rails=o.rails; S.planned=o.planned||new Array(W*H).fill(0); hydrate(); }
}
function simBackground(){
  if(!S.others||!S.others.length) return;
  const act=stashActive(); bgActive=act; ui.bg=true;
  try{
    for(let i=0;i<S.others.length;i++){
      bgIndex=i; activate(S.others[i]);
      for(let t=0;t<30;t+=0.5) stepRegion(0.5);
      regionMonth(false);
      S.others[i]=stashActive();
    }
  } finally { bgIndex=-1; bgActive=null; ui.bg=false; activate(act); }
}
function endMonth(){
  regionMonth(true);
  simBackground();
  intlMonth();
  globalMonth();
}
function regionMonth(isActive){
  const r=rng(Math.floor(S.day)*7+S.seed);
  let regionCost=0;
  for(const l of S.lines){ l.costLast=0; }
  for(const v of S.vehicles){ const c=runCost(v), l=lineById(v.line); S.m.run+=c; regionCost+=c; v.profitYear-=c; l.profitYear-=c; l.costLast+=c; l.life=(l.life||0)-c; }
  for(const l of S.lines){ if(S.stats && (!S.stats.best || l.life>S.stats.best.profit)) S.stats.best={ route:l.stops.map(x=>P(x).name).join(' – '), mode:l.mode, profit:l.life, id:l.id }; }
  for(const l of S.lines){ l.revLast=l.revM||0; l.offLast=l.offM||0; l.carLast=l.carM||0; l.revM=0; l.offM=0; l.carM=0; l.months=(l.months||0)+1; }
  const ap=S.towns.filter(t=>t.airport).length*AIRPORT_UPKEEP*S.infl; S.m.upkeep+=ap; regionCost+=ap;
  let rentTotal=0;
  for(const b of S.props){ const rent=propRent(b), up=propUpkeep(b); b.rentTotal+=rent; b.upkeepTotal+=up; b.lastNet=rent-up; rentTotal+=rent; S.m.rent+=rent; S.m.upkeep+=up; regionCost+=up; }
  if(isActive){ const byTown={}; for(const b of S.props) byTown[b.town]=(byTown[b.town]||0)+b.lastNet;
    for(const id in byTown){ const t=P(+id); floats.push({ x:t.x*T+T/2, y:t.y*T+T*1.6, txt:'rent '+signed(byTown[id]), life:2.6, rent:true }); } }
  S.money += rentTotal - regionCost; if(S.stats) S.stats.income+=rentTotal;
  S.perf=S.perf||{rev:0,last:0}; S.perf.last=S.perf.rev+rentTotal-regionCost; S.perf.rev=0;
  for(const p of S.towns){

      p.prod = clamp(p.prod*(p.shipShare>0.5?1.015:0.99), 0.7, 2.5);

    p.arrLast=p.arrivals; p.arrivals=0;
    if(p.kind==='attraction'){ p.boarded=0; p.lost=0; p.transfers=0; continue; }
    let g = !served ? 0.001 : p.rating>=0.45 ? Math.min(0.025,(p.rating-0.45)*0.05) : p.rating<0.3 ? -0.004 : 0;

  }
  for(const v of S.vehicles){
    const age=vAge(v), life=MODELS[v.model].life, l=lineById(v.line);

  }
  if(monthIdx()===0){
    for(const v of S.vehicles){ v.profitLast=v.profitYear; v.profitYear=0; }
    for(const l of S.lines){ l.profitLast=l.profitYear; l.profitYear=0; }
  }

}
function globalMonth(){
  S.m.interest=S.loan*loanRate()/12; S.money-=S.m.interest;
  S.hist.push({...S.m, cash:S.money, value:companyValue()}); if(S.hist.length>36) S.hist.shift(); S.m=freshMonth();
  ensureStats(); if(monthIdx()===0) S.stats.years.push({y:year(), v:Math.round(companyValue()), c:Math.round(S.money)});
  if(monthIdx()===0){
    S.infl*=1.03; S.fareInfl*=1.02;

    for(const k in MODELS) if(MODELS[k].year===year()) toast(`New model: ${MODELS[k].name}.`, 'good');
    for(const k in PT) if(PT[k].year===year()) toast(`New business: ${PT[k].name}.`, 'good');

// ---------- regions and international routes ----------
const REGION_COST = 100e6;
const allRegions = () => [S].concat(S.others||[]);
const regionObj = name => name===S.region ? S : (S.others||[]).find(o=>o.region===name);
const townOf = (reg,id) => { const o=regionObj(reg); return o ? o.towns[id] : null; };
function haversine(a,b){ if(a.lat==null||b.lat==null) return null; const R=6371, toR=Math.PI/180, dLa=(b.lat-a.lat)*toR, dLo=(b.lon-a.lon)*toR;
  const h=Math.sin(dLa/2)**2+Math.cos(a.lat*toR)*Math.cos(b.lat*toR)*Math.sin(dLo/2)**2; return 2*R*Math.asin(Math.sqrt(h)); }
function updateRegionBtn(){ const n=(S.others||[]).length; $('regionBtn').textContent=(S.region||'Random map')+(n?` · ${n+1} regions`:' · Regions'); }
function uniqueRegionName(n){ let name=n||'New region', k=2; while(allRegions().some(o=>o.region===name)) name=`${n} ${k++}`; return name; }
function openRegion(world, seed){
  if(S.money<REGION_COST) return false;
  S.money-=REGION_COST; S.m.build+=REGION_COST;
  S.others.push(stashActive());
  S.terrain=world.ter; S.towns=world.places; S.lines=[]; S.vehicles=[]; S.props=[]; S.tenders=[]; S.events=[]; S.perf={rev:0,last:0};
  S.rival={ value:Math.round(400000*S.infl*20), routes:[] }; S.region=uniqueRegionName(world.region||'Random region'); S.seed=seed;
  S.roads=new Array(W*H).fill(0); S.rails=new Array(W*H).fill(0); S.planned=new Array(W*H).fill(0);
  hydrate(); for(const l of world.plannedLines||[]) rasterPlanned(l); S.planned=Array.from(planned);
  newTender(rng(seed+5), true); renderStatic(); computeAll(); floats=[];
  news(`Opened the ${S.region} region.`); save(); return true;
}
function switchRegion(name){
  const i=S.others.findIndex(o=>o.region===name); if(i<0) return;
  const prev=stashActive(), o=S.others[i]; S.others[i]=prev; activate(o); renderStatic(); floats=[];
  setTool('inspect'); centerMap(); updateDots(); updateRegionBtn(); toast(`Now viewing ${S.region}.`); requestSave();

function borderTowns(o1,o2){ const names=new Set(o2.towns.filter(t=>t.kind==='town').map(t=>t.name)); return o1.towns.filter(t=>t.kind==='town'&&names.has(t.name)).map(t=>t.name); }
function railReachIn(o, fromId){
  // towns reachable by railway from a town, inside region o
  const act=o===S?null:stashActive(); let res=new Set();
  try{ if(act){ bgActive=act; bgIndex=S.others.indexOf(o); activate(o); }
    const p0=P(fromId), seen=new Uint8Array(W*H), q=[];
    for(let i=0;i<W*H;i++) if(placeTile[i]===fromId){ seen[i]=1; q.push(i); }
    while(q.length){ const c=q.pop(), x=c%W, y=(c/W)|0;
      for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){ const nx=x+dx, ny=y+dy; if(nx<0||ny<0||nx>=W||ny>=H) continue; const n=idx(nx,ny); if(seen[n]) continue; seen[n]=1;
        if(placeTile[n]>=0){ if(rails[c]||placeTile[c]>=0){ res.add(placeTile[n]); q.push(n); } continue; }
        if(rails[n]) q.push(n); } }
    res.delete(p0.id);
  } finally { if(act){ const idx2=S.others.indexOf(o); S.others[idx2]=stashActive(); bgActive=null; bgIndex=-1; activate(act); } }
  return res;
}
function intlCandidates(p){
  const out=[];
  for(const o of S.others||[]){
    if(p.airport) for(const t of o.towns.filter(t=>t.airport)){ const km=haversine(p,t); if(km) out.push({mode:'air', reg:o.region, t, km}); }
    for(const bn of borderTowns(S,o)){
      const bHere=S.towns.find(t=>t.name===bn&&t.kind==='town'); if(!bHere) continue;
      const hereOk = bHere.id===p.id || railReachIn(S,p.id).has(bHere.id); if(!hereOk) continue;
      const bThere=o.towns.find(t=>t.name===bn&&t.kind==='town'); const reach=railReachIn(o,bThere.id); reach.add(bThere.id);
      for(const id of reach){ const t=o.towns[id]; if(!t||t.kind==='industry'||t.name===p.name||t.name===bn) continue; const km=haversine(p,t); if(km) out.push({mode:'rail', reg:o.region, t, km, via:bn}); }

const intlTiles = (rt,a,b) => (haversine(a,b)||100)/10*(rt.mode==='rail'?1.3:1);

function intlStats(rt){
  const A=townOf(rt.a.r,rt.a.t), B=townOf(rt.b.r,rt.b.t); if(!A||!B) return null;
  const tiles=intlTiles(rt,A,B);
  let seats=0, run=0, sp=0;
  for(const v of rt.veh){ const m=MODELS[v.model]; const spd=m.speed*(1-CAR.slow*(v.cars||0)), cap=m.cap+(v.cars||0)*CAR.seats; seats+=cap*2/(2*(tiles/spd+2*DWELL[rt.mode])); sp=Math.max(sp,spd);
    run+=(m.run+(v.cars||0)*CAR.run)*S.infl*(1+0.05*vAge(v))*fuel(); }
  const t=tiles/Math.max(sp,1), modeF=clamp(1.4-t/12,0.35,1.35), fareF=Math.pow(rt.fareMult,-1.4);
  const att=q=>(q.kind==='attraction'?1.3:(TOWN_TYPES[q.type]?.attr??0.8));
  const demand=(softPop(popO(A))*softPop(popD(B))*att(B)+softPop(popO(B))*softPop(popD(A))*att(A))*modeF*fareF*1.3/((tiles+6)*40000);
  return { A, B, tiles, seats, demand, run, km:haversine(A,B)||0 };
}
function intlMonth(){
  for(const rt of S.intl||[]){
    const st=intlStats(rt); if(!st){ rt.revLast=0; rt.costLast=0; continue; }
    const carried=Math.min(st.demand,st.seats)*30, rev=carried*intlFare(rt,st.tiles)*rt.fareMult;
    rt.revLast=rev; rt.costLast=st.run; rt.loadLast=st.seats?Math.min(1,st.demand/st.seats):0;
    S.money+=rev-st.run; S.m.fares+=rev; S.m.run+=st.run; rt.profitYear=(rt.profitYear||0)+rev-st.run;
    if(S.stats){ S.stats.pax+=carried; S.stats.income+=rev; }

function startIntl(p, cand, model){

const closeBtn='<button class="x" data-act="close" aria-label="Close">×</button>';

function lineStats(l){
  const lp=linePaths.get(l.id), vs=lineVehicles(l), len=lp&&lp.cum.length?lp.cum[lp.cum.length-1]:1, wait=DWELL[l.mode];
  const st={pass:{seats:0,demand:0,n:0}, freight:{seats:0,demand:0,n:0}, run:0, old:vs.filter(v=>vAge(v)>MODELS[v.model].life), len};
  for(const v of vs){ const m=MODELS[v.model], rt=2*(len/vSpeed(v)+l.stops.length*wait); st[m.kind].seats+=vCap(v)*(m.kind==='freight'?1:2)/rt; st[m.kind].n++; st.run+=runCost(v); }

    else { const d=fRoutes.get(a); if(d&&d.size){ const on=[...d].filter(x=>l.stops.includes(x)).length; st.freight.demand+=prodRate(p)*on/d.size; } } }

function diagnose(l){

    add('cheap','riders pay too little',`Every ${l.mode==='air'?'plane':l.mode==='rail'?'train':'vehicle'} leaves ${Math.round(st.load*100)}% full, but each rider pays only about ${money(perRider)} on these short hops, less than the vehicles cost to run. More vehicles just add more loss.${st.pass.demand>st.pass.seats?' Far more people want to ride than you can carry, so higher fares will still fill every seat.':''}`,
      canRaise?{act:'fare',id:l.id,d:1,label:'Raise fares'}:{act:'removeOne',id:l.id,label:'Sell one vehicle'});
    if(l.mode==='rail'&&lineVehicles(l).length>3&&lineVehicles(l).some(v=>vCars(v)<CAR.max)) add('cars','use carriages',`Carriages add seats for ${money(CAR.run*S.infl)}/mo each, against ${money(runCost(lineVehicles(l)[0]))}/mo for a whole train. Fewer, longer trains cost much less.`,{act:'removeOne',id:l.id,label:'Sell one train'});

function lineChips(l){

function refreshSheet(){
  if(ui.tool==='line' && (ui.stops.length>=2||ui.editLine!=null) && !ui.plan) return linePlanSheet();
  if(ui.plan && ui.plan.kind==='build') return buildPlanSheet();
  const s=ui.sel; if(!s){ hideSheet(); return; }
  const back=()=>{ ui.sel={kind:'lines'}; linesSheet(); };

function railNeighbours(t){
  const seen=new Uint8Array(W*H), out=new Set(), q=[];
  for(let i=0;i<W*H;i++) if(placeTile[i]===t.id){ seen[i]=1; q.push(i); }
  while(q.length){ const c=q.pop(), x=c%W, y=(c/W)|0;
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){ const nx=x+dx, ny=y+dy; if(nx<0||ny<0||nx>=W||ny>=H) continue; const n=idx(nx,ny); if(seen[n]) continue; seen[n]=1;
      if(placeTile[n]>=0 && placeTile[n]!==t.id){ if(rails[c]) out.add(placeTile[n]); continue; }
      if(rails[n]) q.push(n); } }
  return [...out];
}

function careerChart(){
  const pts=(S.stats?.years||[]).concat([{y:year()+monthIdx()/12, v:Math.round(companyValue())}]);
  if(pts.length<2) return chart();
  const vals=pts.map(p=>p.v), mn=Math.min(0,...vals), mx=Math.max(...vals)||1, Wc=300, Hc=110;
  const px=i=>8+i*(Wc-16)/(pts.length-1), py=v=>Hc-14-(v-mn)/(mx-mn||1)*(Hc-28);
  const peak=vals.indexOf(mx);
  return `<svg class="chart" viewBox="0 0 ${Wc} ${Hc}" role="img" aria-label="Company value by year">
    <line x1="8" x2="${Wc-8}" y1="${py(0)}" y2="${py(0)}" stroke="#e1e4e8"/>
    <path d="${vals.map((v,i)=>(i?'L':'M')+px(i).toFixed(1)+' '+py(v).toFixed(1)).join(' ')}" fill="none" stroke="#1b2128" stroke-width="2.2" stroke-linejoin="round"/>
    <circle cx="${px(peak)}" cy="${py(mx)}" r="3.5" fill="#1f8a5b"/><circle cx="${px(pts.length-1)}" cy="${py(vals[vals.length-1])}" r="3.5" fill="#d2402f"/>
    <text x="8" y="10" font-size="10" fill="#6b7580" font-family="Barlow, sans-serif">${money(mx)}</text>
    <text x="8" y="${Hc-2}" font-size="10" fill="#6b7580" font-family="Barlow, sans-serif">${START_YEAR}</text>
    <text x="${Wc-8}" y="${Hc-2}" font-size="10" fill="#6b7580" text-anchor="end" font-family="Barlow, sans-serif">${year()}</text>
  </svg><p class="note" style="margin-top:2px">Company value by year · <span class="pos">●</span> peak · <span class="neg">●</span> end</p>`;
}
function whatWentWrong(){
  const h=S.hist.slice(-6); if(!h.length) return [];
  const avg=k=>h.reduce((s,x)=>s+(x[k]||0),0)/h.length;
  const inc=avg('fares')+avg('cargo')+avg('rent'), run=avg('run'), up=avg('upkeep'), int=avg('interest'), spend=avg('build')+avg('vehicles');
  const out=[];
  out.push(`In the last ${h.length} months you earned about ${money(inc)} a month but spent ${money(run+up+int)} a month running the company${spend>inc*0.3?`, plus ${money(spend)} a month on new building and vehicles`:''}.`);
  if(inc>run+up+int) out.push(`Day-to-day running was profitable, so the cash crunch came from one-off costs: ${spend>0?money(spend*h.length)+' spent on building and vehicles in that time, ':''}${S.loan>0?'a '+money(S.loan)+' loan, ':''}or penalties. Spend only cash you can spare, and keep some in reserve.`);
  const losers=S.lines.map(l=>({l,d:diagnose(l)})).filter(x=>x.d.losing).sort((a,b)=>(a.d.rev-a.d.cost)-(b.d.rev-b.d.cost));
  if(losers.length){ const w=losers[0]; const why=w.d.reasons.find(x=>!['new','air','fuel'].includes(x.key)&&!x.key.startsWith('under'));
    out.push(`${losers.length} line${losers.length>1?'s were':' was'} losing money. The worst, line ${w.l.id} (${w.l.stops.map(x=>esc(P(x).name)).join(' – ')}), lost ${money(w.d.cost-w.d.rev)} a month${why?`: ${esc(why.short)}`:''}.`); }
  if(int>inc*0.15) out.push(`Loan interest took ${money(int)} a month, ${Math.round(int/Math.max(inc,1)*100)}% of income.`);
  const old=S.vehicles.filter(v=>vAge(v)>MODELS[v.model].life).length; if(old) out.push(`${old} vehicle${old>1?'s were':' was'} worn out, costing more to run and breaking down often.`);
  const ap=S.towns.filter(t=>t.airport).length; if(ap && up>inc*0.25) out.push(`Upkeep for ${ap} airport${ap>1?'s':''} and businesses came to ${money(up)} a month.`);
  if(S.fuelUntil>S.day-180) out.push('A fuel price spike pushed running costs up 30% near the end.');
  const lost=S.tenders.filter(t=>t.state==='failed').length; if(lost) out.push(`${lost} tender deadline${lost>1?'s were':' was'} missed, each with a penalty.`);
  return out;
}

const mapPrompt = place => `You generate map data for a transport tycoon game set in a real place. The player typed: ${JSON.stringify(place)}.
Return ONLY a JSON object, no markdown, no commentary:
{"region":"short display name","towns":[{"name":"","lat":0,"lon":0,"pop":0,"type":"city"}],"villages":[{"name":"","lat":0,"lon":0,"pop":0}],"industries":[{"name":"","lat":0,"lon":0,"type":"farm"}],"attractions":[{"name":"","lat":0,"lon":0,"kind":"beach"}],"roads":[[[lat,lon],[lat,lon]]],"water":[[[lat,lon],[lat,lon]]],"mountains":[[lat,lon,radius_km]],"forests":[[lat,lon,radius_km]]}
Rules:
- Pick the scale from the place: a city gives districts, a region or country gives towns and cities, a continent gives major cities.
- "towns": 10 to 14 real major places spread across the area, real approximate coordinates (decimal degrees) and populations. "type" is one of capital, city, port, resort, university, industrial, market, matching the real place (at most one capital).
- "villages": 6 to 12 real smaller places, preferably on main roads between towns.
- "industries": 4 to 8 real or typical sites: "type" farm (plantations, farmland), mine (mines, quarries, oil fields) or factory (industrial parks, refineries, steel works).
- "attractions": 3 to 6 real tourist spots (beaches, islands, highlands, national parks, heritage sites); "kind" is a short word.
- "roads": 6 to 14 polylines tracing the real main highways between towns, 4 to 20 points each.
- "water": polygons of sea, ocean, big lakes, wide estuaries inside the bounding box of all places extended by 10% on every side. Trace the real coastline with 12 to 40 points per polygon and extend sea polygons past the box edge. Never cover land or places. [] if none.
- "mountains" and "forests": up to 10 circles each over real ranges and large forests or parks.
- If the place is vague, choose the most likely real match.`;
async function buildRealMap(place){
  ui.mapCtl?.abort(); const ctl=new AbortController(); ui.mapCtl=ctl;
  ui.sel={kind:'loading'}; loadingSheet(place,0);
  let lastDraw=0;
  try{
    const geo=await sampleFn.json(mapPrompt(place), { signal:ctl.signal, modelTier:'default',
      onText:({text})=>{ const n=performance.now(); if(n-lastDraw>400 && ui.sel?.kind==='loading'){ lastDraw=n; loadingSheet(place,text.length); } } });
    if(ctl.signal.aborted) return;
    let h=0; for(const ch of place.toLowerCase()) h=(h*31+ch.charCodeAt(0))|0;
    const world=geoWorld(geo||{}, h);
    if(ui.regionMode){ ui.regionMode=false; if(openRegion(world,h)){ setTool('inspect'); centerMap(); setSpeed(1); updateDots(); updateRegionBtn(); toast(`Opened ${S.region}.`,'good'); } else { ui.sel={kind:'regions'}; regionsSheet(); } return; }
    newGame(h, world); S.seenIntro=false; save();
    setTool('inspect'); centerMap(); setSpeed(1); updateDots();
    ui.sel={kind:'intro'}; introSheet();
  }catch(e){
    if(ctl.signal.aborted || e?.code==='cancelled') return;
    ui.sel={kind:'map'};
    mapSheet(e?.code==='not_granted' ? 'Claude access was declined, so real maps are off for this visit. Try a random map.'
      : e?.code==='rate_limited' ? 'Too many requests right now. Wait a minute and try again.'
      : e?.code==='too_few' ? 'Claude could not find enough towns there. Try a bigger area or a different spelling.'
      : 'That map could not be built. Try again, or a different spelling.');
  }finally{ if(ui.mapCtl===ctl) ui.mapCtl=null; }
}

const ptrs=new Map(); let gesture=null;
cv.addEventListener('pointerdown', e=>{
  cv.setPointerCapture(e.pointerId); ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1) gesture={ moved:0, multi:false, t:performance.now() }; else if(gesture) gesture.multi=true;
});
cv.addEventListener('pointermove', e=>{
  const p=ptrs.get(e.pointerId); if(!p) return;
  const prev=[...ptrs.values()].map(q=>({...q}));
  const dx=e.clientX-p.x, dy=e.clientY-p.y; p.x=e.clientX; p.y=e.clientY;
  if(!gesture) return;
  if(ptrs.size===1){ gesture.moved+=Math.abs(dx)+Math.abs(dy); if(gesture.moved>8){ cam.x-=dx/cam.z; cam.y-=dy/cam.z; clampCam(); } }
  else if(ptrs.size===2){
    const now=[...ptrs.values()];
    const d0=Math.hypot(prev[0].x-prev[1].x,prev[0].y-prev[1].y), d1=Math.hypot(now[0].x-now[1].x,now[0].y-now[1].y);
    const mx=(now[0].x+now[1].x)/2, my=(now[0].y+now[1].y)/2, pmx=(prev[0].x+prev[1].x)/2, pmy=(prev[0].y+prev[1].y)/2;
    if(d0>0) zoomAt(mx,my,d1/d0);
    cam.x-=(mx-pmx)/cam.z; cam.y-=(my-pmy)/cam.z; clampCam();
  }
});
function endPtr(e){
  if(!ptrs.has(e.pointerId)) return; ptrs.delete(e.pointerId);
  if(ptrs.size===0&&gesture){ if(!gesture.multi&&gesture.moved<=8&&performance.now()-gesture.t<600) tap(e.clientX,e.clientY); gesture=null; }
}
cv.addEventListener('pointerup',endPtr); cv.addEventListener('pointercancel',endPtr);

function zoomAt(mx,my,f){ const w=s2w(mx,my); cam.z*=f; clampCam(); cam.x=w.x-(mx-cw/2)/cam.z; cam.y=w.y-(my-ch/2)/cam.z; clampCam(); }

function b64(buf){ const u=new Uint8Array(buf); let s=''; for(let i=0;i<u.length;i+=0x8000) s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000)); return btoa(s); }
function unb64(str){ const s=atob(str.replace(/\s+/g,'')), u=new Uint8Array(s.length); for(let i=0;i<s.length;i++) u[i]=s.charCodeAt(i); return u; }
async function exportCode(){
  const json=serialize();
  if(window.CompressionStream){ try{ const st=new Blob([json]).stream().pipeThrough(new CompressionStream('gzip')); return 'LW1g:'+b64(await new Response(st).arrayBuffer()); }catch(e){} }
  return 'LW1j:'+b64(new TextEncoder().encode(json));
}
async function importCode(code){
  code=(code||'').trim(); let json;
  if(code.startsWith('LW1g:')){ const st=new Blob([unb64(code.slice(5))]).stream().pipeThrough(new DecompressionStream('gzip')); json=await new Response(st).text(); }
  else if(code.startsWith('LW1j:')) json=new TextDecoder().decode(unb64(code.slice(5)));
  else if(code.startsWith('{')) json=code;
  else throw new Error('format');
  const prev=serialize();
  if(!loadGame(json)){ loadGame(prev); throw new Error('bad'); }
  S.savedAt=Date.now(); save();
}

  const losingBiz=S.props.filter(b=>(b.lastNet??(propRent(b)-propUpkeep(b)))<0);
  return { worn, ageing, outdated, wornCost:cost(worn), ageCost:cost(worn.concat(ageing)), upCost:cost(outdated), losingBiz, bizValue:losingBiz.reduce((s2,b)=>s2+propValue(b),0) };

const autoReserve = () => Math.max(50000*S.infl, S.vehicles.reduce((s2,v)=>s2+runCost(v),0)*2);
function autopilot(){
  const a=autos(); if(!a.replace&&!a.fares&&!a.cars) return;
  const reserve=autoReserve(), log=[];
  if(a.replace){ let n=0, spent=0;
    for(const v of S.vehicles.filter(v=>vAge(v)>MODELS[v.model].life).sort((x,y)=>vAge(y)-vAge(x))){
      const l=lineById(v.line), cost=price(bestModel(l.mode,MODELS[v.model].kind))-vehValue(v); if(S.money-cost<reserve) break;
      if(replaceVehicle(v)){ n++; spent+=cost; } }
    if(n) log.push(`replaced ${n} vehicle${n>1?'s':''} (${money(spent)})`); }
  if(a.fares){ let up=0, down=0;
    for(const l of S.lines){ const st=lineStats(l); if(st.load==null||!st.pass.n) continue;
      if(st.load>=0.9 && st.pass.demand>st.pass.seats*1.15 && l.fareMult<FARE_MAX){ l.fareMult=Math.min(FARE_MAX,Math.round((l.fareMult+(st.pass.demand>st.pass.seats*2?0.3:0.1))*10)/10); up++; }
      else if(st.load<0.4 && l.fareMult>0.7){ l.fareMult=Math.round((l.fareMult-0.1)*10)/10; down++; } }
    if(up||down){ computeAll(); log.push(`fares ${up?'up on '+up+' line'+(up>1?'s':''):''}${up&&down?', ':''}${down?'down on '+down+' line'+(down>1?'s':''):''}`); } }
  if(a.cars){ let n=0;
    for(const l of S.lines){ if(l.mode!=='rail') continue; const st=lineStats(l); if(!(l.revLast>l.costLast)) continue;
      for(const kind of ['pass','freight']){ const k=st[kind]; if(!k.n||k.demand<=k.seats*1.2) continue;
        const v=lineVehicles(l).filter(x=>MODELS[x.model].kind===kind&&vCars(x)<CAR.max).sort((x,y)=>vCars(x)-vCars(y))[0];
        if(v && S.money-carPrice()>=reserve){ v.cars=(v.cars||0)+1; v.paid+=carPrice(); S.money-=carPrice(); S.m.vehicles+=carPrice(); n++; } } }
    if(n) log.push(`added ${n} carriage${n>1?'s':''}`); }
  if(log.length){ toast('Autopilot: '+log.join('; ')+'.','good'); news('Autopilot '+log.join('; ')+'.'); }
}

  const L=S.legacy||loadLegacy(), mine=(L.hall||[]).slice().sort((a,b)=>b.sale-a.sale);
  const best=mine[0]?.sale||0, cur=companyValue();
  const board=TYCOONS.map(([n,v])=>({n,v,you:false})).concat(best?[{n:'You (best sale)',v:best,you:true}]:[]).concat([{n:'You (this company)',v:cur,you:true,cur:true}]).sort((a,b)=>b.v-a.v);
  showSheet(`<h2>Hall of fame${closeBtn}</h2><div class="sub">Founder reputation level ${repLevel()} · ${mine.length} compan${mine.length===1?'y':'ies'} sold</div>
  <h3>Tycoon rankings</h3>
  <div class="rows">${board.map((x,i)=>`<div class="row"><span style="color:var(--ink)${x.you?';font-weight:700':''}">${i+1}. ${esc(x.n)}</span><b>${money(x.v)}</b></div>`).join('')}</div>
  <h3>Your companies</h3>
  ${mine.length?`<div class="rows">${mine.map(h=>`<div class="row"><span style="color:var(--ink)">${esc(h.regions)}<small class="m">${h.from}–${h.to} · peak ${money(h.peak)} · bought by ${esc(h.buyer)}</small></span><b>${money(h.sale)}</b></div>`).join('')}</div>`:'<p class="note">None sold yet. Sell a company from the Company tab to enter the hall.</p>'}
  <p class="note">Each sale raises your founder reputation (up to level 10): new companies start with more cash, cheaper loans and a bigger loan limit.</p>
  <div class="btns"><button class="btn" data-act="sellCo">Sell the company</button></div>`);
}
function soldSheet(h){
  showSheet(`<h2>Sold to ${esc(h.buyer)}</h2><div class="sub">${esc(h.regions)} · ${h.from}–${h.to}</div>
  <div class="stats"><div class="stat wide"><span>Sale price</span><b>${money(h.sale)}</b><small>peak value ${money(h.peak)}</small></div></div>
  ${statsGrid(true)}
  <p class="pos" style="font-weight:600">Founder reputation is now level ${repLevel()}. Your next company starts with ${money(80000*(1+0.5*repLevel()))} and loans at ${(loanRate()*100).toFixed(1)}%.</p>
  <div class="btns"><button class="btn pri" data-act="newgame">Start a new company</button><button class="btn" data-act="hall">Hall of fame</button></div>`);
}
function backupSheet(){
  const last=S.lastBackup?new Date(S.lastBackup).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'}):'never';
  showSheet(`<h2>Backup and restore${closeBtn}</h2><div class="sub">Last backup: ${last} · company value ${money(companyValue())}</div>
  <p>Your game is saved on this device only. Copy this code into Notes or a message to yourself, ${IN_CLAUDE?'':'or download a save file, '}so you can restore it anywhere.</p>
  <textarea id="bcode" class="field" rows="4" readonly style="font-size:12px;font-family:ui-monospace,monospace;word-break:break-all">${ui.backupCode?esc(ui.backupCode):'Preparing backup code…'}</textarea>
  <div class="btns"><button class="btn pri" data-act="copyBackup" ${ui.backupCode?'':'disabled'}>Copy backup code</button>${IN_CLAUDE?'':`<button class="btn" data-act="downloadBackup" ${ui.backupCode?'':'disabled'}>Download save file</button>`}</div>
  <h3>Restore a company</h3>
  <textarea id="rcode" class="field" rows="3" placeholder="Paste a backup code here" style="font-size:12px;font-family:ui-monospace,monospace"></textarea>
  <div class="btns"><button class="btn warn" data-act="restore">${ui.confirm==='restore'?'Tap again to replace this company':'Restore from code'}</button>
  <label class="btn" style="text-align:center;display:flex;align-items:center;justify-content:center;cursor:pointer">Open save file<input id="rfile" type="file" accept=".txt,.json,text/plain,application/json" hidden></label></div>
  <p class="note">Restoring replaces the company on this device.</p>`);
  if(!ui.backupCode) exportCode().then(c=>{ ui.backupCode=c; if(ui.sel&&ui.sel.kind==='backup') backupSheet(); });
}
function markBackedUp(){ S.lastBackup=Date.now(); save(); }

// ---------- time away ----------
const AWAY_DAYS_PER_HOUR=60, AWAY_MAX_DAYS=360;
function fmtDur(ms){ const m=Math.round(ms/60000); if(m<60) return m+' min'; const h=Math.floor(m/60); if(h<48) return h+' h '+(m%60)+' min'; return Math.floor(h/24)+' days'; }
function catchUp(ms){
  if(!S||S.over||!(ms>120000)) return false;
  const days=Math.min(ms/3600000*AWAY_DAYS_PER_HOUR, AWAY_MAX_DAYS); if(days<1) return false;
  const m0=S.money, v0=companyValue(), d0=S.day, n0=S.news[0], mo0=Math.floor(S.day/30);
  ui.quiet=true; let left=days; while(left>0){ const d=Math.min(0.25,left); step(d); left-=d; } ui.quiet=false;
  const passed=Math.floor(S.day/30)-mo0, rec=S.hist.slice(-Math.min(passed,S.hist.length));
  const sum=k=>rec.reduce((s,h)=>s+(h[k]||0),0);
  const fresh=[]; for(const n of S.news){ if(n===n0) break; fresh.push(n); }
  ui.away={ ms, d0, d1:S.day, money:S.money-m0, value:companyValue()-v0, fares:sum('fares'), cargo:sum('cargo'), rent:sum('rent'), tenders:sum('tenders'),
    costs:sum('run')+sum('upkeep')+sum('interest'), news:fresh.slice(0,6), capped:ms/3600000*AWAY_DAYS_PER_HOUR>AWAY_MAX_DAYS, debt:S.debtMonths };
  save(); updateDots(); return true;
}
function awaySheet(){
  const a=ui.away; if(!a){ hideSheet(); return; }
  const losing=S.lines.filter(l=>diagnose(l).losing).length;
  showSheet(`<h2>While you were away${closeBtn}</h2><div class="sub">${fmtDur(a.ms)} · ${dateStr(a.d0)} → ${dateStr(a.d1)}</div>
  <div class="rows">
    <div class="row"><span>Cash</span>${pl(a.money)}</div>
    <div class="row"><span>Company value</span>${pl(a.value)}</div>
    <div class="row"><span>Passenger fares</span><b class="pos">${money(a.fares)}</b></div>
    <div class="row"><span>Freight</span><b class="pos">${money(a.cargo)}</b></div>
    <div class="row"><span>Business rent</span><b class="pos">${money(a.rent)}</b></div>
    ${a.tenders?`<div class="row"><span>Tenders</span>${pl(a.tenders)}</div>`:''}
    <div class="row"><span>Running costs, upkeep and interest</span><b class="neg">${money(-a.costs)}</b></div>
  </div>
  ${a.debt?'<p class="neg">Cash went negative while you were away. Borrow or sell soon, or the bank will close the company.</p>':''}
  ${losing?`<p class="warnc">${losing} line${losing>1?'s are':' is'} losing money. Open Lines to see why.</p>`:''}
  ${a.news.length?`<h3>What happened</h3><div class="rows">${a.news.map(n=>`<div class="row"><span>${esc(n)}</span><b></b></div>`).join('')}</div>`:''}
  <p class="note">Your company keeps running while the game is closed: each real hour is about two game months, up to one game year${a.capped?' (this visit hit the limit)':''}.</p>
  <div class="btns"><button class="btn pri" data-act="close">Continue</button>${losing?'<button class="btn" data-act="tool" data-t="lines">Open Lines</button>':''}</div>`);
}
function showAway(){ ui.sel={kind:'away'}; markTool(null); awaySheet(); }

// ---------- loop ----------
let lastT=performance.now(), saveTimer=0, sheetTimer=0;
function frame(now){
  const dt=Math.min(0.1,(now-lastT)/1000); lastT=now;
  if(ui.speed>0 && !S.over){ let days=dt*ui.speed*2; while(days>0){ const d=Math.min(0.25,days); step(d); days-=d; } }
  floats.forEach(f=>f.life-=dt); floats=floats.filter(f=>f.life>0);
  draw(); hud();
  saveTimer+=dt; if((saveDirty && now-lastSave>6000) || saveTimer>20){ saveTimer=0; save(); }
  sheetTimer+=dt; if(sheetTimer>0.5){ sheetTimer=0; refreshCosts(); if(ui.sel&&ui.sel.kind==='veh') refreshSheet(); if(ui.layer==='problems') refreshProblems(); }
  requestAnimationFrame(frame);
}
function start(data){
  resize();
  try{ navigator.storage?.persist?.(); }catch(e){}
  let raw=typeof data?.save==='string'?data.save:null;
  if(!raw){ try{ raw=localStorage.getItem(SAVE_KEY); }catch(e){} }
  const fromHot=typeof data?.save==='string';
  let away=false;
  if(raw&&loadGame(raw)){ if(!fromHot&&S.seenIntro) away=catchUp(Date.now()-(S.savedAt||Date.now())); }
  else newGame(20261127);
  centerMap(); setTool('inspect'); markTool(null); setSpeed(S.over?0:1); updateDots(); updateRegionBtn();
  if(S.over&&S.sold){ ui.soldInfo=S.sold; ui.sel={kind:'sold'}; soldSheet(S.sold); }
  else if(S.over){ ui.sel={kind:'over'}; overSheet(); }
  else if(away) showAway();
  else if(!S.seenIntro){ ui.sel={kind:'intro'}; introSheet(); }
  requestAnimationFrame(t=>{ lastT=t; frame(t); });
}
addEventListener('resize',resize);
let hiddenAt=0;
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){ hiddenAt=Date.now(); save(); }
  else if(hiddenAt && S && !S.over){ const ms=Date.now()-hiddenAt; hiddenAt=0; if(catchUp(ms)) showAway(); }
});
window.claude?.hot?.snapshot?.(()=>({ save:serialize() }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
