<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Stackt</title>

<!-- iOS / Android home-screen app behavior -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Stackt">
<meta name="theme-color" content="#FF3B6B">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.json">

<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- Splash. Inlined rather than in the stylesheet so it paints on the very
     first frame, before css/styles.css or any module has loaded. main.js
     dismisses it once the store is ready. -->
<style>
  #splash {
    position: fixed;
    inset: 0;
    z-index: 999;
    background: #FF3B6B;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    transition: opacity .32s ease, visibility .32s ease;
  }
  #splash.done { opacity: 0; visibility: hidden; }
  #splash .mark {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 54px;
    font-weight: 900;
    letter-spacing: -1.5px;
    color: #FFF8F0;
    margin: 0;
    animation: splashPop .5s cubic-bezier(.2,.8,.3,1) both;
  }
  #splash .mark span { color: #E8102D; }
  #splash .bar {
    width: 84px;
    height: 5px;
    border-radius: 999px;
    background: rgba(255,248,240,0.32);
    overflow: hidden;
    animation: splashPop .5s cubic-bezier(.2,.8,.3,1) .08s both;
  }
  #splash .bar i {
    display: block;
    width: 40%;
    height: 100%;
    border-radius: inherit;
    background: #FFF8F0;
    animation: splashSlide 1s ease-in-out infinite;
  }
  @keyframes splashPop {
    from { opacity: 0; transform: scale(.86); }
    to   { opacity: 1; transform: scale(1); }
  }
  @keyframes splashSlide {
    0%   { transform: translateX(-110%); }
    100% { transform: translateX(360%); }
  }
  @media (prefers-reduced-motion: reduce) {
    #splash .mark, #splash .bar, #splash .bar i { animation: none; }
  }
</style>
<div id="splash">
  <p class="mark">Stackt<span>.</span></p>
  <div class="bar"><i></i></div>
</div>

<div id="app">

  <header class="app-header">
    <button id="homeBtn" class="logo-btn" aria-label="Home">
      <span id="backArrow" class="back-arrow hidden">←</span>
      <h1 class="logo">Stackt<span class="logo-dot">.</span></h1>
    </button>
    <button id="addBtn" class="fab-inline hidden" aria-label="Add item">+</button>
  </header>

  <main id="view" class="view"></main>

</div>

<div id="modalRoot"></div>
<div id="celebrationRoot"></div>

<script src="js/vendor/html5-qrcode.min.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
