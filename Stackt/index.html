<!DOCTYPE html>
<html lang="en" class="splash-up">
<head>
<meta charset="UTF-8">
<!-- No maximum-scale/user-scalable: iOS has ignored both since iOS 10, and on
       browsers that honour them they block pinch-zoom. The real cure for the
       focus-zoom is 16px inputs, which css/styles.css now guarantees. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stackt</title>

<!-- iOS / Android home-screen app behavior -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Stackt">
<meta name="theme-color" content="#FF3B6B">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.json">

<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- Splash. Inlined rather than in the stylesheet so it paints on the very
     first frame, before css/styles.css or any module has loaded. main.js
     dismisses it once the store is ready. -->
<style>
  /* Painting the root itself means any strip the fixed overlay doesn't cover —
     iOS's dynamic viewport and the home-indicator area are the usual culprits —
     is pink rather than a white gap. Removed once the splash is dismissed. */
  html.splash-up, html.splash-up body { background: #FF3B6B; }

  #splash {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    min-height: 100%;
    z-index: 999;
    background: #FF3B6B;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    transition: opacity .3s ease;
  }
  #splash.done { opacity: 0; }
  #splash .mark {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 54px;
    font-weight: 900;
    letter-spacing: -1.5px;
    color: #FFF8F0;
    margin: 0;
    animation: splashPop .5s cubic-bezier(.2,.8,.3,1) both;
  }
  #splash .mark span { color: #E8102D; }
  #splash .bar {
    width: 84px;
    height: 5px;
    border-radius: 999px;
    background: rgba(255,248,240,0.32);
    overflow: hidden;
    animation: splashPop .5s cubic-bezier(.2,.8,.3,1) .08s both;
  }
  #splash .bar i {
    display: block;
    width: 100%;
    height: 100%;
    border-radius: inherit;
    background: #FFF8F0;
    transform-origin: left center;
    animation: splashFill 1.1s cubic-bezier(.3,.7,.4,1) infinite;
  }
  @keyframes splashPop {
    from { opacity: 0; transform: scale(.86); }
    to   { opacity: 1; transform: scale(1); }
  }
  @keyframes splashFill {
    0%   { transform: scaleX(0); opacity: 1; }
    70%  { transform: scaleX(1); opacity: 1; }
    100% { transform: scaleX(1); opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    #splash .mark, #splash .bar, #splash .bar i { animation: none; }
  }
</style>
<div id="splash">
  <p class="mark">Stackt<span>.</span></p>
  <div class="bar"><i></i></div>
</div>

<div id="app">

  <header class="app-header">
    <button id="homeBtn" class="logo-btn" aria-label="Home">
      <span id="backArrow" class="back-arrow hidden">←</span>
      <h1 class="logo">Stackt<span class="logo-dot">.</span></h1>
    </button>
    <button id="shareShelfBtn" class="fab-inline share-fab hidden" aria-label="Share my collection"></button>
    <button id="addBtn" class="fab-inline hidden" aria-label="Add item">+</button>
    <button id="settingsBtn" class="fab-inline settings-fab hidden" aria-label="Settings"></button>
  </header>

  <main id="view" class="view"></main>

</div>

<div id="modalRoot"></div>
<div id="celebrationRoot"></div>

<script src="js/vendor/html5-qrcode.min.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
